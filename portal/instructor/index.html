          current.criteria.forEach(function (c) { var inp = grid.querySelector('input[data-c="' + c.id + '"]'), v = inp ? parseFloat(inp.value) : NaN; if (!isNaN(v)) scores[c.id] = v; });
          var body = { action: 'grade', enrollment_id: parseInt(card.getAttribute('data-eid'), 10), rubric_id: current.id, scores: scores, type_code: form.elements.type.value, feedback: form.elements.feedback.value.trim() };
          var orig = submit.innerHTML; submit.disabled = true; submit.innerHTML = 'Scoring…';
          API.request('instructor/rubrics', { method: 'POST', body: body }).then(function (r) {
            submit.innerHTML = orig; gbApplyResult(card, r.result); gbCache = null;
            var box = card.querySelector('.gb-marks'); if (box && !box.hidden) gbLoadMarks(card);
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Rubric scored — ' + (r.computed ? r.computed.percent + '%' : 'done') + '.', 'success');
          }).catch(function (err) {
            submit.disabled = false; submit.innerHTML = orig;
            var msg = (err && err.body && err.body.error) || 'try again';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not score: ' + msg, 'error'); else alert('Could not score.');
          });
        });
      }
      function openRubricPanel(card) {
        var box = card.querySelector('.gb-rubric');
        if (!box.hidden) { box.hidden = true; return; }
        box.hidden = false; box.innerHTML = '<div style="padding:14px 18px">' + empty('circle-notch fa-spin', 'Loading rubrics…') + '</div>';
        loadRubrics().then(function (rubrics) { box.innerHTML = rubricPanelHtml(rubrics); wireRubricForm(card, rubrics); })
          .catch(function () { box.innerHTML = '<div style="padding:14px 18px">' + empty('triangle-exclamation', 'Could not load rubrics.') + '</div>'; });
      }
      function openNewRubric() {
        var host = document.getElementById('gbRubricNew'); if (!host) return;
        if (host.innerHTML) { host.innerHTML = ''; return; }
        host.innerHTML = '<form id="gbRubricCreate" style="padding:12px 22px 18px;display:grid;gap:10px;border-top:1px solid var(--border)">'
          + '<div class="field"><label>Rubric title</label><input name="title" placeholder="e.g. Piano technique — Grade 2" required></div>'
          + '<div class="field"><label>Criteria — one per line: <code>Label | max points | weight</code></label>'
          + '<textarea name="criteria" rows="5" placeholder="Note accuracy | 10 | 1&#10;Rhythm &amp; timing | 10 | 1&#10;Expression | 10 | 0.5"></textarea></div>'
          + '<div><button type="submit" class="btn btn-primary" style="padding:8px 14px"><i class="fa-solid fa-plus"></i> Create rubric</button></div></form>';
        document.getElementById('gbRubricCreate').addEventListener('submit', function (ev) {
          ev.preventDefault();
          var title = this.elements.title.value.trim();
          var criteria = this.elements.criteria.value.split('\n').map(function (line) {
            var p = line.split('|'); if (!p[0] || !p[0].trim()) return null;
            return { label: p[0].trim(), max_points: parseInt(p[1], 10) || 10, weight: parseFloat(p[2]) || 1 };
          }).filter(Boolean);
          if (!title || !criteria.length) { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Add a title and at least one criterion.', 'error'); return; }
          var btn = this.querySelector('button[type=submit]'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Creating…';
          API.request('instructor/rubrics', { method: 'POST', body: { action: 'create', title: title, criteria: criteria } }).then(function (r) {
            gbRubrics = (r && r.rubrics) || null; host.innerHTML = '';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Rubric created.', 'success');
          }).catch(function (err) {
            btn.disabled = false; btn.innerHTML = orig;
            var msg = (err && err.body && err.body.error) || 'try again';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not create: ' + msg, 'error'); else alert('Could not create rubric.');
          });
        });
      }

      // Build cohort index (preserving order from API, which sorts by cohort title)
      var cohortMap = {}, cohortOrder = [];
      ens.forEach(function (e) {
        var key = String(e.cohort_id || 0);
        if (!cohortMap[key]) {
          cohortMap[key] = e.cohort_title || (e.cohort_id ? 'Cohort #' + e.cohort_id : 'Ungrouped');
          cohortOrder.push(key);
        }
      });

      function makeProgressBar(score, outcome) {
        var pct = score != null ? Math.min(100, Math.round(score)) : 0;
        var fillCol = score == null ? 'var(--border)' : (outcome === 'pass' ? '#34D399' : '#F87171');
        var pmPct   = Math.min(100, passmark);
        return '<div style="position:relative;height:6px;background:var(--border);border-radius:3px;margin-top:6px;width:100%;max-width:220px">'
          + '<div class="gb-progress-inner" style="position:absolute;inset:0;right:auto;width:' + pct + '%;background:' + fillCol + ';border-radius:3px;transition:width .3s"></div>'
          + '<div style="position:absolute;top:-3px;left:' + pmPct + '%;width:2px;height:12px;background:rgba(128,128,128,.45);border-radius:1px" title="Pass mark ' + passmark + '%"></div>'
          + '</div>';
      }

      function buildCard(e) {
        return '<div class="panel" data-eid="' + e.id + '" style="margin-bottom:8px">'
          + '<div class="panel-head" style="align-items:flex-start;gap:10px">'
          + '<div style="flex:1;min-width:0"><h2 style="font-size:.97rem;margin:0">' + P.escapeHtml(e.student_name)
          + '<span style="color:var(--text-muted);font-weight:500"> — ' + P.escapeHtml(e.course_name) + (e.level_name ? ' · ' + P.escapeHtml(e.level_name) : '') + '</span></h2>'
          + makeProgressBar(e.total_score, e.outcome) + '</div>'
          + '<span style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px"><span class="gb-result">' + gradePill(e) + '</span>'
          + '<button type="button" class="btn btn-ghost gb-rubric-btn" style="padding:4px 10px;font-size:.74rem"><i class="fa-solid fa-table-cells"></i> Rubric</button> '
          + '<button type="button" class="btn btn-ghost gb-marks-btn" style="padding:4px 10px;font-size:.74rem"><i class="fa-solid fa-list-ol"></i> Marks</button></span></div>'
          + '<form class="gb-form profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
          + '<div class="field" style="flex:1;min-width:150px"><label>Component</label><select name="type">' + typeOpts + '</select></div>'
          + '<div class="field" style="width:84px"><label>Score</label><input name="score" type="number" min="0" step="0.5" required></div>'
          + '<div class="field" style="width:74px"><label>Out of</label><input name="max" type="number" min="1" step="0.5" value="100"></div>'
          + '<div class="field" style="width:70px"><label>Week</label><input name="week" type="number" min="1" max="12"></div>'
          + '<button type="submit" class="btn btn-primary" style="padding:9px 14px"><i class="fa-solid fa-plus"></i> Record</button>'
          + '</form>'
          + '<div class="gb-marks" hidden></div>'
          + '<div class="gb-rubric" hidden></div></div>';
      }

      function paintView(filter) {
        var visible = filter ? ens.filter(function (e) { return String(e.cohort_id || 0) === String(filter); }) : ens;

        var filterOpts = '<option value="">All cohorts (' + ens.length + ')</option>'
          + cohortOrder.map(function (k) {
            var cnt = ens.filter(function (e) { return String(e.cohort_id || 0) === k; }).length;
            return '<option value="' + k + '"' + (filter === k ? ' selected' : '') + '>' + P.escapeHtml(cohortMap[k]) + ' (' + cnt + ')</option>';
          }).join('');

        var headerHtml = '<section class="panel"><div class="panel-head"><h2>Gradebook</h2><span style="font-size:.8rem;color:var(--text-muted)">Pass mark ' + passmark + '%</span></div>'
          + '<div style="padding:10px 22px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
          + '<label style="margin:0;display:flex;align-items:center;gap:8px;font-weight:500"><i class="fa-solid fa-filter" style="color:var(--text-muted);font-size:.78rem"></i>'
          + '<select id="gbCohortFilter" style="min-width:200px">' + filterOpts + '</select></label>'
          + '<span style="font-size:.82rem;color:var(--text-muted)">' + visible.length + ' student' + (visible.length !== 1 ? 's' : '') + '</span>'
          + '<button type="button" id="gbNewRubricBtn" class="btn btn-ghost" style="margin-left:auto;padding:6px 12px;font-size:.78rem"><i class="fa-solid fa-table-cells"></i> New rubric</button>'
          + '</div><div id="gbRubricNew"></div></section>';

        var cardsHtml = cohortOrder.map(function (key) {
          var group = visible.filter(function (e) { return String(e.cohort_id || 0) === key; });
          if (!group.length) return '';
          var passed   = group.filter(function (e) { return e.outcome === 'pass'; }).length;
          var graded   = group.filter(function (e) { return e.total_score != null; }).length;
          return '<div style="margin-bottom:22px">'
            + '<div style="padding:6px 4px 8px;font-size:.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:12px;align-items:center">'
            + P.escapeHtml(cohortMap[key])
            + '<span style="font-weight:400">' + group.length + ' student' + (group.length !== 1 ? 's' : '')
            + (graded ? ' · ' + passed + '/' + graded + ' passing' : '') + '</span></div>'
            + group.map(buildCard).join('') + '</div>';
        }).join('') || '<section class="panel"><div class="panel-body">' + empty('graduation-cap', 'No students in this cohort.') + '</div></section>';

        content.innerHTML = headerHtml + cardsHtml;
        document.getElementById('gbCohortFilter').addEventListener('change', function () { paintView(this.value); });

        content.querySelectorAll('.gb-form').forEach(function (form) {
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var card = form.closest('[data-eid]');
            var score = parseFloat(form.elements.score.value);
            if (isNaN(score)) return;
            var body = { enrollment_id: parseInt(card.getAttribute('data-eid'), 10), type: form.elements.type.value, score: score, max_score: parseFloat(form.elements.max.value) || 100 };
            if (form.elements.week.value) body.week = parseInt(form.elements.week.value, 10);
            var btn = form.querySelector('button[type=submit]'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
            API.request('instructor/assess', { method: 'POST', body: body }).then(function (r) {
              btn.disabled = false; btn.innerHTML = orig; form.reset(); form.elements.max.value = '100';
              gbApplyResult(card, r.result); gbCache = null;
              var box = card.querySelector('.gb-marks'); if (box && !box.hidden) gbLoadMarks(card);
              if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Score recorded.', 'success');
            }).catch(function (err) {
              btn.disabled = false; btn.innerHTML = orig;
              var msg = (err && err.body && err.body.error) || 'try again';
              if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not record: ' + msg, 'error'); else alert('Could not record the score.');
            });
          });
        });
        content.querySelectorAll('.gb-marks-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var card = btn.closest('[data-eid]'), box = card.querySelector('.gb-marks');
            if (!box.hidden) { box.hidden = true; return; }
            box.hidden = false; gbLoadMarks(card);
          });
        });
        content.querySelectorAll('.gb-rubric-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { openRubricPanel(btn.closest('[data-eid]')); });
        });
        var nrb = document.getElementById('gbNewRubricBtn');
        if (nrb) nrb.addEventListener('click', openNewRubric);
      }

      paintView('');
    }).catch(function () {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load the gradebook.') + '</div></section>';
    });
  }

  // Repaint a card's standing pill and progress bar from a recomputed result.
  function gbApplyResult(card, res) {
    res = res || {};
    var pill = card.querySelector('.gb-result');
    if (pill) pill.innerHTML = gradePill({ total_score: res.total, grade: res.grade, outcome: res.outcome });
    var bar = card.querySelector('.gb-progress-inner');
    if (bar && res.total != null) {
      bar.style.width = Math.min(100, Math.round(res.total)) + '%';
      bar.style.background = res.outcome === 'pass' ? '#34D399' : '#F87171';
    }
  }

  // Load + render one enrolment's recorded marks with correct (remark) / void
  // controls — so a mistaken score is fixed in place, never just averaged away.
  function gbLoadMarks(card) {
    var eid = card.getAttribute('data-eid'), box = card.querySelector('.gb-marks');
    box.innerHTML = '<div class="empty-state" style="padding:14px"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading marks…</div>';
    API.request('instructor/assessments?enrollment_id=' + encodeURIComponent(eid), { method: 'GET' }).then(function (r) {
      var marks = r.assessments || [];
      if (!marks.length) { box.innerHTML = '<div style="padding:10px 18px 16px;color:var(--text-muted);font-size:0.85rem">No marks recorded yet.</div>'; return; }
      var rows = marks.map(function (m) {
        var pct = m.max_score > 0 ? Math.round(m.score * 100 / m.max_score) : 0;
        return '<tr data-aid="' + m.id + '" data-score="' + m.score + '" data-max="' + m.max_score + '" data-week="' + (m.week != null ? m.week : '') + '" data-notes="' + P.escapeHtml(String(m.notes || '')) + '">'
          + '<td data-label="Component">' + P.escapeHtml(m.type_name || m.type_code || '—') + '</td>'
          + '<td data-label="Score"><strong>' + m.score + '</strong> / ' + m.max_score + ' <span style="color:var(--text-muted)">(' + pct + '%)</span></td>'
          + '<td data-label="Week">' + (m.week != null ? 'Wk ' + m.week : '—') + '</td>'
          + '<td data-label="Note">' + (m.notes ? P.escapeHtml(m.notes) : '<span style="color:var(--text-muted)">—</span>') + '</td>'
          + '<td data-label="" style="white-space:nowrap"><button type="button" class="btn btn-ghost gb-edit" style="padding:3px 9px;font-size:0.72rem">Edit</button> '
          + '<button type="button" class="btn btn-danger gb-void" style="padding:3px 9px;font-size:0.72rem">Void</button></td></tr>';
      }).join('');
      box.innerHTML = '<div class="ptable-wrap" style="padding:0 12px 14px"><table class="ptable"><thead><tr><th>Component</th><th>Score</th><th>Week</th><th>Note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        + '<p style="margin:2px 8px 0;font-size:0.78rem;color:var(--text-muted)">Editing corrects a mark in place; voiding removes it. Either way the result recomputes.</p></div>';
      gbWireMarkActions(card, box);
    }).catch(function () { box.innerHTML = '<div style="padding:12px 18px;color:#FB7185">Could not load marks.</div>'; });
  }

  function gbWireMarkActions(card, box) {
    box.querySelectorAll('.gb-void').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('[data-aid]'), aid = parseInt(tr.getAttribute('data-aid'), 10);
        if (!window.confirm('Void this mark? The result recomputes without it.')) return;
        API.request('instructor/assess', { method: 'POST', body: { assessment_id: aid, action: 'void' } }).then(function (r) {
          gbApplyResult(card, r.result); gbCache = null; gbLoadMarks(card);
          if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Mark voided.', 'success');
        }).catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not void the mark.', 'error'); });
      });
    });
    box.querySelectorAll('.gb-edit').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('[data-aid]');
        var typeName = tr.children[0].textContent;

        tr.innerHTML = '<td data-label="Component">' + P.escapeHtml(typeName) + '</td>'

      if (!title) return;
      var rtgt = (document.getElementById('res-target').value || '').split(':');
      var setTarget = function (o) { if (rtgt[0] === 'cohort') o.cohort_id = parseInt(rtgt[1], 10); else o.class_id = parseInt(rtgt[1], 10); return o; };
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML;
      var fail = function (err) { btn.disabled = false; btn.innerHTML = orig; var c = err && err.body && err.body.error; var d = err && err.body && err.body.detail; (window.MAM_DIALOG ? window.MAM_DIALOG.toast(d || (c === 'validation' ? 'Check the title and a valid https URL.' : 'Could not add resource.'), 'error') : alert('Could not add.')); };
      var done = function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Resource added.', 'success') : alert('Added.')); return load(); };

      if (file) {
        // #5: upload the chosen file to Drive, then it's stored as a resource.
        var max = 256 * 1024 * 1024;
        if (file.size > max) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('That file is over the 256 MB limit.', 'error') : alert('Too large.')); return; }
        btn.disabled = true; btn.innerHTML = 'Uploading…';

        reader.onload = function () {
          var b64 = String(reader.result || '').split(',')[1] || '';
          API.request('instructor/drive-upload', { method: 'POST', body: setTarget({ name: file.name, mime: file.type || 'application/octet-stream', data: b64, title: title }) })
            .then(done).catch(fail);
        };
        reader.onerror = function () { fail({ body: { detail: 'Could not read that file.' } }); };
        reader.readAsDataURL(file);
        return;
      }
      if (!url) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Choose a file or paste a URL.', 'error') : alert('Choose a file or paste a URL.')); return; }
      btn.disabled = true; btn.innerHTML = 'Adding…';
      API.request('instructor/resource', { method: 'POST', body: setTarget({ type: document.getElementById('res-type').value, title: title, url: url }) }).then(done).catch(fail);
    });

  // P2 convergence: surface the v16 cohorts (Sessions + Gradebook world) right on
  // the overview, so the instructor sees both the legacy classes above and their
  // cohorts in one place. Best-effort + lazy — a failed fetch or empty result
  // simply leaves the overview as-is; the dedicated Sessions/Gradebook tabs keep
  // working (dual-read).
  function loadCohortSummary() {
    var host = document.getElementById('cohortSummary');
    if (!host) return;
    API.request('instructor/sessions', { method: 'GET' }).then(function (r) {
      var cohorts = (r && r.cohorts) || [];
      if (!cohorts.length || !document.getElementById('cohortSummary')) return;
      var rows = cohorts.map(function (c) {
        var name = c.title || c.course_name || ('Cohort #' + c.id);
        // Dual-read: total = course enrolments + the legacy class roster of a
        // backfilled cohort, so it never misreads as 0. Break the mix out when
        // both are present (legacy members are graded via the Classes tab).
        var courseN = c.enrollment_count || 0, legacyN = c.legacy_count || 0;
        var students = (courseN + legacyN)
          + (legacyN ? ' <span style="color:var(--text-muted);font-size:0.74rem" title="' + courseN + ' course · ' + legacyN + ' from the legacy class">(' + courseN + ' course · ' + legacyN + ' class)</span>' : '');
        return '<tr><td data-label="Cohort"><strong>' + P.escapeHtml(name) + '</strong>'
          + (c.level_name ? '<br><span style="color:var(--text-muted);font-size:0.78rem">' + P.escapeHtml(c.level_name) + '</span>' : '') + '</td>'
          + '<td data-label="Course">' + P.escapeHtml(c.course_name || '—') + '</td>'
          + '<td data-label="Students">' + students + '</td>'
          + '<td data-label=""><a class="btn btn-ghost" href="#sessions" data-tab="sessions" style="padding:4px 11px;font-size:0.76rem"><i class="fa-solid fa-chalkboard-user"></i> Teach</a> '
          + '<a class="btn btn-ghost" href="#gradebook" data-tab="gradebook" style="padding:4px 11px;font-size:0.76rem"><i class="fa-solid fa-clipboard-list"></i> Grade</a></td></tr>';

  // Wait for the deferred Chart.js CDN; give up after ~3s and keep the fallback.
  function whenChart(cb, tries) {
    if (typeof window.Chart !== 'undefined') return cb(true);
    if ((tries || 0) >= 25) return cb(false);
    setTimeout(function () { whenChart(cb, (tries || 0) + 1); }, 120);
  }
  var _attChart = null;
  function drawAttChart(counts) {
    var canvas = document.getElementById('attChart'), fb = document.getElementById('attChartFallback');
    if (!canvas || !fb) return;
    var labels = ['Present', 'Late', 'Absent', 'Excused'];
    var values = [counts.present, counts.late, counts.absent, counts.excused];
    var colors = ['#34D399', '#FBBF24', '#FB7185', '#A5B4FC'];
    function cssFallback() {
      canvas.style.display = 'none';
      var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
      fb.innerHTML = labels.map(function (l, i) {
        return '<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:90px;color:var(--text-muted);font-size:0.84rem">' + l + '</span>'
          + '<div class="studio-progress" style="flex:1"><div class="studio-progress-fill" style="width:' + Math.round(values[i] / total * 100) + '%;background:' + colors[i] + '"></div></div>'
          + '<strong style="width:30px;text-align:right">' + values[i] + '</strong></div>';
      }).join('');
    }
    cssFallback(); // paint immediately
    whenChart(function (ok) {
      if (!ok || !document.body.contains(canvas)) return;
      try {
        if (_attChart) { _attChart.destroy(); _attChart = null; }
        fb.innerHTML = ''; canvas.style.display = '';
        _attChart = new window.Chart(canvas.getContext('2d'), {
          type: 'doughnut',
          data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderColor: 'rgba(0,0,0,0.2)', borderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { color: '#9A8264', padding: 14, font: { size: 12 } } } } }
        });
      } catch (e) { cssFallback(); }
    });
  }

  // Build + download a CSV client-side (RFC-4180 quoting) — no server round-trip.
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

      document.body.appendChild(ov);
      if (qrOk) { try { new QRCode(ov.querySelector('#att-qr-canvas'), { text: r.url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
      function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      ov.querySelector('[data-qr-close]').addEventListener('click', close);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      document.addEventListener('keydown', onKey);
    }
    var qrBtn = document.getElementById('att-qr-btn');
    if (qrBtn) qrBtn.addEventListener('click', function () {
      var classId = parseInt(document.getElementById('att-class').value, 10);
      if (!classId) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Pick a class first', 'error') : alert('Pick a class first')); return; }
      var orig = qrBtn.innerHTML; qrBtn.disabled = true; qrBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading…';
      API.request('instructor/attendance-qr?class_id=' + classId, { method: 'GET' })
        .then(function (r) { qrBtn.disabled = false; qrBtn.innerHTML = orig; showQrModal(r); })
        .catch(function () { qrBtn.disabled = false; qrBtn.innerHTML = orig; (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not load the QR', 'error') : alert('Could not load the QR')); });
    });

    document.getElementById('attForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var eid = parseInt(document.getElementById('att-enrollment').value, 10);
      if (!eid) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Please pick a student first', 'error') : alert('Please pick a student first')); return; }
      var payload = {
        enrollment_id: eid,
        session_date: document.getElementById('att-date').value,
        status: document.getElementById('att-status').value,
        notes: document.getElementById('att-notes').value,
      };
      var btn = document.getElementById('att-submit'); var orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      API.request('instructor/mark-attendance', { method: 'POST', body: payload })
        .then(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Attendance saved', 'success') : alert('Attendance saved.')); load(); })
        .catch(function (err) { btn.disabled = false; btn.innerHTML = orig; var msg = 'Could not save: ' + (err.body && err.body.error || 'unknown'); (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Could not save', msg, 'error') : alert(msg)); });
    });
  }
  function attendanceTable(att) {
    var rows = att.map(function (a) {
      return '<tr><td data-label="Date">' + P.fmtDate(a.session_date) + '</td>'
        + '<td data-label="Student"><strong>' + P.escapeHtml(a.student_name || '—') + '</strong></td>'
        + '<td data-label="Class">' + P.escapeHtml(a.class_title || '—') + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(a.status) + '">' + P.escapeHtml(a.status) + '</span></td>'
        + '<td data-label="Notes" style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(a.notes || '') + '</td></tr>';
    }).join('');
    return '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function kpi(label, value, sub, cls) {
    return '<div class="kpi"><div class="kpi-label">' + P.escapeHtml(label) + '</div><div class="kpi-value ' + (cls || '') + '">' + value + '</div><div class="kpi-sub">' + P.escapeHtml(sub || '') + '</div></div>';
  }
  function empty(icon, text) { return '<div class="empty-state"><i class="fa-solid fa-' + icon + '"></i>' + text + '</div>'; }

  // Single delegated handler (bound once) for every [data-tab] link, including
  // ones rendered later — replaces the old per-render re-binding that leaked
  // duplicate listeners on each overview paint.
  var _navBound = false;
  function bindTabLinks() {
    if (_navBound) return; _navBound = true;
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-tab]'); if (!a) return;
      var t = a.getAttribute('data-tab'); if (!t) return;
      e.preventDefault(); show(t);
      try { history.replaceState(null, '', '#' + t); } catch (e2) {}
    });
  }

  function load() {
    return API.request('instructor/dashboard').then(function (r) {
      data = r;
      P.mountUserCard({ name: r.user.name, email: r.user.email, role: 'instructor', avatar_url: r.user.avatar_url });
      var tab = (location.hash || '#overview').slice(1);
      if (!tabs[tab]) tab = 'overview';
      // A temporary password must be changed first — land on Account.
      if (r.user && r.user.must_change_password) tab = 'account';
      content.removeAttribute('aria-busy');
      show(tab);
    });
  }

  function renderHandbook() {
    var css = '<style>'
      + '.hb-wrap{max-width:720px}'
      + '.hb-acc{border-radius:10px;border:1px solid var(--border);background:var(--raised);margin-bottom:10px;overflow:hidden}'
      + '.hb-acc>summary{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;list-style:none;font-weight:600;font-size:.88rem;gap:8px;border-bottom:1px solid transparent;transition:background .15s}'
      + '.hb-acc>summary::-webkit-details-marker{display:none}'
      + '.hb-acc[open]>summary{border-bottom-color:var(--border)}'
      + '.hb-acc>summary:hover{background:var(--glass-light)}'
      + '.hb-chev{font-size:.68rem;color:var(--text-muted);transition:transform .2s;flex-shrink:0}'
      + '.hb-acc[open]>summary .hb-chev{transform:rotate(90deg)}'
      + '.hb-ptag{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap}'
      + '.hb-body{padding:4px 18px 18px;font-size:.84rem;line-height:1.7}'
      + '.hb-stat{display:inline-flex;flex-direction:column;align-items:center;background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:12px 20px;min-width:100px;text-align:center}'
      + '.hb-stat .n{font-size:1.9rem;font-weight:700;color:var(--gold-bright,#E8961F);line-height:1}'
      + '.hb-stat .l{font-size:.66rem;color:var(--text-muted);margin-top:4px;line-height:1.35}'
      + '.hb-list{list-style:none;padding:0;margin:10px 0 0}'
      + '.hb-list li{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--border)}'
      + '.hb-list li:last-child{border-bottom:none}'
      + '.hb-list li i{color:var(--gold-bright,#E8961F);margin-top:2px;flex-shrink:0;width:14px}'
      + '.hb-warn{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.22);border-radius:8px;padding:11px 14px;margin:10px 0 0;font-size:.82rem;line-height:1.6}'
      + '.hb-info{background:rgba(232,150,31,.07);border:1px solid rgba(232,150,31,.2);border-radius:8px;padding:11px 14px;margin:10px 0 0;font-size:.82rem;line-height:1.6}'
      + '</style>';
    content.innerHTML = css
      + '<div class="hb-wrap">'
      + '<section class="panel" style="margin-bottom:14px"><div style="padding:18px 22px;display:flex;gap:14px;align-items:center">'
      + '<i class="fa-solid fa-book-bookmark" style="font-size:1.4rem;color:var(--gold-bright,#E8961F);flex-shrink:0"></i>'
      + '<div><div style="font-weight:700;font-size:.95rem">MAM Academy — Instructor Handbook</div>'
      + '<div style="color:var(--text-muted);font-size:.76rem;margin-top:3px">Effective 28 August 2025 &nbsp;·&nbsp; By accepting your role, you agreed to uphold every provision in this Handbook.</div>'
      + '</div></div></section>'

      + '<details class="hb-acc" open>'
      + '<summary><span style="display:flex;align-items:center;gap:8px"><span class="hb-ptag">Part I</span> Your Role &amp; Teaching Model</span><i class="fa-solid fa-chevron-right hb-chev"></i></summary>'
      + '<div class="hb-body">'
      + '<p>MAM Academy uses a <strong>Student-Led Guided Learning Model</strong>. You serve primarily as a <strong>facilitator, coach, mentor and academic guide</strong> — not the primary presenter or lecturer.</p>'
      + '<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap">'
      + '<div class="hb-stat"><span class="n">70%</span><span class="l">Student-led time<br>you facilitate</span></div>'
      + '<div class="hb-stat"><span class="n">30%</span><span class="l">Your guidance,<br>corrections &amp; coaching</span></div>'
      + '</div>'
      + '<ul class="hb-list">'
      + '<li><i class="fa-solid fa-circle-dot"></i><span><strong>Orientation session:</strong> You deliver the first session of each course — covering learning objectives, course structure, assessment methods and expectations.</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span><strong>Subsequent sessions:</strong> Students are expected to have studied the assigned module independently. They take primary responsibility for presenting, demonstrating, explaining, discussing or performing it. You guide, correct and coach throughout.</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Sessions are designed to: assess student understanding, encourage peer learning, provide supervised practice, identify misconceptions and learning gaps, deliver critique and coaching, and build communication, confidence and creativity.</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Students may request clarification via the portal, email, or brief follow-up sessions of approximately <strong>20–30 minutes</strong> — subject to your availability and Academy guidelines.</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Students who arrive unprepared may have their eligibility for assessments, public performances, exhibitions or certification affected. You are expected to uphold this standard.</span></li>'
      + '</ul>'
      + '<div class="hb-info"><i class="fa-solid fa-lightbulb" style="margin-right:7px"></i><strong>Theory courses:</strong> Students submit written summaries at least 48 hours before class. Review submissions and use them to structure the session discussion.</div>'
      + '</div></details>'

      + '<details class="hb-acc" open>'
      + '<summary><span style="display:flex;align-items:center;gap:8px"><span class="hb-ptag">Part VII</span> Your Responsibilities</span><i class="fa-solid fa-chevron-right hb-chev"></i></summary>'
      + '<div class="hb-body">'
      + '<ul class="hb-list">'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Demonstrate professionalism in all Academy interactions</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Mentor students fairly, without bias or favouritism</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Provide academic guidance appropriate to each student\'s level</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Assess work objectively and provide constructive feedback</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Maintain appropriate records (attendance, marks, lesson notes)</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Encourage independent learning as a core professional skill</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Uphold Academy values in all conduct inside and outside sessions</span></li>'
      + '<li><i class="fa-solid fa-circle-check"></i><span>Protect the reputation and standards of MAM Academy</span></li>'
      + '</ul>'
      + '</div></details>'

      + '<details class="hb-acc">'
      + '<summary><span style="display:flex;align-items:center;gap:8px"><span class="hb-ptag">Student Policy</span> What Students Are Required to Do</span><i class="fa-solid fa-chevron-right hb-chev"></i></summary>'
      + '<div class="hb-body">'
      + '<p style="color:var(--text-muted);font-size:.82rem;margin-bottom:10px">Understanding student obligations helps you set and enforce the right expectations.</p>'
      + '<ul class="hb-list">'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Arrive having studied the assigned module — sessions are not for first introductions to new content</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Maintain a minimum of <strong>75% attendance</strong> across all contact sessions, rehearsals, workshops and assessments</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Complete all assignments by stated deadlines — repeated failure triggers graduated corrective measures (verbal warning → ₦500 fine → ₦1,000 fine → suspension)</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Use the Student Portal regularly and act on Academy communications</span></li>'
      + '<li><i class="fa-solid fa-circle-dot"></i><span>Maintain honesty — AI and online tools are permitted as learning aids, but all submitted work and performances must reflect the student\'s own competence</span></li>'
      + '</ul>'
      + '<div class="hb-warn"><i class="fa-solid fa-triangle-exclamation" style="margin-right:7px"></i>Students who consistently ignore instructions or refuse to comply with Academy procedures may be excluded from public performances, concerts, exhibitions, recitals, graduation events and certification exercises.</div>'
      + '</div></details>'

      + '</div>';
  }

  P.requireAuth(['instructor', 'admin']).then(function () {
    P.init(); bindTabLinks(); syncTabs = P.enhanceTabs({ onActivate: show }); return load();
  }).catch(function (e) {
    if (e.message !== 'unauthenticated') content.innerHTML = empty('triangle-exclamation', 'Could not load your dashboard.');
  });
})();
</script>
</body>
</html>
