<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Instructor Portal — MAM Academy</title>
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/assets/css/main.css?v=20260706d">
<link rel="stylesheet" href="/assets/css/portal.css?v=20260706c">
<link rel="stylesheet" href="/assets/css/studio.css?v=20260531b">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<div class="portal-shell">
  <aside class="portal-side">
    <div class="portal-brand">
      <img src="/mam-academy-logo.svg" alt="" onerror="this.style.display='none'">
      <div>
        <div class="portal-brand-name">MAM ACADEMY</div>
        <div class="portal-brand-sub">Instructor Portal</div>
      </div>
    </div>
    <div class="portal-user" id="userCard"><div class="portal-avatar">?</div><div><div class="portal-user-name">Loading…</div></div></div>
    <nav class="portal-nav">
      <a class="portal-nav-link active" href="#overview" data-tab="overview"><i class="fa-solid fa-gauge"></i>Overview</a>
      <a class="portal-nav-link" href="#classes" data-tab="classes"><i class="fa-solid fa-chalkboard-user"></i>My Classes</a>
      <a class="portal-nav-link" href="#students" data-tab="students"><i class="fa-solid fa-users"></i>Students</a>
      <a class="portal-nav-link" href="#assignments" data-tab="assignments"><i class="fa-solid fa-list-check"></i>Assignments</a>
      <a class="portal-nav-link" href="#attendance" data-tab="attendance"><i class="fa-solid fa-clipboard-list"></i>Attendance</a>
      <a class="portal-nav-link" href="#sessions" data-tab="sessions"><i class="fa-solid fa-calendar-days"></i>Teaching</a>
      <a class="portal-nav-link" href="#gradebook" data-tab="gradebook"><i class="fa-solid fa-graduation-cap"></i>Gradebook</a>
      <a class="portal-nav-link" href="#earnings" data-tab="earnings"><i class="fa-solid fa-wallet"></i>Earnings</a>
      <a class="portal-nav-link" href="#announce" data-tab="announce"><i class="fa-solid fa-bullhorn"></i>Announcements</a>
      <a class="portal-nav-link" href="#account" data-tab="account"><i class="fa-solid fa-user-gear"></i>Account</a>
      <a class="portal-nav-link" href="/studio" target="_blank" rel="noopener" style="margin-top:14px;border-top:1px dashed var(--border);padding-top:18px"><i class="fa-solid fa-wand-magic-sparkles"></i>Practice Studio <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.7em;margin-left:auto;opacity:0.7"></i></a>
    </nav>
    <div class="portal-side-foot">
      <a href="/"><i class="fa-solid fa-house"></i>Back to site</a>
      <button type="button" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
    </div>
  </aside>

  <main class="portal-main">
    <button class="portal-side-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i> Menu</button>
    <header class="portal-top">
      <h1 id="pageTitle">Overview <small id="pageSub">Welcome back</small></h1>
      <div style="margin-left:auto"><span data-notif-bell></span></div>
    </header>
    <div id="content" aria-busy="true" aria-label="Loading your dashboard">
      <section class="kpi-row">
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
      </section>
      <section class="panel"><div class="panel-body" style="display:grid;gap:14px"><div class="skeleton" style="height:14px;width:40%"></div><div class="skeleton" style="height:12px;width:92%"></div><div class="skeleton" style="height:12px;width:78%"></div></div></section>
      <section class="panel"><div class="panel-body" style="display:grid;gap:14px"><div class="skeleton" style="height:14px;width:40%"></div><div class="skeleton" style="height:12px;width:88%"></div><div class="skeleton" style="height:12px;width:70%"></div></div></section>
    </div>
  </main>
</div>

<script src="/assets/js/config.js?v=20260706a"></script>
<script src="/assets/js/portal.js?v=20260706c"></script>
<script src="/assets/js/libs.js?v=20260530a" async></script>
<!-- Self-hosted QR generator (MIT, qrcodejs) for the attendance check-in QR (#9/#10). -->
<script src="/assets/js/vendor/qrcode.min.js?v=20260705a" defer></script>
<script>
(function () {
  var P = window.MAM_PORTAL, API = window.MAM_API;
  var content = document.getElementById('content');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var tabs = { overview: ['Overview', 'Your teaching at a glance'], classes: ['My Classes', 'Active classes you teach'], students: ['Students', 'Everyone in your classes'], assignments: ['Assignments', 'Set practice tasks & track completion'], attendance: ['Attendance', 'Mark and review attendance'], sessions: ['Teaching', 'One cohort at a time — sessions, attendance & standings'], gradebook: ['Gradebook', 'Grade students across the weighted components'], earnings: ['Earnings', 'Your earnings statement from the Academy'], announce: ['Announcements', 'Post updates your students see'], account: ['Account', 'Your profile & password'] };
  var data = null;
  var syncTabs = function () {};   // set by P.enhanceTabs() at boot; keeps ARIA tab state correct

  function show(tab) {
    document.querySelectorAll('[data-tab]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    syncTabs(tab);
    var t = tabs[tab] || tabs.overview;
    pageTitle.firstChild.textContent = t[0] + ' ';
    pageSub.textContent = t[1];
    if (!data) return;
    if (tab === 'overview') return renderOverview();
    if (tab === 'classes') return renderClasses();
    if (tab === 'students') return renderStudents();
    if (tab === 'assignments') return renderAssignments();
    if (tab === 'attendance') return renderAttendance();
    if (tab === 'sessions') return renderSessions();
    if (tab === 'gradebook') return renderGradebook();
    if (tab === 'earnings') return renderEarnings();
    if (tab === 'announce') return renderAnnounce();
    if (tab === 'account') return renderAccount();
  }

  function renderAssignments() {
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var students = data.students || [];
    var asg = data.assignments || [];
    if (!classes.length && !students.length) {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('list-check', 'Add students to a class first — then you can set assignments.') + '</div></section>';
      return;
    }
    var clsOpts = classes.map(function (c) { return '<option value="class:' + c.id + '">Whole class — ' + P.escapeHtml(c.title) + '</option>'; }).join('');
    var stuOpts = students.map(function (s) { return '<option value="student:' + s.id + '">' + P.escapeHtml(s.name) + (s.class_title ? ' (' + P.escapeHtml(s.class_title) + ')' : '') + '</option>'; }).join('');
    var targetSel = '<select id="asg-target" required>'
      + (clsOpts ? '<optgroup label="Classes">' + clsOpts + '</optgroup>' : '')
      + (stuOpts ? '<optgroup label="Students">' + stuOpts + '</optgroup>' : '')
      + '</select>';
    var doneCount = asg.filter(function (a) { return a.status === 'done'; }).length;
    var list = asg.length ? asg.map(function (a) {
      var done = a.status === 'done';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);margin-bottom:10px">'
        + '<div style="min-width:200px;flex:1"><strong style="color:var(--text)">' + P.escapeHtml(a.title) + '</strong>'
        + '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:3px">' + P.escapeHtml(a.student_name || '') + (a.class_title ? ' · ' + P.escapeHtml(a.class_title) : '') + (a.due_on ? ' · due ' + P.fmtDate(a.due_on) : '') + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<span class="pill ' + (done ? 'present' : 'pending') + '">' + (done ? 'done' : 'open') + '</span>'
        +   '<button type="button" class="btn asg-subs" data-id="' + a.id + '" data-title="' + P.escapeHtml(a.title) + '"><i class="fa-solid fa-inbox"></i> Submissions</button>'
        +   '<button type="button" class="asg-del" data-id="' + a.id + '" title="Delete assignment" aria-label="Delete assignment" style="width:34px;height:34px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);cursor:pointer"><i class="fa-solid fa-trash-can"></i></button>'
        + '</div></div>';
    }).join('') : '<div class="panel-body">' + empty('list-check', 'No assignments set yet. Create one above.') + '</div>';

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Set an assignment</h2></div>'
      + '<form id="asgForm" class="profile-form" style="padding:18px 22px;display:grid;gap:14px">'
      +   '<div class="field"><label for="asg-target">Assign to</label>' + targetSel + '</div>'
      +   '<div class="field"><label for="asg-title">Title</label><input id="asg-title" maxlength="160" required placeholder="e.g. Prepare C major scale, hands together"></div>'
      +   '<div class="field"><label for="asg-instr">Instructions</label><textarea id="asg-instr" rows="3" placeholder="What should they practise, and how?"></textarea></div>'
      +   '<div class="field"><label for="asg-due">Due date (optional)</label><input id="asg-due" type="date"></div>'
      +   '<div class="actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-list-check"></i> Set assignment</button></div>'
      + '</form></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Assignments set</h2>'
      + (asg.length ? '<span style="font-size:0.8rem;color:var(--text-muted)">' + doneCount + ' of ' + asg.length + ' done · ' + (asg.length - doneCount) + ' open</span>' : '')
      + '</div><div style="padding:14px 18px">' + list + '</div></section>'
      + '<div id="subsArea" style="margin-top:18px"></div>';

    content.querySelectorAll('.asg-subs').forEach(function (b) {
      b.addEventListener('click', function () { openSubmissions(parseInt(b.getAttribute('data-id'), 10), b.getAttribute('data-title') || 'Assignment'); });
    });
    content.querySelectorAll('.asg-del').forEach(function (b) {
      b.addEventListener('click', function () {
        var go = function () {
          b.disabled = true;
          API.request('instructor/assignment-delete', { method: 'POST', body: { id: parseInt(b.getAttribute('data-id'), 10) } })
            .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Assignment deleted.', 'success'); return load(); })
            .catch(function (err) {
              b.disabled = false;
              (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not delete: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not delete.'));
            });
        };
        if (window.MAM_DIALOG && window.MAM_DIALOG.confirm) window.MAM_DIALOG.confirm('Delete this assignment?', 'The student will no longer see it.', 'Delete').then(function (ok) { if (ok) go(); });
        else if (confirm('Delete this assignment?')) go();
      });
    });

    document.getElementById('asgForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('asg-title').value.trim();
      if (!title) return;
      var tgt = (document.getElementById('asg-target').value || '').split(':');
      var body = { title: title, instructions: document.getElementById('asg-instr').value.trim(), due_on: document.getElementById('asg-due').value || null };
      if (tgt[0] === 'class') body.class_id = parseInt(tgt[1], 10); else body.student_id = parseInt(tgt[1], 10);
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
      API.request('instructor/assignment', { method: 'POST', body: body }).then(function (r) {
        var n = r.created || 1;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Assignment set for ' + n + ' student' + (n === 1 ? '' : 's') + '.', 'success') : alert('Set.'));
        return load();
      }).catch(function (err) {
        btn.disabled = false; btn.innerHTML = orig;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not set: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not set.'));
      });
    });
  }

  // ── Submissions review + feedback (L2) ──
  function openSubmissions(aid, title) {
    var area = document.getElementById('subsArea');
    if (!area) return;
    area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading submissions…') + '</div></section>';
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    API.request('instructor/submissions?assignment_id=' + encodeURIComponent(aid), { method: 'GET' }).then(function (r) {
      var subs = r.submissions || [];
      var aiEnabled = !!r.ai_enabled;
      if (!subs.length) {
        area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Submissions — ' + P.escapeHtml(title) + '</h2></div><div class="panel-body">' + empty('inbox', 'No submissions yet for this assignment.') + '</div></section>';
        return;
      }
      var icon = { audio: 'volume-high', video: 'video', pdf: 'file-pdf', image: 'image', link: 'link' };
      var cards = subs.map(function (s) {
        return '<div class="panel" data-subid="' + s.id + '" style="margin-bottom:14px"><div class="panel-head"><h2 style="font-size:0.98rem">' + P.escapeHtml(s.student_name) + ' <span class="pill ' + P.escapeHtml(s.status) + '" style="margin-left:6px">' + P.escapeHtml(s.status) + '</span></h2>'
          + (s.artifact_url ? '<a href="' + P.escapeHtml(s.artifact_url) + '" target="_blank" rel="noopener" style="color:var(--gold-bright);font-size:0.85rem"><i class="fa-solid fa-' + (icon[s.artifact_kind] || 'link') + '" style="margin-right:5px"></i>open ↗</a>' : '') + '</div>'
          + '<form class="fb-form profile-form" style="padding:14px 18px;display:grid;gap:10px">'
          +   '<div class="field"><label>Feedback</label><textarea name="comments" rows="2" placeholder="What worked, what to fix…">' + P.escapeHtml(s.feedback_comments || '') + '</textarea></div>'
          +   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select name="outcome"><option value="accepted"' + (s.feedback_outcome === 'accepted' ? ' selected' : '') + '>Accept</option><option value="revise"' + (s.feedback_outcome === 'revise' ? ' selected' : '') + '>Revise &amp; resubmit</option></select>'
          +   (aiEnabled ? '<button type="button" class="btn fb-ai"><i class="fa-solid fa-wand-magic-sparkles"></i> AI draft</button>' : '')
          +   '<button type="submit" class="btn btn-primary"><i class="fa-solid fa-comment-dots"></i> Save feedback</button></div>'
          + '</form></div>';
      }).join('');
      area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Submissions — ' + P.escapeHtml(title) + '</h2></div></section>' + cards;
      area.querySelectorAll('.fb-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var subId = parseInt(form.closest('[data-subid]').getAttribute('data-subid'), 10);
          var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
          API.request('instructor/feedback', { method: 'POST', body: { submission_id: subId, outcome: form.elements.outcome.value, comments: form.elements.comments.value } })
            .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Feedback saved.', 'success'); openSubmissions(aid, title); })
            .catch(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not save feedback.', 'error'); });
        });
      });
      area.querySelectorAll('.fb-ai').forEach(function (b) {
        b.addEventListener('click', function () {
          var form = b.closest('.fb-form'), subId = parseInt(form.closest('[data-subid]').getAttribute('data-subid'), 10);
          var orig = b.innerHTML; b.disabled = true; b.innerHTML = 'Drafting…';
          API.request('instructor/feedback-draft', { method: 'POST', body: { submission_id: subId } }).then(function (rr) {
            b.disabled = false; b.innerHTML = orig;
            if (rr && rr.draft) { form.elements.comments.value = rr.draft; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Draft inserted — edit, then Save.', 'success'); }
            else if (window.MAM_DIALOG) window.MAM_DIALOG.toast('AI could not draft right now.', 'info');
          }).catch(function () { b.disabled = false; b.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('AI draft failed.', 'error'); });
        });
      });
    }).catch(function () { area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load submissions.') + '</div></section>'; });
  }

  // ── Gradebook (v16 LMS): weighted assessment entry → auto results ──────
  var gbCache = null;
  function gradePill(row) {
    if (row.total_score == null) return '<span class="pill pending">ungraded</span>';
    var cls = row.outcome === 'pass' ? 'present' : 'withdrawn';
    return '<span class="pill ' + cls + '">' + P.escapeHtml(String(row.grade || '')) + ' · ' + Math.round(row.total_score) + '% · ' + P.escapeHtml(String(row.outcome || '')) + '</span>';
  }
  function loadGradebook(force) {
    if (gbCache && !force) return Promise.resolve(gbCache);
    return API.request('instructor/gradebook', { method: 'GET' }).then(function (r) { gbCache = r || {}; return gbCache; });
  }
  // ── Sessions: cohort scheduling + attendance (LMS L2) ──
  var sessState = { cohortId: 0 };
  var ATT = ['present', 'late', 'absent', 'excused'];

  function renderSessions() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('calendar-days', 'Loading your cohorts…') + '</div></section>';
    API.request('instructor/sessions', { method: 'GET' }).then(function (r) {
      var cohorts = r.cohorts || [];
      if (!cohorts.length) {
        content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('calendar-days', 'No cohorts yet. They appear here once students you teach are enrolled (or an admin assigns you one).') + '</div></section>';
        return;
      }
      var opts = cohorts.map(function (c) {
        var label = (c.title || c.course_name || ('Cohort #' + c.id)) + (c.level_name ? ' · ' + c.level_name : '') + ' (' + (c.enrollment_count || 0) + ' students)';
        return '<option value="' + c.id + '"' + (c.id == sessState.cohortId ? ' selected' : '') + '>' + P.escapeHtml(label) + '</option>';
      }).join('');
      content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Cohort</h2></div>'
        + '<div style="padding:14px 18px"><select id="sessCohort" style="min-width:280px;padding:9px 11px;border-radius:8px">' + opts + '</select></div></section>'
        + '<div id="sessArea"></div>';
      var sel = document.getElementById('sessCohort');
      sel.addEventListener('change', function () { sessState.cohortId = parseInt(sel.value, 10); loadCohortSessions(sessState.cohortId); });
      sessState.cohortId = parseInt(sel.value, 10);
      loadCohortSessions(sessState.cohortId);
    }).catch(function () {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load your cohorts.') + '</div></section>';
    });
  }

  function loadCohortSessions(cid) {
    var area = document.getElementById('sessArea');
    if (!area) return;
    area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading sessions…') + '</div></section>';
    API.request('instructor/sessions?cohort_id=' + encodeURIComponent(cid), { method: 'GET' }).then(function (r) {
      var sessions = r.sessions || [];
      var rows = sessions.length ? sessions.map(function (s) {
        var when = s.scheduled_at ? P.escapeHtml(P.fmtDateTime(s.scheduled_at)) : '<span style="color:var(--text-muted)">unscheduled</span>';
        var actions = '<button class="btn" data-mark="' + s.id + '"><i class="fa-solid fa-clipboard-check"></i> Attendance</button>';
        if (s.status === 'scheduled') actions += ' <button class="btn" data-sess-status="' + s.id + '|held">Held</button> <button class="btn" data-sess-status="' + s.id + '|cancelled">Cancel</button>';
        return '<tr><td>' + P.escapeHtml(s.title || ('Session #' + s.id)) + '</td><td>' + when + '</td><td>' + P.escapeHtml(s.kind) + '</td><td><span class="pill ' + P.escapeHtml(s.status) + '">' + P.escapeHtml(s.status) + '</span></td><td>' + actions + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="empty">No sessions yet — schedule one below.</td></tr>';
      area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Sessions</h2></div>'
        + '<table><thead><tr><th>Session</th><th>When</th><th>Kind</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></section>'
        + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Schedule a session</h2></div>'
        + '<form id="sessForm" class="profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
        +   '<div class="field" style="flex:1;min-width:160px"><label>Title</label><input name="title" placeholder="e.g. Week 1 — Scales"></div>'
        +   '<div class="field"><label>Date &amp; time</label><input name="scheduled_at" type="datetime-local"></div>'
        +   '<div class="field" style="width:90px"><label>Minutes</label><input name="duration_min" type="number" min="1" value="60"></div>'
        +   '<div class="field" style="width:120px"><label>Kind</label><select name="kind"><option value="class">Class</option><option value="revision">Revision</option><option value="exam">Exam</option><option value="makeup">Make-up</option></select></div>'
        +   '<button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Schedule</button>'
        + '</form></section>'
        + '<div id="markArea"></div>'
        + '<div id="cohortStandings"></div>'
        + '<div id="cohortCurriculum"></div>';
      bindSessionList(cid);
      loadCohortStandings(cid);
      loadCohortCurriculum(cid);
    }).catch(function () { area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load sessions.') + '</div></section>'; });
  }

  // P2: within a cohort, show that cohort's students and their current standing
  // (from the gradebook, matched by cohort_id) so Teaching unifies scheduling,
  // attendance AND results per cohort. Grading itself stays in the Gradebook tab
  // (one place for the interactive forms) — each row links straight there.
  function loadCohortStandings(cid) {
    var host = document.getElementById('cohortStandings');
    if (!host) return;
    loadGradebook().then(function (gb) {
      if (!document.getElementById('cohortStandings')) return; // cohort switched
      var ens = (gb.enrollments || []).filter(function (e) { return String(e.cohort_id) === String(cid); });
      if (!ens.length) {
        host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Students &amp; standings</h2></div>'
          + '<div class="panel-body">' + empty('graduation-cap', 'No course students linked to this cohort yet. Course grading appears here once an admin assigns their course to you.') + '</div></section>';
        return;
      }
      var rows = ens.map(function (e) {
        return '<tr><td data-label="Student"><strong>' + P.escapeHtml(e.student_name || e.student_email) + '</strong></td>'
          + '<td data-label="Course">' + P.escapeHtml(e.course_name || '—') + (e.level_name ? ' · ' + P.escapeHtml(e.level_name) : '') + '</td>'
          + '<td data-label="Standing">' + gradePill(e) + '</td>'
          + '<td data-label=""><a class="btn btn-ghost" href="#gradebook" data-tab="gradebook" style="padding:4px 11px;font-size:0.76rem"><i class="fa-solid fa-clipboard-list"></i> Grade</a></td></tr>';
      }).join('');
      host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Students &amp; standings</h2>'
        + '<a class="panel-action" href="#gradebook" data-tab="gradebook">Gradebook →</a></div>'
        + '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Student</th><th>Course</th><th>Standing</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      bindTabLinks();
    }).catch(function () { /* standings are additive — never block the sessions view */ });
  }

  // P2 curriculum authoring: for the selected cohort, show the week-by-week
  // curriculum (context while teaching) plus a "propose a change" form. Proposals
  // go to the admin for approval — nothing here writes the live syllabus.
  var CUR_KIND = { module: 'Module', revision: 'Revision', exam: 'Examination' };
  function loadCohortCurriculum(cid) {
    var host = document.getElementById('cohortCurriculum');
    if (!host) return;
    API.request('instructor/curriculum?cohort_id=' + encodeURIComponent(cid), { method: 'GET' }).then(function (r) {
      if (!document.getElementById('cohortCurriculum')) return; // cohort switched
      var weeks = (r.outline && r.outline.weeks) || [];
      var props = r.proposals || [];
      var weekRows = weeks.length ? weeks.map(function (w) {
        return '<tr><td data-label="Week">Wk ' + w.week + '</td>'
          + '<td data-label="Kind"><span class="pill">' + P.escapeHtml(CUR_KIND[w.kind] || w.kind) + '</span></td>'
          + '<td data-label="Title"><strong>' + P.escapeHtml(w.title || ('Week ' + w.week)) + '</strong>'
          + (w.content ? '<br><span style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(w.content) + '</span>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="3" class="empty">No curriculum authored for this course yet.</td></tr>';

      var propRows = props.length ? props.map(function (p) {
        var tone = { pending: 'pending', approved: 'present', rejected: 'withdrawn' }[p.status] || 'pending';
        return '<tr><td data-label="Week">Wk ' + p.week + '</td>'
          + '<td data-label="Title">' + P.escapeHtml(p.title) + '</td>'
          + '<td data-label="Status"><span class="pill ' + tone + '">' + P.escapeHtml(p.status) + '</span>'
          + (p.review_note ? '<br><span style="color:var(--text-muted);font-size:0.8rem">' + P.escapeHtml(p.review_note) + '</span>' : '') + '</td></tr>';
      }).join('') : '';

      host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Curriculum</h2>'
        + '<span style="font-size:0.8rem;color:var(--text-muted)">' + P.escapeHtml((r.cohort && r.cohort.course_name) || '') + (r.cohort && r.cohort.level_name ? ' · ' + P.escapeHtml(r.cohort.level_name) : '') + '</span></div>'
        + '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Week</th><th>Kind</th><th>Focus</th></tr></thead><tbody>' + weekRows + '</tbody></table></div>'
        + '<form id="curPropose" class="profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--border)">'
        +   '<div class="field" style="width:74px"><label>Week</label><input name="week" type="number" min="1" max="20" required></div>'
        +   '<div class="field" style="width:120px"><label>Kind</label><select name="kind"><option value="module">Module</option><option value="revision">Revision</option><option value="exam">Exam</option></select></div>'
        +   '<div class="field" style="flex:1;min-width:150px"><label>Title</label><input name="title" placeholder="e.g. Week 3 — Sight-reading" required></div>'
        +   '<div class="field" style="flex:2;min-width:200px"><label>Focus / content</label><input name="content" placeholder="What this week covers" maxlength="4000"></div>'
        +   '<button type="submit" class="btn btn-primary" style="padding:9px 14px"><i class="fa-solid fa-paper-plane"></i> Propose</button>'
        + '</form>'
        + (props.length ? '<div class="ptable-wrap" style="padding:0 12px 14px"><h3 style="margin:6px 8px;font-size:0.9rem">Your proposals</h3><table class="ptable"><thead><tr><th>Week</th><th>Title</th><th>Status</th></tr></thead><tbody>' + propRows + '</tbody></table></div>' : '')
        + '<p style="margin:2px 18px 14px;font-size:0.78rem;color:var(--text-muted)">Proposals are reviewed by the Academy before they change the live curriculum.</p></section>';

      var form = document.getElementById('curPropose');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var wk = parseInt(form.elements.week.value, 10);
        if (isNaN(wk) || !form.elements.title.value.trim()) return;
        var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Sending…';
        API.request('instructor/curriculum', { method: 'POST', body: { cohort_id: cid, week: wk, kind: form.elements.kind.value, title: form.elements.title.value.trim(), content: form.elements.content.value.trim() || undefined } })
          .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Proposal sent for review.', 'success'); loadCohortCurriculum(cid); })
          .catch(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not send the proposal.', 'error'); });
      });
    }).catch(function () { /* curriculum is additive — never block the sessions view */ });
  }

  function bindSessionList(cid) {
    var form = document.getElementById('sessForm');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Scheduling…';
      var body = { action: 'create', cohort_id: cid, title: form.elements.title.value, scheduled_at: form.elements.scheduled_at.value, duration_min: parseInt(form.elements.duration_min.value, 10) || 60, kind: form.elements.kind.value };
      API.request('instructor/sessions', { method: 'POST', body: body })
        .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Session scheduled.', 'success'); loadCohortSessions(cid); })
        .catch(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not schedule.', 'error'); });
    });
    document.querySelectorAll('[data-sess-status]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-sess-status').split('|');
        API.request('instructor/sessions', { method: 'POST', body: { action: 'status', session_id: parseInt(p[0], 10), status: p[1] } })
          .then(function () { loadCohortSessions(cid); })
          .catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not update.', 'error'); });
      });
    });
    document.querySelectorAll('[data-mark]').forEach(function (b) {
      b.addEventListener('click', function () { openMarkSheet(parseInt(b.getAttribute('data-mark'), 10)); });
    });
  }

  function openMarkSheet(sid) {
    var area = document.getElementById('markArea');
    if (!area) return;
    area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading roster…') + '</div></section>';
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    API.request('instructor/session-attendance?session_id=' + encodeURIComponent(sid), { method: 'GET' }).then(function (r) {
      var marks = r.marks || [];
      if (!marks.length) { area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('users', 'No students enrolled in this cohort yet.') + '</div></section>'; return; }
      var rows = marks.map(function (m) {
        var btns = ATT.map(function (st) {
          var on = m.status === st;
          return '<button class="btn att-btn" data-att="' + m.student_id + '|' + st + '" style="padding:5px 9px;font-size:0.78rem' + (on ? ';background:var(--gold);color:#1A120B' : '') + '">' + st + '</button>';
        }).join(' ');
        return '<tr data-sid="' + m.student_id + '"><td>' + P.escapeHtml(m.student_name || m.student_email) + '</td><td style="display:flex;gap:6px;flex-wrap:wrap">' + btns + '</td></tr>';
      }).join('');
      area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Take attendance</h2><span id="markMsg" style="font-size:0.8rem;color:var(--text-muted)"></span></div>'
        + '<table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
      area.querySelectorAll('[data-att]').forEach(function (b) {
        b.addEventListener('click', function () {
          var p = b.getAttribute('data-att').split('|'), studentId = parseInt(p[0], 10), st = p[1];
          API.request('instructor/session-attendance', { method: 'POST', body: { session_id: sid, student_id: studentId, status: st } }).then(function () {
            var tr = b.closest('[data-sid]');
            tr.querySelectorAll('.att-btn').forEach(function (x) { x.style.background = ''; x.style.color = ''; });
            b.style.background = 'var(--gold)'; b.style.color = '#1A120B';
            var msg = document.getElementById('markMsg'); if (msg) msg.textContent = 'Saved ✓';
          }).catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not save attendance.', 'error'); });
        });
      });
    }).catch(function () { area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load the roster.') + '</div></section>'; });
  }

  function renderGradebook() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('clipboard-list', 'Loading gradebook…') + '</div></section>';
    loadGradebook().then(function (gb) {
      var ens = gb.enrollments || [], types = gb.types || [];
      if (!ens.length) {
        content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('graduation-cap', 'No course students assigned yet. When an admin approves a student\'s course and assigns it to you, they appear here to grade.') + '</div></section>';
        return;
      }
      var typeOpts = types.map(function (t) { return '<option value="' + P.escapeHtml(t.code) + '">' + P.escapeHtml(t.name) + ' (' + t.weight + '%)</option>'; }).join('');
      var cards = ens.map(function (e) {
        return '<div class="panel" data-eid="' + e.id + '" style="margin-bottom:14px">'
          + '<div class="panel-head"><h2 style="font-size:1rem">' + P.escapeHtml(e.student_name) + ' <span style="color:var(--text-muted);font-weight:500">— ' + P.escapeHtml(e.course_name) + (e.level_name ? ' · ' + P.escapeHtml(e.level_name) : '') + '</span></h2>'
          + '<span style="display:flex;align-items:center;gap:8px"><span class="gb-result">' + gradePill(e) + '</span>'
          + '<button type="button" class="btn btn-ghost gb-marks-btn" style="padding:4px 10px;font-size:0.74rem"><i class="fa-solid fa-list-ol"></i> Marks</button></span></div>'
          + '<form class="gb-form profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
          +   '<div class="field" style="flex:1;min-width:150px"><label>Component</label><select name="type">' + typeOpts + '</select></div>'
          +   '<div class="field" style="width:84px"><label>Score</label><input name="score" type="number" min="0" step="0.5" required></div>'
          +   '<div class="field" style="width:74px"><label>Out of</label><input name="max" type="number" min="1" step="0.5" value="100"></div>'
          +   '<div class="field" style="width:70px"><label>Week</label><input name="week" type="number" min="1" max="12"></div>'
          +   '<button type="submit" class="btn btn-primary" style="padding:9px 14px"><i class="fa-solid fa-plus"></i> Record</button>'
          + '</form>'
          + '<div class="gb-marks" hidden></div></div>';
      }).join('');
      content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Gradebook</h2><span style="font-size:0.8rem;color:var(--text-muted)">Pass mark ' + (gb.pass_mark || 50) + '%</span></div>'
        + '<div style="padding:0 22px 14px;color:var(--text-muted);font-size:0.86rem;line-height:1.55">Record weekly scores across the weighted components — results compute automatically and appear in each student\'s portal.</div></section>'
        + cards;
      content.querySelectorAll('.gb-form').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var card = form.closest('[data-eid]');
          var score = parseFloat(form.elements.score.value);
          if (isNaN(score)) return;
          var body = { enrollment_id: parseInt(card.getAttribute('data-eid'), 10), type: form.elements.type.value, score: score, max_score: parseFloat(form.elements.max.value) || 100 };
          if (form.elements.week.value) body.week = parseInt(form.elements.week.value, 10);
          var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
          API.request('instructor/assess', { method: 'POST', body: body }).then(function (r) {
            btn.disabled = false; btn.innerHTML = orig; form.reset(); form.elements.max.value = '100';
            gbApplyResult(card, r.result); gbCache = null; // next open re-fetches fresh standings
            var box = card.querySelector('.gb-marks'); if (box && !box.hidden) gbLoadMarks(card);
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Score recorded.', 'success');
          }).catch(function (err) {
            btn.disabled = false; btn.innerHTML = orig;
            var msg = (err && err.body && err.body.error) || 'try again';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not record: ' + msg, 'error'); else alert('Could not record the score.');
          });
        });
      });
      // Toggle the recorded-marks panel per card (loads on first open).
      content.querySelectorAll('.gb-marks-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var card = btn.closest('[data-eid]'), box = card.querySelector('.gb-marks');
          if (!box.hidden) { box.hidden = true; return; }
          box.hidden = false; gbLoadMarks(card);
        });
      });
    }).catch(function () {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load the gradebook.') + '</div></section>';
    });
  }

  // Repaint a card's standing pill from a recomputed result.
  function gbApplyResult(card, res) {
    res = res || {};
    var el = card.querySelector('.gb-result');
    if (el) el.innerHTML = gradePill({ total_score: res.total, grade: res.grade, outcome: res.outcome });
  }

  // Load + render one enrolment's recorded marks with correct (remark) / void
  // controls — so a mistaken score is fixed in place, never just averaged away.
  function gbLoadMarks(card) {
    var eid = card.getAttribute('data-eid'), box = card.querySelector('.gb-marks');
    box.innerHTML = '<div class="empty-state" style="padding:14px"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading marks…</div>';
    API.request('instructor/assessments?enrollment_id=' + encodeURIComponent(eid), { method: 'GET' }).then(function (r) {
      var marks = r.assessments || [];
      if (!marks.length) { box.innerHTML = '<div style="padding:10px 18px 16px;color:var(--text-muted);font-size:0.85rem">No marks recorded yet.</div>'; return; }
      var rows = marks.map(function (m) {
        var pct = m.max_score > 0 ? Math.round(m.score * 100 / m.max_score) : 0;
        return '<tr data-aid="' + m.id + '" data-score="' + m.score + '" data-max="' + m.max_score + '" data-week="' + (m.week != null ? m.week : '') + '" data-notes="' + P.escapeHtml(String(m.notes || '')) + '">'
          + '<td data-label="Component">' + P.escapeHtml(m.type_name || m.type_code || '—') + '</td>'
          + '<td data-label="Score"><strong>' + m.score + '</strong> / ' + m.max_score + ' <span style="color:var(--text-muted)">(' + pct + '%)</span></td>'
          + '<td data-label="Week">' + (m.week != null ? 'Wk ' + m.week : '—') + '</td>'
          + '<td data-label="Note">' + (m.notes ? P.escapeHtml(m.notes) : '<span style="color:var(--text-muted)">—</span>') + '</td>'
          + '<td data-label="" style="white-space:nowrap"><button type="button" class="btn btn-ghost gb-edit" style="padding:3px 9px;font-size:0.72rem">Edit</button> '
          + '<button type="button" class="btn btn-danger gb-void" style="padding:3px 9px;font-size:0.72rem">Void</button></td></tr>';
      }).join('');
      box.innerHTML = '<div class="ptable-wrap" style="padding:0 12px 14px"><table class="ptable"><thead><tr><th>Component</th><th>Score</th><th>Week</th><th>Note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        + '<p style="margin:2px 8px 0;font-size:0.78rem;color:var(--text-muted)">Editing corrects a mark in place; voiding removes it. Either way the result recomputes.</p></div>';
      gbWireMarkActions(card, box);
    }).catch(function () { box.innerHTML = '<div style="padding:12px 18px;color:#FB7185">Could not load marks.</div>'; });
  }

  function gbWireMarkActions(card, box) {
    box.querySelectorAll('.gb-void').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('[data-aid]'), aid = parseInt(tr.getAttribute('data-aid'), 10);
        if (!window.confirm('Void this mark? The result recomputes without it.')) return;
        API.request('instructor/assess', { method: 'POST', body: { assessment_id: aid, action: 'void' } }).then(function (r) {
          gbApplyResult(card, r.result); gbCache = null; gbLoadMarks(card);
          if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Mark voided.', 'success');
        }).catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not void the mark.', 'error'); });
      });
    });
    box.querySelectorAll('.gb-edit').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('[data-aid]');
        var typeName = tr.children[0].textContent;
        var score = tr.getAttribute('data-score'), max = tr.getAttribute('data-max'), week = tr.getAttribute('data-week'), notes = tr.getAttribute('data-notes');
        tr.innerHTML = '<td data-label="Component">' + P.escapeHtml(typeName) + '</td>'
          + '<td data-label="Score"><input class="ed-score" type="number" min="0" step="0.5" value="' + P.escapeHtml(score) + '" style="width:62px"> / <input class="ed-max" type="number" min="1" step="0.5" value="' + P.escapeHtml(max) + '" style="width:56px"></td>'
          + '<td data-label="Week"><input class="ed-week" type="number" min="1" max="12" value="' + P.escapeHtml(week) + '" style="width:50px"></td>'
          + '<td data-label="Note"><input class="ed-notes" type="text" value="' + P.escapeHtml(notes) + '" style="width:130px" maxlength="300"></td>'
          + '<td data-label="" style="white-space:nowrap"><button type="button" class="btn btn-primary ed-save" style="padding:3px 9px;font-size:0.72rem">Save</button> '
          + '<button type="button" class="btn btn-ghost ed-cancel" style="padding:3px 9px;font-size:0.72rem">Cancel</button></td>';
        tr.querySelector('.ed-cancel').addEventListener('click', function () { gbLoadMarks(card); });
        tr.querySelector('.ed-save').addEventListener('click', function () {
          var aid = parseInt(tr.getAttribute('data-aid'), 10);
          var sc = parseFloat(tr.querySelector('.ed-score').value);
          if (isNaN(sc)) return;
          var body = { assessment_id: aid, score: sc, max_score: parseFloat(tr.querySelector('.ed-max').value) || 100 };
          var wk = tr.querySelector('.ed-week').value; if (wk) body.week = parseInt(wk, 10);
          var nt = tr.querySelector('.ed-notes').value; if (nt) body.notes = nt;
          API.request('instructor/assess', { method: 'POST', body: body }).then(function (r) {
            gbApplyResult(card, r.result); gbCache = null; gbLoadMarks(card);
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Mark corrected.', 'success');
          }).catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not update the mark.', 'error'); });
        });
      });
    });
  }

  // Earnings — the instructor's wallet statement. Balance + ledger are recorded
  // by the Academy admin (no self top-up); this is a read-only statement.
  function renderEarnings() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + P.skeleton() + '</div></section>';
    API.request('instructor/earnings', { method: 'GET' }).then(function (w) {
      var bal = (w && w.balance_usd) || 0;
      var ledger = (w && w.ledger) || [];
      var rows = ledger.map(function (t) {
        var pos = t.amount_cents >= 0;
        var usd = Math.abs(t.amount_cents) / 100;
        return '<tr><td data-label="When">' + P.fmtDateTime(t.created_at) + '</td>'
          + '<td data-label="Detail">' + P.escapeHtml(t.reason_label || t.reason || '—') + (t.note ? '<br><span style="color:var(--text-muted);font-size:0.8rem">' + P.escapeHtml(t.note) + '</span>' : '') + '</td>'
          + '<td data-label="Amount" style="color:' + (pos ? 'var(--gold-bright)' : 'var(--text-soft)') + ';font-weight:700">' + (pos ? '+' : '−') + P.fmtUsd(usd) + '</td>'
          + '<td data-label="Balance">' + P.fmtUsd((t.balance_after_cents || 0) / 100) + '</td></tr>';
      }).join('');
      content.innerHTML = '<section class="panel" style="text-align:center;padding:8px 0 4px">'
        + '<div style="font-size:0.74rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted)">Earnings balance</div>'
        + '<div style="font:800 2.6rem/1 var(--font-display,inherit);color:var(--gold-bright);margin:8px 0">' + P.fmtUsd(bal) + '</div>'
        + '<p style="font-size:0.84rem;color:var(--text-muted);max-width:480px;margin:0 auto 8px">Your earnings statement, recorded by the Academy. Payout arrangements are handled directly with the office.</p></section>'
        + (ledger.length
            ? '<section class="panel"><div class="panel-head"><h2>Statement</h2></div><div class="ptable-wrap"><table class="ptable"><thead><tr><th>When</th><th>Detail</th><th>Amount</th><th>Balance</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>'
            : '<section class="panel"><div class="panel-body">' + empty('wallet', 'No earnings recorded yet. Amounts credited by the Academy will appear here.') + '</div></section>');

  function classFillBars(classes) {
    return classes.map(function (c) {
      var cap = parseInt(c.capacity,10)||0, en = parseInt(c.enrolled_count,10)||0;
      var pct = cap ? Math.min(100, Math.round(en/cap*100)) : 0;
      return '<div style="margin:12px 0">'
        + '<div style="display:flex;justify-content:space-between;font-size:0.86rem;margin-bottom:6px"><strong style="color:var(--text)">' + P.escapeHtml(c.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + en + (cap ? ' / ' + cap : '') + '</span></div>'
        + '<div class="studio-progress"><div class="studio-progress-fill" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }

  // Wait for the deferred Chart.js CDN; give up after ~3s and keep the fallback.
  function whenChart(cb, tries) {
    if (typeof window.Chart !== 'undefined') return cb(true);
    if ((tries || 0) >= 25) return cb(false);
    setTimeout(function () { whenChart(cb, (tries || 0) + 1); }, 120);
  }
  var _attChart = null;
  function drawAttChart(counts) {
    var canvas = document.getElementById('attChart'), fb = document.getElementById('attChartFallback');
    if (!canvas || !fb) return;
    var labels = ['Present', 'Late', 'Absent', 'Excused'];
    var values = [counts.present, counts.late, counts.absent, counts.excused];
    var colors = ['#34D399', '#FBBF24', '#FB7185', '#A5B4FC'];
    function cssFallback() {
      canvas.style.display = 'none';
      var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
      fb.innerHTML = labels.map(function (l, i) {
        return '<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:90px;color:var(--text-muted);font-size:0.84rem">' + l + '</span>'
          + '<div class="studio-progress" style="flex:1"><div class="studio-progress-fill" style="width:' + Math.round(values[i] / total * 100) + '%;background:' + colors[i] + '"></div></div>'
          + '<strong style="width:30px;text-align:right">' + values[i] + '</strong></div>';
      }).join('');
    }
    cssFallback(); // paint immediately
    whenChart(function (ok) {
      if (!ok || !document.body.contains(canvas)) return;
      try {
        if (_attChart) { _attChart.destroy(); _attChart = null; }
        fb.innerHTML = ''; canvas.style.display = '';
        _attChart = new window.Chart(canvas.getContext('2d'), {
          type: 'doughnut',
          data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderColor: 'rgba(0,0,0,0.2)', borderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { color: '#9A8264', padding: 14, font: { size: 12 } } } } }
        });
      } catch (e) { cssFallback(); }
    });
  }

  // Build + download a CSV client-side (RFC-4180 quoting) — no server round-trip.
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    API.request('instructor/student?id=' + encodeURIComponent(id)).then(function (r) {
      var sm = r.summary || {}, att = r.attendance || [], enr = r.enrollments || [];
      var total = (sm.present || 0) + (sm.late || 0) + (sm.absent || 0) + (sm.excused || 0);
      var rate = total ? Math.round(((sm.present || 0) + (sm.late || 0)) / total * 100) : null;
      var attRows = att.length ? att.map(function (a) {
        return '<tr><td data-label="Date">' + P.fmtDate(a.session_date) + '</td>'
          + '<td data-label="Class">' + P.escapeHtml(a.title || '—') + '</td>'
          + '<td data-label="Status"><span class="pill ' + P.escapeHtml(a.status) + '">' + P.escapeHtml(a.status) + '</span></td>'
          + '<td data-label="Notes" style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(a.notes || '') + '</td></tr>';
      }).join('') : '';
      box.innerHTML = '<section class="panel" style="margin-top:18px">'
        + '<div class="panel-head"><h2>' + P.escapeHtml(r.student.name || name) + '</h2><a class="panel-action" href="mailto:' + P.escapeHtml(r.student.email) + '">Email →</a></div>'
        + '<div style="padding:14px 22px"><section class="kpi-row">'
        +   kpi('Attendance', rate === null ? '—' : rate + '%', total ? 'over ' + total + ' sessions' : 'no records', 'gold')
        +   kpi('Present', sm.present || 0, 'sessions')
        +   kpi('Late', sm.late || 0, 'sessions')
        +   kpi('Absent', sm.absent || 0, 'sessions')
        + '</section>'
        + '<p style="color:var(--text-muted);font-size:0.85rem;margin:4px 0 0">Enrolled in: ' + (enr.length ? enr.map(function (e) { return P.escapeHtml(e.title); }).join(', ') : '—') + '</p></div>'
        + (att.length ? '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Date</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>' + attRows + '</tbody></table></div>' : '<div class="panel-body">' + empty('clipboard-list', 'No attendance recorded for this student yet.') + '</div>')
        + '</section>';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function () {
      box.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load this student.') + '</div></section>';
    });
  }

  function renderAttendance() {
    var students = data.students || [], att = data.recent_attendance || [];
    // Group students by class so the student picker filters when a class is
    // selected. Each student row carries its enrollment_id (from dashboard.php),
    // so a single click sets both the visible student + the form field the
    // backend actually uses.
    var byClass = {};
    students.forEach(function (st) { (byClass[st.class_id] = byClass[st.class_id] || []).push(st); });
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var classOpts = classes.map(function (c) { return '<option value="' + c.id + '">' + P.escapeHtml(c.title) + '</option>'; }).join('');

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Mark attendance</h2></div>'
      + '<form id="attForm" class="profile-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">'
      + '<div class="field"><label for="att-class">Class</label><select id="att-class" required>' + classOpts + '</select></div>'
      + '<div class="field"><label for="att-date">Date</label><input id="att-date" type="date" value="' + P.today() + '" required></div>'
      + '<div class="field"><label for="att-status">Status</label><select id="att-status" required><option value="present">Present</option><option value="late">Late</option><option value="absent">Absent</option><option value="excused">Excused</option></select></div>'
      + '<div class="field" style="grid-column:1/-1"><label for="att-notes">Notes</label><input id="att-notes" placeholder="Optional"></div>'
      + '<div class="field" style="grid-column:1/-1"><label>Student in class <small style="color:var(--text-muted);font-weight:400">— click a row to select, or use the bulk buttons below</small></label>'
      +   '<div id="att-students" style="display:grid;gap:8px;max-height:300px;overflow:auto;padding:10px;background:var(--bg-raised);border:1px solid var(--border);border-radius:10px"></div>'
      + '</div>'
      // QR self-check-in (#9/#10): show a QR students scan to mark themselves
      // present for the selected class, today. Uses the selected #att-class.
      + '<div class="field" style="grid-column:1/-1;padding:14px 16px;background:rgba(224,138,26,0.06);border:1px solid var(--border-gold);border-radius:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
      +   '<div style="flex:1;min-width:180px"><label style="color:var(--gold-bright);font-size:0.82rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:800;margin-bottom:4px;display:block"><i class="fa-solid fa-qrcode"></i> QR self-check-in</label><span style="color:var(--text-muted);font-size:0.8rem">Project a QR your students scan to mark themselves present for the selected class today.</span></div>'
      +   '<button type="button" class="btn btn-primary" id="att-qr-btn"><i class="fa-solid fa-qrcode"></i> Show check-in QR</button>'
      + '</div>'
      // Bulk-mark row. One tap → POSTs to /api/instructor/mark-attendance
      // with { class_id, default_status, session_date } so the entire
      // enrolled class gets a row for that date in one call.
      + '<div class="field" style="grid-column:1/-1;padding:14px 16px;background:rgba(252,198,71,0.06);border:1px dashed var(--border-gold);border-radius:10px">'
      +   '<label style="color:var(--gold-bright);font-size:0.82rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:800;margin-bottom:8px;display:block"><i class="fa-solid fa-bolt"></i> Bulk-mark whole class</label>'
      +   '<div style="display:flex;flex-wrap:wrap;gap:8px">'
      +     '<button type="button" class="btn" data-bulk="present" style="background:rgba(52,211,153,0.18);color:#A7F3D0;border:1px solid rgba(52,211,153,0.4)"><i class="fa-solid fa-check"></i> All present</button>'
      +     '<button type="button" class="btn" data-bulk="late" style="background:rgba(252,198,71,0.18);color:#FDE68A;border:1px solid rgba(252,198,71,0.4)"><i class="fa-solid fa-clock"></i> All late</button>'
      +     '<button type="button" class="btn" data-bulk="absent" style="background:rgba(244,63,94,0.14);color:#FCA5A5;border:1px solid rgba(244,63,94,0.4)"><i class="fa-solid fa-xmark"></i> All absent</button>'
      +     '<button type="button" class="btn" data-bulk="excused" style="background:rgba(165,180,252,0.14);color:#C7D2FE;border:1px solid rgba(165,180,252,0.4)"><i class="fa-solid fa-circle-info"></i> All excused</button>'
      +   '</div>'
      +   '<p style="margin:8px 4px 0;color:var(--text-muted);font-size:0.78rem;line-height:1.5">Uses the selected class &amp; date. Re-running on the same date safely updates existing rows.</p>'
      + '</div>'
      + '<input type="hidden" id="att-enrollment" name="enrollment_id" required>'
      + '<div class="actions" style="grid-column:1/-1"><button type="submit" class="btn btn-primary" id="att-submit" disabled><i class="fa-solid fa-check"></i> Save attendance</button>'
      +   '<span id="att-selected-label" aria-live="polite" style="margin-left:14px;color:var(--text-muted);font-size:0.88rem">No student selected</span></div>'
      + '</form></section>'
      + '<section class="panel"><div class="panel-head"><h2>Recent attendance</h2></div>'
      + (att.length ? attendanceTable(att) : '<div class="panel-body">' + empty('clipboard-list', 'No attendance recorded yet.') + '</div>') + '</section>';

    function paintStudents() {
      var cls = document.getElementById('att-class').value;
      var box = document.getElementById('att-students');
      var list = byClass[cls] || [];
      if (!list.length) { box.innerHTML = '<p style="margin:6px 4px;color:var(--text-muted);font-size:0.88rem">No students enrolled in this class yet.</p>'; return; }
      box.innerHTML = list.map(function (st) {
        return '<button type="button" class="att-student-row" aria-pressed="false" data-eid="' + st.enrollment_id + '" data-name="' + P.escapeHtml(st.name || '—') + '" '
          + 'style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;text-align:left;cursor:pointer;min-height:48px;color:var(--text);font-size:0.92rem">'
          + '<i class="fa-solid fa-user-graduate" style="color:var(--gold-bright)" aria-hidden="true"></i>'
          + '<span style="flex:1"><strong>' + P.escapeHtml(st.name || '—') + '</strong><br><span style="color:var(--text-muted);font-size:0.78rem">' + P.escapeHtml(st.email || '') + '</span></span>'
          + '<span style="color:var(--text-muted);font-size:0.76rem;font-family:monospace">#' + st.enrollment_id + '</span>'
          + '</button>';
      }).join('');
      box.querySelectorAll('.att-student-row').forEach(function (b) {
        b.addEventListener('click', function () {
          box.querySelectorAll('.att-student-row').forEach(function (x) { x.style.borderColor = 'var(--border)'; x.style.background = 'var(--bg-surface)'; x.setAttribute('aria-pressed', 'false'); });
          b.style.borderColor = 'var(--gold-bright)';
          b.style.background = 'rgba(252,198,71,0.10)';
          b.setAttribute('aria-pressed', 'true');
          document.getElementById('att-enrollment').value = b.getAttribute('data-eid');
          document.getElementById('att-selected-label').textContent = 'Selected: ' + b.getAttribute('data-name') + ' (enrolment #' + b.getAttribute('data-eid') + ')';
          document.getElementById('att-submit').disabled = false;
        });
      });
    }
    document.getElementById('att-class').addEventListener('change', paintStudents);
    paintStudents();

    // Bulk-mark whole class. One click → POST { class_id, default_status, date }.
    document.querySelectorAll('[data-bulk]').forEach(function (b) {
      b.addEventListener('click', function () {
        var classId = parseInt(document.getElementById('att-class').value, 10);
        var date = document.getElementById('att-date').value;
        var defaultStatus = b.getAttribute('data-bulk');
        var className = document.getElementById('att-class').options[document.getElementById('att-class').selectedIndex].text;
        if (!classId || !date) {
          (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Pick a class and date first', 'error') : alert('Pick a class and date first'));
          return;
        }
        function doBulk() {
          var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
          API.request('instructor/mark-attendance', { method: 'POST', body: { class_id: classId, session_date: date, default_status: defaultStatus, notes: document.getElementById('att-notes').value } })
            .then(function (res) {
              b.disabled = false; b.innerHTML = orig;
              var msg = (res.count || 0) + ' student' + ((res.count || 0) === 1 ? '' : 's') + ' marked ' + defaultStatus + '.';
              (window.MAM_DIALOG ? window.MAM_DIALOG.toast(msg, 'success') : alert(msg));
              load();
            })
            .catch(function (err) { b.disabled = false; b.innerHTML = orig; var msg = 'Could not save: ' + (err.body && err.body.error || 'unknown'); (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Could not save', msg, 'error') : alert(msg)); });
        }
        var prompt = 'Mark EVERY active student in "' + className + '" as ' + defaultStatus.toUpperCase() + ' for ' + date + '? You can edit individual students after.';
        if (window.MAM_DIALOG && window.MAM_DIALOG.confirm) {
          window.MAM_DIALOG.confirm('Bulk attendance', prompt, 'Mark all').then(function (ok) { if (ok) doBulk(); });
        } else if (confirm(prompt)) { doBulk(); }
      });
    });

    // QR self-check-in (#9/#10): fetch a signed, day-scoped token for the
    // selected class and render its scannable URL as a QR in an overlay.
    function showQrModal(r) {
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,7,4,.78);backdrop-filter:blur(4px)';
      var qrOk = (typeof QRCode !== 'undefined');
      // qrcodejs appends its <img> fallback asynchronously (after a data-URI
      // support probe) and ships it without an intrinsic size — a CSS rule sizes
      // it whenever it lands, and hides the redundant <canvas>.
      ov.innerHTML = '<style>#att-qr-canvas img{width:210px!important;height:210px!important;display:block;flex:none}#att-qr-canvas canvas{display:none}</style>'
        + '<div role="dialog" aria-modal="true" aria-label="Attendance check-in QR" style="max-width:400px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--border-gold);border-radius:18px;padding:26px 24px;box-shadow:0 30px 70px rgba(0,0,0,.5)">'
        + '<h3 style="font-family:var(--font-serif,Georgia,serif);margin:0 0 4px;color:var(--text)">Scan to check in</h3>'
        + '<p style="color:var(--text-muted);font-size:.85rem;margin:0 0 14px">' + P.escapeHtml(r.class_title || 'Class') + ' &middot; ' + P.escapeHtml(r.date || '') + '</p>'
        + (qrOk ? '<div id="att-qr-canvas" style="display:inline-block;background:#fff;padding:14px;border-radius:12px;margin:0 auto;line-height:0"></div>' : '')
        + '<p style="color:var(--text-soft);font-size:.78rem;margin:14px 0 0;word-break:break-all"><a href="' + encodeURI(r.url || '') + '" target="_blank" rel="noopener" style="color:var(--gold-bright)">' + P.escapeHtml(r.url || '') + '</a></p>'
        + '<p style="color:var(--text-muted);font-size:.76rem;margin:8px 0 0">Students sign in and scan &mdash; valid for today only.</p>'
        + '<button type="button" data-qr-close class="btn" style="margin-top:16px"><i class="fa-solid fa-xmark"></i> Close</button>'
        + '</div>';
      document.body.appendChild(ov);
      if (qrOk) { try { new QRCode(ov.querySelector('#att-qr-canvas'), { text: r.url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
      function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      ov.querySelector('[data-qr-close]').addEventListener('click', close);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      document.addEventListener('keydown', onKey);
    }
    var qrBtn = document.getElementById('att-qr-btn');
    if (qrBtn) qrBtn.addEventListener('click', function () {
      var classId = parseInt(document.getElementById('att-class').value, 10);
      if (!classId) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Pick a class first', 'error') : alert('Pick a class first')); return; }
      var orig = qrBtn.innerHTML; qrBtn.disabled = true; qrBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading…';
      API.request('instructor/attendance-qr?class_id=' + classId, { method: 'GET' })
        .then(function (r) { qrBtn.disabled = false; qrBtn.innerHTML = orig; showQrModal(r); })
        .catch(function () { qrBtn.disabled = false; qrBtn.innerHTML = orig; (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not load the QR', 'error') : alert('Could not load the QR')); });
    });

    document.getElementById('attForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var eid = parseInt(document.getElementById('att-enrollment').value, 10);
      if (!eid) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Please pick a student first', 'error') : alert('Please pick a student first')); return; }
      var payload = {
        enrollment_id: eid,
        session_date: document.getElementById('att-date').value,
        status: document.getElementById('att-status').value,
        notes: document.getElementById('att-notes').value,
      };
      var btn = document.getElementById('att-submit'); var orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      API.request('instructor/mark-attendance', { method: 'POST', body: payload })
        .then(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Attendance saved', 'success') : alert('Attendance saved.')); load(); })
        .catch(function (err) { btn.disabled = false; btn.innerHTML = orig; var msg = 'Could not save: ' + (err.body && err.body.error || 'unknown'); (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Could not save', msg, 'error') : alert(msg)); });
    });
  }
  function attendanceTable(att) {
    var rows = att.map(function (a) {
      return '<tr><td data-label="Date">' + P.fmtDate(a.session_date) + '</td>'
        + '<td data-label="Student"><strong>' + P.escapeHtml(a.student_name || '—') + '</strong></td>'
        + '<td data-label="Class">' + P.escapeHtml(a.class_title || '—') + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(a.status) + '">' + P.escapeHtml(a.status) + '</span></td>'
        + '<td data-label="Notes" style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(a.notes || '') + '</td></tr>';
    }).join('');
    return '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function kpi(label, value, sub, cls) {
    return '<div class="kpi"><div class="kpi-label">' + P.escapeHtml(label) + '</div><div class="kpi-value ' + (cls || '') + '">' + value + '</div><div class="kpi-sub">' + P.escapeHtml(sub || '') + '</div></div>';
  }
  function empty(icon, text) { return '<div class="empty-state"><i class="fa-solid fa-' + icon + '"></i>' + text + '</div>'; }

  // Single delegated handler (bound once) for every [data-tab] link, including
  // ones rendered later — replaces the old per-render re-binding that leaked
  // duplicate listeners on each overview paint.
  var _navBound = false;
  function bindTabLinks() {
    if (_navBound) return; _navBound = true;
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-tab]'); if (!a) return;
      var t = a.getAttribute('data-tab'); if (!t) return;
      e.preventDefault(); show(t);
      try { history.replaceState(null, '', '#' + t); } catch (e2) {}
    });
  }

  function load() {
    return API.request('instructor/dashboard').then(function (r) {
      data = r;
      P.mountUserCard({ name: r.user.name, email: r.user.email, role: 'instructor', avatar_url: r.user.avatar_url });
      var tab = (location.hash || '#overview').slice(1);
      if (!tabs[tab]) tab = 'overview';
      // A temporary password must be changed first — land on Account.
      if (r.user && r.user.must_change_password) tab = 'account';
      content.removeAttribute('aria-busy');
      show(tab);
    });
  }

  P.requireAuth(['instructor', 'admin']).then(function () {
    P.init(); bindTabLinks(); syncTabs = P.enhanceTabs({ onActivate: show }); return load();
  }).catch(function (e) {
    if (e.message !== 'unauthenticated') content.innerHTML = empty('triangle-exclamation', 'Could not load your dashboard.');
  });
})();
</script>
</body>
</html>
