<!DOCTYPE html>
<html lang="en" data-portal="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instructor portal · MAM Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Registers, marking, teach-backs, termly reports and your earnings statement at MAM Academy.">
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<!-- ONE stylesheet, as on the guardian portal. portal-v2.css is scoped under
     [data-portal="v2"] and is a complete design system; main.css and portal.css
     are the warm dark set, and loading both palettes on one page is the
     theme-on-theme bug this rebuild removes. -->
<link rel="stylesheet" href="/assets/css/portal-v2.css?v=20261120g">
<script>
/* Pre-paint, so an instructor who has chosen larger text or dark never sees one
   frame of the other. Attributes on the root; portal-v2.css does the rest.
   The key is shared with the guardian portal on purpose: it is one person's
   preference about their eyes, not a per-portal setting. */
(function () {
  var r = document.documentElement;
  try {
    var a = JSON.parse(localStorage.getItem('mam-guardian-a11y') || '{}');
    if (a.text === 'lg' || a.text === 'xl') r.setAttribute('data-text', a.text);
    if (a.ease)    r.setAttribute('data-ease', '1');
    if (a.lowdata) r.setAttribute('data-lowdata', '1');
    if (a.theme === 'dark' || a.theme === 'light') r.setAttribute('data-theme', a.theme);
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) r.setAttribute('data-theme', 'dark');
  } catch (e) { /* a broken preference must never stop the page rendering */ }
})();
</script>
</head>
<body>

<a class="p-skip" href="#main">Skip to the main content</a>

<div class="p-app">

  <!-- The nav comes FIRST in the DOM. On mobile it is position:fixed so source
       order is irrelevant; on desktop .p-app becomes a flex row and source order
       is what puts the rail on the left, where the design has it. -->
  <nav class="p-nav" id="nav" aria-label="Instructor portal">
    <!-- Rail furniture. Hidden below 900px, where the same two facts live in
         the top header and the Earnings screen instead — the design puts the
         brand and the clearance on the desktop rail and nowhere near a phone's
         bottom bar, which has room for five destinations and nothing else. -->
    <a class="p-rail-brand" href="/">
      <img src="/mam-academy-logo.svg" alt="" width="32" height="32">
      <span><span class="p-rail-word">MAM ACADEMY</span><span class="p-rail-sub">Instructor</span></span>
    </a>
    <button type="button" data-screen="home" aria-current="page">
      <i class="fa-solid fa-house" aria-hidden="true"></i>Home
    </button>
    <button type="button" data-screen="register">
      <i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>Register
    </button>
    <button type="button" data-screen="marking">
      <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>Marking
      <span class="p-badge" id="markBadge" hidden></span>
    </button>
    <button type="button" data-screen="students">
      <i class="fa-solid fa-users" aria-hidden="true"></i>Students
    </button>
    <button type="button" data-sheet-open>
      <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>More
    </button>
    <div class="p-rail-foot">
      <div class="p-who">
        <span class="p-avatar is-sm" id="railInitials" aria-hidden="true"></span>
        <span class="p-who-main"><span class="p-title" id="railName">Instructor</span>
        <span class="p-caption" id="railSubjects"></span></span>
      </div>
      <!-- Clearance on the rail, because an instructor whose vetting has lapsed
           should not have to go looking for that. Filled by the Earnings
           payload; hidden until it is known, never guessed at. -->
      <div class="p-rail-clear" id="railClear" hidden>
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span id="railClearText"></span>
      </div>
    </div>
  </nav>

  <div class="p-body-col">
    <header class="p-top">
      <div class="p-top-main">
        <div class="p-title" id="whoName">Instructor portal</div>
        <div class="p-caption" id="whoMeta">Loading your teaching…</div>
      </div>
      <button type="button" class="p-icon" data-screen="earnings" id="clearanceBtn"
              aria-label="Earnings and safeguarding clearance">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        <span class="p-badge" id="clearBadge" hidden></span>
      </button>
    </header>

    <main class="p-scroll" id="main">
      <div class="p-empty">
        <i class="fa-solid fa-circle-notch p-spin" aria-hidden="true"></i>
        <p>Loading today…</p>
      </div>
    </main>
  </div>
</div>

<!-- The More bottom-sheet. On desktop the same list renders inline (the sheet
     positioning is unset above 900px) so nothing is only reachable by a gesture.
     Grouped Teach / Assess / Account, as the design groups it. -->
<div class="p-sheet" id="sheet" hidden>
  <button type="button" class="p-sheet-scrim" data-sheet-close aria-label="Close the menu"></button>
  <div class="p-sheet-body" role="dialog" aria-modal="true" aria-label="More">
    <div class="p-sheet-grip" aria-hidden="true"></div>

    <button type="button" class="p-row is-tall" data-screen="a11y">
      <i class="fa-solid fa-sliders p-row-ico is-accent" aria-hidden="true"></i>
      <span class="p-row-main">
        <span class="p-title">Display &amp; access</span>
        <span class="p-caption">Text size, easier type, less data, dark mode</span>
      </span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>

    <div class="p-label p-sheet-head">Assess</div>
    <button type="button" class="p-row" data-screen="space">
      <i class="fa-solid fa-people-group p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Class spaces</span><span class="p-caption">Tasks, handed-in videos, marks, what is held</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="concern">
      <i class="fa-solid fa-shield-halved p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Raise a safeguarding concern</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="teachbacks">
      <i class="fa-solid fa-microphone-lines p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Teach-backs</span></span>
      <span class="p-count" id="sheetTbBadge" hidden></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="report">
      <i class="fa-solid fa-file-lines p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Termly reports</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>

    <div class="p-label p-sheet-head">Account</div>
    <button type="button" class="p-row" data-screen="earnings">
      <i class="fa-solid fa-wallet p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Earnings &amp; clearance</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <!-- The redesign covers seven screens; the legacy dashboard serves thirteen
         tabs (classes, sessions, assignments, gradebook, analytics, announce,
         handbook, account …) and is NOT retired until each has been rebuilt
         here. Same arrangement as admin/index.php beside admin/console.php:
         both reachable, each linking to the other. -->
    <a class="p-row" href="/portal/instructor/classic.html">
      <i class="fa-solid fa-table-columns p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main">
        <span class="p-title">Everything else</span>
        <span class="p-caption">Classes, sessions, assignments, gradebook, analytics, announcements</span>
      </span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </a>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <button type="button" class="p-row" id="signOut">
      <i class="fa-solid fa-arrow-right-from-bracket p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Sign out</span></span>
    </button>
  </div>
</div>

<!-- Write feedback. Never an optimistic tick (design refusal 6): a control goes
     busy, then reports what actually happened. `aria-live=polite` so the sentence
     reaches a screen reader without interrupting. -->
<div class="p-toast" id="toast" role="status" aria-live="polite" hidden>
  <i class="fa-solid fa-circle-info" aria-hidden="true"></i><span id="toastText"></span>
  <!-- Shown only for a FAILURE, which is also the only kind that does not
       time out. A success may vanish on its own; an error is often the only
       record that the thing the reader pressed did not happen, and five
       seconds is not long enough to read it, look at the control it refers
       to, and act. -->
  <button type="button" class="p-toast-x" id="toastClose" aria-label="Dismiss this message" hidden>
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<script src="/assets/js/portal.js?v=20261120a"></script>

<script src="/assets/js/portal-spaces.js?v=20261120a"></script>

</body>
</html>
