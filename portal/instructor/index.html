<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Instructor Portal — MAM Academy</title>
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/assets/css/main.css?v=20260612b">
<link rel="stylesheet" href="/assets/css/portal.css?v=20260602b">
<link rel="stylesheet" href="/assets/css/studio.css?v=20260531b">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<div class="portal-shell">
  <aside class="portal-side">
    <div class="portal-brand">
      <img src="/mam-academy-logo.svg" alt="" onerror="this.style.display='none'">
      <div>
        <div class="portal-brand-name">MAM ACADEMY</div>
        <div class="portal-brand-sub">Instructor Portal</div>
      </div>
    </div>
    <div class="portal-user" id="userCard"><div class="portal-avatar">?</div><div><div class="portal-user-name">Loading…</div></div></div>
    <nav class="portal-nav">
      <a class="portal-nav-link active" href="#overview" data-tab="overview"><i class="fa-solid fa-gauge"></i>Overview</a>
      <a class="portal-nav-link" href="#classes" data-tab="classes"><i class="fa-solid fa-chalkboard-user"></i>My Classes</a>
      <a class="portal-nav-link" href="#students" data-tab="students"><i class="fa-solid fa-users"></i>Students</a>
      <a class="portal-nav-link" href="#assignments" data-tab="assignments"><i class="fa-solid fa-list-check"></i>Assignments</a>
      <a class="portal-nav-link" href="#attendance" data-tab="attendance"><i class="fa-solid fa-clipboard-list"></i>Attendance</a>
      <a class="portal-nav-link" href="#gradebook" data-tab="gradebook"><i class="fa-solid fa-graduation-cap"></i>Gradebook</a>
      <a class="portal-nav-link" href="#announce" data-tab="announce"><i class="fa-solid fa-bullhorn"></i>Announcements</a>
      <a class="portal-nav-link" href="#account" data-tab="account"><i class="fa-solid fa-user-gear"></i>Account</a>
      <a class="portal-nav-link" href="/studio" target="_blank" rel="noopener" style="margin-top:14px;border-top:1px dashed var(--border);padding-top:18px"><i class="fa-solid fa-wand-magic-sparkles"></i>Practice Studio <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.7em;margin-left:auto;opacity:0.7"></i></a>
    </nav>
    <div class="portal-side-foot">
      <a href="/"><i class="fa-solid fa-house"></i>Back to site</a>
      <button type="button" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
    </div>
  </aside>

  <main class="portal-main">
    <button class="portal-side-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i> Menu</button>
    <header class="portal-top">
      <h1 id="pageTitle">Overview <small id="pageSub">Welcome back</small></h1>
    </header>
    <div id="content"><div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading…</div></div>
  </main>
</div>

<script src="/assets/js/config.js?v=20260601a"></script>
<script src="/assets/js/portal.js?v=20260530a"></script>
<script src="/assets/js/libs.js?v=20260530a" async></script>
<script>
(function () {
  var P = window.MAM_PORTAL, API = window.MAM_API;
  var content = document.getElementById('content');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var tabs = { overview: ['Overview', 'Your teaching at a glance'], classes: ['My Classes', 'Active classes you teach'], students: ['Students', 'Everyone in your classes'], assignments: ['Assignments', 'Set practice tasks & track completion'], attendance: ['Attendance', 'Mark and review attendance'], gradebook: ['Gradebook', 'Grade students across the weighted components'], announce: ['Announcements', 'Post updates your students see'], account: ['Account', 'Your profile & password'] };
  var data = null;

  function show(tab) {
    document.querySelectorAll('[data-tab]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    var t = tabs[tab] || tabs.overview;
    pageTitle.firstChild.textContent = t[0] + ' ';
    pageSub.textContent = t[1];
    if (!data) return;
    if (tab === 'overview') return renderOverview();
    if (tab === 'classes') return renderClasses();
    if (tab === 'students') return renderStudents();
    if (tab === 'assignments') return renderAssignments();
    if (tab === 'attendance') return renderAttendance();
    if (tab === 'gradebook') return renderGradebook();
    if (tab === 'announce') return renderAnnounce();
    if (tab === 'account') return renderAccount();
  }

  function renderAssignments() {
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var students = data.students || [];
    var asg = data.assignments || [];
    if (!classes.length && !students.length) {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('list-check', 'Add students to a class first — then you can set assignments.') + '</div></section>';
      return;
    }
    var clsOpts = classes.map(function (c) { return '<option value="class:' + c.id + '">Whole class — ' + P.escapeHtml(c.title) + '</option>'; }).join('');
    var stuOpts = students.map(function (s) { return '<option value="student:' + s.id + '">' + P.escapeHtml(s.name) + (s.class_title ? ' (' + P.escapeHtml(s.class_title) + ')' : '') + '</option>'; }).join('');
    var targetSel = '<select id="asg-target" required>'
      + (clsOpts ? '<optgroup label="Classes">' + clsOpts + '</optgroup>' : '')
      + (stuOpts ? '<optgroup label="Students">' + stuOpts + '</optgroup>' : '')
      + '</select>';
    var doneCount = asg.filter(function (a) { return a.status === 'done'; }).length;
    var list = asg.length ? asg.map(function (a) {
      var done = a.status === 'done';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);margin-bottom:10px">'
        + '<div style="min-width:200px;flex:1"><strong style="color:var(--text)">' + P.escapeHtml(a.title) + '</strong>'
        + '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:3px">' + P.escapeHtml(a.student_name || '') + (a.class_title ? ' · ' + P.escapeHtml(a.class_title) : '') + (a.due_on ? ' · due ' + P.fmtDate(a.due_on) : '') + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<span class="pill ' + (done ? 'present' : 'pending') + '">' + (done ? 'done' : 'open') + '</span>'
        +   '<button type="button" class="asg-del" data-id="' + a.id + '" title="Delete assignment" aria-label="Delete assignment" style="width:34px;height:34px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);cursor:pointer"><i class="fa-solid fa-trash-can"></i></button>'
        + '</div></div>';
    }).join('') : '<div class="panel-body">' + empty('list-check', 'No assignments set yet. Create one above.') + '</div>';

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Set an assignment</h2></div>'
      + '<form id="asgForm" class="profile-form" style="padding:18px 22px;display:grid;gap:14px">'
      +   '<div class="field"><label for="asg-target">Assign to</label>' + targetSel + '</div>'
      +   '<div class="field"><label for="asg-title">Title</label><input id="asg-title" maxlength="160" required placeholder="e.g. Prepare C major scale, hands together"></div>'
      +   '<div class="field"><label for="asg-instr">Instructions</label><textarea id="asg-instr" rows="3" placeholder="What should they practise, and how?"></textarea></div>'
      +   '<div class="field"><label for="asg-due">Due date (optional)</label><input id="asg-due" type="date"></div>'
      +   '<div class="actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-list-check"></i> Set assignment</button></div>'
      + '</form></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Assignments set</h2>'
      + (asg.length ? '<span style="font-size:0.8rem;color:var(--text-muted)">' + doneCount + ' of ' + asg.length + ' done · ' + (asg.length - doneCount) + ' open</span>' : '')
      + '</div><div style="padding:14px 18px">' + list + '</div></section>';

    content.querySelectorAll('.asg-del').forEach(function (b) {
      b.addEventListener('click', function () {
        var go = function () {
          b.disabled = true;
          API.request('instructor/assignment-delete', { method: 'POST', body: { id: parseInt(b.getAttribute('data-id'), 10) } })
            .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Assignment deleted.', 'success'); return load(); })
            .catch(function (err) {
              b.disabled = false;
              (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not delete: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not delete.'));
            });
        };
        if (window.MAM_DIALOG && window.MAM_DIALOG.confirm) window.MAM_DIALOG.confirm('Delete this assignment?', 'The student will no longer see it.', 'Delete').then(function (ok) { if (ok) go(); });
        else if (confirm('Delete this assignment?')) go();
      });
    });

    document.getElementById('asgForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('asg-title').value.trim();
      if (!title) return;
      var tgt = (document.getElementById('asg-target').value || '').split(':');
      var body = { title: title, instructions: document.getElementById('asg-instr').value.trim(), due_on: document.getElementById('asg-due').value || null };
      if (tgt[0] === 'class') body.class_id = parseInt(tgt[1], 10); else body.student_id = parseInt(tgt[1], 10);
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
      API.request('instructor/assignment', { method: 'POST', body: body }).then(function (r) {
        var n = r.created || 1;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Assignment set for ' + n + ' student' + (n === 1 ? '' : 's') + '.', 'success') : alert('Set.'));
        return load();
      }).catch(function (err) {
        btn.disabled = false; btn.innerHTML = orig;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not set: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not set.'));
      });
    });
  }

  // ── Gradebook (v16 LMS): weighted assessment entry → auto results ──────
  var gbCache = null;
  function gradePill(row) {
    if (row.total_score == null) return '<span class="pill pending">ungraded</span>';
    var cls = row.outcome === 'pass' ? 'present' : 'withdrawn';
    return '<span class="pill ' + cls + '">' + P.escapeHtml(String(row.grade || '')) + ' · ' + Math.round(row.total_score) + '% · ' + P.escapeHtml(String(row.outcome || '')) + '</span>';
  }
  function loadGradebook(force) {
    if (gbCache && !force) return Promise.resolve(gbCache);
    return API.request('instructor/gradebook', { method: 'GET' }).then(function (r) { gbCache = r || {}; return gbCache; });
  }
  function renderGradebook() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('clipboard-list', 'Loading gradebook…') + '</div></section>';
    loadGradebook().then(function (gb) {
      var ens = gb.enrollments || [], types = gb.types || [];
      if (!ens.length) {
        content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('graduation-cap', 'No course students assigned yet. When an admin approves a student\'s course and assigns it to you, they appear here to grade.') + '</div></section>';
        return;
      }
      var typeOpts = types.map(function (t) { return '<option value="' + P.escapeHtml(t.code) + '">' + P.escapeHtml(t.name) + ' (' + t.weight + '%)</option>'; }).join('');
      var cards = ens.map(function (e) {
        return '<div class="panel" data-eid="' + e.id + '" style="margin-bottom:14px">'
          + '<div class="panel-head"><h2 style="font-size:1rem">' + P.escapeHtml(e.student_name) + ' <span style="color:var(--text-muted);font-weight:500">— ' + P.escapeHtml(e.course_name) + (e.level_name ? ' · ' + P.escapeHtml(e.level_name) : '') + '</span></h2>'
          + '<span class="gb-result">' + gradePill(e) + '</span></div>'
          + '<form class="gb-form profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
          +   '<div class="field" style="flex:1;min-width:150px"><label>Component</label><select name="type">' + typeOpts + '</select></div>'
          +   '<div class="field" style="width:84px"><label>Score</label><input name="score" type="number" min="0" step="0.5" required></div>'
          +   '<div class="field" style="width:74px"><label>Out of</label><input name="max" type="number" min="1" step="0.5" value="100"></div>'
          +   '<div class="field" style="width:70px"><label>Week</label><input name="week" type="number" min="1" max="12"></div>'
          +   '<button type="submit" class="btn btn-primary" style="padding:9px 14px"><i class="fa-solid fa-plus"></i> Record</button>'
          + '</form></div>';
      }).join('');
      content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Gradebook</h2><span style="font-size:0.8rem;color:var(--text-muted)">Pass mark ' + (gb.pass_mark || 50) + '%</span></div>'
        + '<div style="padding:0 22px 14px;color:var(--text-muted);font-size:0.86rem;line-height:1.55">Record weekly scores across the weighted components — results compute automatically and appear in each student\'s portal.</div></section>'
        + cards;
      content.querySelectorAll('.gb-form').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var card = form.closest('[data-eid]');
          var score = parseFloat(form.elements.score.value);
          if (isNaN(score)) return;
          var body = { enrollment_id: parseInt(card.getAttribute('data-eid'), 10), type: form.elements.type.value, score: score, max_score: parseFloat(form.elements.max.value) || 100 };
          if (form.elements.week.value) body.week = parseInt(form.elements.week.value, 10);
          var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
          API.request('instructor/assess', { method: 'POST', body: body }).then(function (r) {
            btn.disabled = false; btn.innerHTML = orig; form.reset(); form.elements.max.value = '100';
            var res = r.result || {};
            card.querySelector('.gb-result').innerHTML = gradePill({ total_score: res.total, grade: res.grade, outcome: res.outcome });
            gbCache = null; // next open re-fetches fresh standings
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Score recorded.', 'success');
          }).catch(function (err) {
            btn.disabled = false; btn.innerHTML = orig;
            var msg = (err && err.body && err.body.error) || 'try again';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not record: ' + msg, 'error'); else alert('Could not record the score.');
          });
        });
      });
    }).catch(function () {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load the gradebook.') + '</div></section>';
    });
  }

  function renderAnnounce() {
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var anns = data.announcements || [];
    if (!classes.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('bullhorn', 'You need an active class before you can post an announcement.') + '</div></section>'; return; }
    var opts = classes.map(function (c) { return '<option value="' + c.id + '">' + P.escapeHtml(c.title) + '</option>'; }).join('');
    var list = anns.length ? anns.map(function (a) {
      return '<div style="padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);margin-bottom:10px">'
        + '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong style="color:var(--text)">' + P.escapeHtml(a.title || 'Announcement') + '</strong>'
        + '<span style="font-size:0.78rem;color:var(--text-muted)">' + P.escapeHtml(a.class_title || '') + ' · ' + P.fmtDateTime(a.created_at) + '</span></div>'
        + '<p style="margin:6px 0 0;color:var(--text-soft);font-size:0.9rem;line-height:1.55;white-space:pre-wrap">' + P.escapeHtml(a.body) + '</p></div>';
    }).join('') : '<div class="panel-body">' + empty('bullhorn', 'No announcements yet. Post your first above.') + '</div>';

    var res = data.resources || [];
    var resIcon = { link: 'link', sheet: 'file-lines', video: 'video', doc: 'file' };
    var resList = res.length ? res.map(function (r) {
      return '<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);margin-bottom:8px">'
        + '<i class="fa-solid fa-' + (resIcon[r.type] || 'link') + '" style="color:var(--gold-bright)"></i>'
        + '<div style="flex:1;min-width:0"><a href="' + P.escapeHtml(r.url) + '" target="_blank" rel="noopener" style="color:var(--text);font-weight:600;text-decoration:none">' + P.escapeHtml(r.title) + '</a>'
        + '<div style="font-size:0.76rem;color:var(--text-muted)">' + P.escapeHtml(r.class_title || '') + ' · ' + P.fmtDate(r.created_at) + '</div></div>'
        + '<a href="' + P.escapeHtml(r.url) + '" target="_blank" rel="noopener" style="color:var(--gold-bright);font-size:0.8rem">Open <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>';
    }).join('') : '<div class="panel-body">' + empty('folder-open', 'No resources yet. Share a link, sheet or video above.') + '</div>';

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Post an announcement</h2></div>'
      + '<form id="annForm" class="profile-form" style="padding:18px 22px;display:grid;gap:14px">'
      +   '<div class="field"><label for="ann-class">Class</label><select id="ann-class" required>' + opts + '</select></div>'
      +   '<div class="field"><label for="ann-title">Title</label><input id="ann-title" maxlength="160" placeholder="e.g. Recital this Friday"></div>'
      +   '<div class="field"><label for="ann-body">Message</label><textarea id="ann-body" rows="4" required placeholder="What should your students know?"></textarea></div>'
      +   '<div class="actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Post to class</button></div>'
      + '</form></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Posted announcements</h2></div><div style="padding:14px 18px">' + list + '</div></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Share a resource</h2></div>'
      + '<form id="resForm" class="profile-form" style="padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">'
      +   '<div class="field"><label for="res-class">Class</label><select id="res-class" required>' + opts + '</select></div>'
      +   '<div class="field"><label for="res-type">Type</label><select id="res-type"><option value="link">Link</option><option value="sheet">Sheet music</option><option value="video">Video</option><option value="doc">Document</option></select></div>'
      +   '<div class="field" style="grid-column:1/-1"><label for="res-title">Title</label><input id="res-title" maxlength="200" required placeholder="e.g. Week 3 scales sheet"></div>'
      +   '<div class="field" style="grid-column:1/-1"><label for="res-url">URL (https://…)</label><input id="res-url" type="url" required placeholder="https://…"></div>'
      +   '<div class="actions" style="grid-column:1/-1"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-paperclip"></i> Add resource</button></div>'
      + '</form></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Shared resources</h2></div><div style="padding:14px 18px">' + resList + '</div></section>';
    document.getElementById('annForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var body = document.getElementById('ann-body').value.trim();
      if (!body) return;
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Posting…';
      API.request('instructor/announce', { method: 'POST', body: {
        class_id: document.getElementById('ann-class').value,
        title: document.getElementById('ann-title').value.trim(),
        body: body
      } }).then(function () {
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Announcement posted.', 'success') : alert('Posted.'));
        return load();
      }).catch(function (err) {
        btn.disabled = false; btn.innerHTML = orig;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not post: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not post.'));
      });
    });
    document.getElementById('resForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var url = document.getElementById('res-url').value.trim();
      var title = document.getElementById('res-title').value.trim();
      if (!url || !title) return;
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Adding…';
      API.request('instructor/resource', { method: 'POST', body: {
        class_id: document.getElementById('res-class').value,
        type: document.getElementById('res-type').value,
        title: title, url: url
      } }).then(function () {
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Resource added.', 'success') : alert('Added.'));
        return load();
      }).catch(function (err) {
        btn.disabled = false; btn.innerHTML = orig;
        var c = err.body && err.body.error;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast(c === 'validation' ? 'Check the title and a valid https URL.' : 'Could not add resource.', 'error') : alert('Could not add.'));
      });
    });
  }

  function renderAccount() {
    var u = data.user || {}, pr = data.profile || {};
    var mustChange = u.must_change_password;
    content.innerHTML = ''
      + (mustChange ? '<div class="portal-banner" style="display:flex;margin-bottom:18px"><i class="fa-solid fa-key"></i><span>You\'re using a temporary password. Please set a new one below.</span></div>' : '')
      + '<section class="panel"><div class="panel-head"><h2>Public profile</h2></div><form class="profile-form" id="profileForm" style="padding:18px 22px">'
      +   '<div class="field"><label for="pf-name">Full name</label><input id="pf-name" value="' + P.escapeHtml(u.name || '') + '" required></div>'
      +   '<div class="field"><label for="pf-phone">Phone</label><input id="pf-phone" type="tel" value="' + P.escapeHtml(u.phone || '') + '"></div>'
      +   '<div class="field"><label>Email</label><input value="' + P.escapeHtml(u.email || '') + '" disabled></div>'
      +   '<div class="field"><label for="pf-spec">Specialties</label><input id="pf-spec" placeholder="e.g. Piano, Theory, Choral" value="' + P.escapeHtml(pr.specialties || '') + '"></div>'

  function classFillBars(classes) {
    return classes.map(function (c) {
      var cap = parseInt(c.capacity,10)||0, en = parseInt(c.enrolled_count,10)||0;
      var pct = cap ? Math.min(100, Math.round(en/cap*100)) : 0;
      return '<div style="margin:12px 0">'
        + '<div style="display:flex;justify-content:space-between;font-size:0.86rem;margin-bottom:6px"><strong style="color:var(--text)">' + P.escapeHtml(c.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + en + (cap ? ' / ' + cap : '') + '</span></div>'
        + '<div class="studio-progress"><div class="studio-progress-fill" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }

  // Wait for the deferred Chart.js CDN; give up after ~3s and keep the fallback.
  function whenChart(cb, tries) {
    if (typeof window.Chart !== 'undefined') return cb(true);
    if ((tries || 0) >= 25) return cb(false);
    setTimeout(function () { whenChart(cb, (tries || 0) + 1); }, 120);
  }
  var _attChart = null;
  function drawAttChart(counts) {
    var canvas = document.getElementById('attChart'), fb = document.getElementById('attChartFallback');
    if (!canvas || !fb) return;
    var labels = ['Present', 'Late', 'Absent', 'Excused'];
    var values = [counts.present, counts.late, counts.absent, counts.excused];
    var colors = ['#34D399', '#FBBF24', '#FB7185', '#A5B4FC'];
    function cssFallback() {
      canvas.style.display = 'none';
      var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
      fb.innerHTML = labels.map(function (l, i) {
        return '<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:90px;color:var(--text-muted);font-size:0.84rem">' + l + '</span>'
          + '<div class="studio-progress" style="flex:1"><div class="studio-progress-fill" style="width:' + Math.round(values[i] / total * 100) + '%;background:' + colors[i] + '"></div></div>'
          + '<strong style="width:30px;text-align:right">' + values[i] + '</strong></div>';
      }).join('');
    }
    cssFallback(); // paint immediately
    whenChart(function (ok) {
      if (!ok || !document.body.contains(canvas)) return;
      try {
        if (_attChart) { _attChart.destroy(); _attChart = null; }
        fb.innerHTML = ''; canvas.style.display = '';
        _attChart = new window.Chart(canvas.getContext('2d'), {
          type: 'doughnut',
          data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderColor: 'rgba(0,0,0,0.2)', borderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { color: '#9A8264', padding: 14, font: { size: 12 } } } } }
        });
      } catch (e) { cssFallback(); }
    });
  }

  function renderStudents() {
    var s = data.students || [];
    if (!s.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('users', 'No students enrolled in your classes.') + '</div></section>'; return; }
    // De-duplicate (a student can appear once per class) for the roster list.

      return '<tr class="row-click" data-student="' + st.id + '" style="cursor:pointer">'

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Roster <small style="color:var(--text-muted);font-weight:400">— click a student for their attendance history</small></h2>'
      + '<button type="button" class="panel-action" id="rosterCsv"><i class="fa-solid fa-download"></i> Roster CSV</button></div>'
      + '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Student</th><th>Email</th><th>Phone</th><th>Class</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>'
      + '<div id="studentDetail"></div>';

      tr.addEventListener('click', function () { openStudent(tr.getAttribute('data-student'), tr.querySelector('strong').textContent); });
    });
    var csvBtn = document.getElementById('rosterCsv');
    if (csvBtn) csvBtn.addEventListener('click', function () {
      // Full roster (one row per enrolment) so a student in two classes appears twice.
      var rowsCsv = [['Name', 'Email', 'Phone', 'Class']];
      s.forEach(function (st) { rowsCsv.push([st.name || '', st.email || '', st.phone || '', st.class_title || '']); });
      downloadCsv('mam-roster-' + new Date().toISOString().slice(0, 10) + '.csv', rowsCsv);
    });
  }

  // Build + download a CSV client-side (RFC-4180 quoting) — no server round-trip.
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function openStudent(id, name) {

        + '<div style="padding:14px 22px"><section class="kpi-row">'
        +   kpi('Attendance', rate === null ? '—' : rate + '%', total ? 'over ' + total + ' sessions' : 'no records', 'gold')
        +   kpi('Present', sm.present || 0, 'sessions')
        +   kpi('Late', sm.late || 0, 'sessions')
        +   kpi('Absent', sm.absent || 0, 'sessions')

        + '<p style="color:var(--text-muted);font-size:0.85rem;margin:4px 0 0">Enrolled in: ' + (enr.length ? enr.map(function (e) { return P.escapeHtml(e.title); }).join(', ') : '—') + '</p></div>'
        + (att.length ? '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Date</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>' + attRows + '</tbody></table></div>' : '<div class="panel-body">' + empty('clipboard-list', 'No attendance recorded for this student yet.') + '</div>')
        + '</section>';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });

    });

  function renderAttendance() {
    var students = data.students || [], att = data.recent_attendance || [];
    // Group students by class so the student picker filters when a class is
    // selected. Each student row carries its enrollment_id (from dashboard.php),
    // so a single click sets both the visible student + the form field the
    // backend actually uses.
    var byClass = {};
    students.forEach(function (st) { (byClass[st.class_id] = byClass[st.class_id] || []).push(st); });
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var classOpts = classes.map(function (c) { return '<option value="' + c.id + '">' + P.escapeHtml(c.title) + '</option>'; }).join('');

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Mark attendance</h2></div>'

      + '<div class="field"><label for="att-date">Date</label><input id="att-date" type="date" value="' + new Date().toISOString().slice(0,10) + '" required></div>'
      + '<div class="field"><label for="att-status">Status</label><select id="att-status" required><option value="present">Present</option><option value="late">Late</option><option value="absent">Absent</option><option value="excused">Excused</option></select></div>'

      +   '<div id="att-students" style="display:grid;gap:8px;max-height:300px;overflow:auto;padding:10px;background:var(--bg-raised);border:1px solid var(--border);border-radius:10px"></div>'

      // with { class_id, default_status, session_date } so the entire

      + '<div class="field" style="grid-column:1/-1;padding:14px 16px;background:rgba(252,198,71,0.06);border:1px dashed var(--border-gold);border-radius:10px">'

      +   '<div style="display:flex;flex-wrap:wrap;gap:8px">'
      +     '<button type="button" class="btn" data-bulk="present" style="background:rgba(52,211,153,0.18);color:#A7F3D0;border:1px solid rgba(52,211,153,0.4)"><i class="fa-solid fa-check"></i> All present</button>'
      +     '<button type="button" class="btn" data-bulk="late" style="background:rgba(252,198,71,0.18);color:#FDE68A;border:1px solid rgba(252,198,71,0.4)"><i class="fa-solid fa-clock"></i> All late</button>'

      +     '<button type="button" class="btn" data-bulk="excused" style="background:rgba(165,180,252,0.14);color:#C7D2FE;border:1px solid rgba(165,180,252,0.4)"><i class="fa-solid fa-circle-info"></i> All excused</button>'
      +   '</div>'
      +   '<p style="margin:8px 4px 0;color:var(--text-muted);font-size:0.78rem;line-height:1.5">Uses the selected class &amp; date. Re-running on the same date safely updates existing rows.</p>'

      + '</form></section>'
      + '<section class="panel"><div class="panel-head"><h2>Recent attendance</h2></div>'
      + (att.length ? attendanceTable(att) : '<div class="panel-body">' + empty('clipboard-list', 'No attendance recorded yet.') + '</div>') + '</section>';

    function paintStudents() {
      var cls = document.getElementById('att-class').value;
      var box = document.getElementById('att-students');
      var list = byClass[cls] || [];
      if (!list.length) { box.innerHTML = '<p style="margin:6px 4px;color:var(--text-muted);font-size:0.88rem">No students enrolled in this class yet.</p>'; return; }
      box.innerHTML = list.map(function (st) {

          + 'style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;text-align:left;cursor:pointer;min-height:48px;color:var(--text);font-size:0.92rem">'
          + '<i class="fa-solid fa-user-graduate" style="color:var(--gold-bright)" aria-hidden="true"></i>'
          + '<span style="flex:1"><strong>' + P.escapeHtml(st.name || '—') + '</strong><br><span style="color:var(--text-muted);font-size:0.78rem">' + P.escapeHtml(st.email || '') + '</span></span>'
          + '<span style="color:var(--text-muted);font-size:0.76rem;font-family:monospace">#' + st.enrollment_id + '</span>'
          + '</button>';
      }).join('');
      box.querySelectorAll('.att-student-row').forEach(function (b) {
        b.addEventListener('click', function () {
          box.querySelectorAll('.att-student-row').forEach(function (x) { x.style.borderColor = 'var(--border)'; x.style.background = 'var(--bg-surface)'; });
          b.style.borderColor = 'var(--gold-bright)';

          document.getElementById('att-selected-label').textContent = 'Selected: ' + b.getAttribute('data-name') + ' (enrolment #' + b.getAttribute('data-eid') + ')';
          document.getElementById('att-submit').disabled = false;

    document.getElementById('att-class').addEventListener('change', paintStudents);
    paintStudents();

    // Bulk-mark whole class. One click → POST { class_id, default_status, date }.
    document.querySelectorAll('[data-bulk]').forEach(function (b) {
      b.addEventListener('click', function () {
        var classId = parseInt(document.getElementById('att-class').value, 10);
        var date = document.getElementById('att-date').value;

      });
    });

    document.getElementById('attForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var eid = parseInt(document.getElementById('att-enrollment').value, 10);
      if (!eid) { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Please pick a student first', 'error') : alert('Please pick a student first')); return; }
      var payload = {
        enrollment_id: eid,
        session_date: document.getElementById('att-date').value,
        status: document.getElementById('att-status').value,
        notes: document.getElementById('att-notes').value,
      };
      var btn = document.getElementById('att-submit'); var orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      API.request('instructor/mark-attendance', { method: 'POST', body: payload })
        .then(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Attendance saved', 'success') : alert('Attendance saved.')); load(); })
        .catch(function (err) { btn.disabled = false; btn.innerHTML = orig; var msg = 'Could not save: ' + (err.body && err.body.error || 'unknown'); (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Could not save', msg, 'error') : alert(msg)); });
    });
  }
  function attendanceTable(att) {
    var rows = att.map(function (a) {
      return '<tr><td data-label="Date">' + P.fmtDate(a.session_date) + '</td>'
        + '<td data-label="Student"><strong>' + P.escapeHtml(a.student_name || '—') + '</strong></td>'
        + '<td data-label="Class">' + P.escapeHtml(a.class_title || '—') + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(a.status) + '">' + P.escapeHtml(a.status) + '</span></td>'
        + '<td data-label="Notes" style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(a.notes || '') + '</td></tr>';
    }).join('');
    return '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function kpi(label, value, sub, cls) {
    return '<div class="kpi"><div class="kpi-label">' + P.escapeHtml(label) + '</div><div class="kpi-value ' + (cls || '') + '">' + value + '</div><div class="kpi-sub">' + P.escapeHtml(sub || '') + '</div></div>';
  }
  function empty(icon, text) { return '<div class="empty-state"><i class="fa-solid fa-' + icon + '"></i>' + text + '</div>'; }

  // Single delegated handler (bound once) for every [data-tab] link, including
  // ones rendered later — replaces the old per-render re-binding that leaked
  // duplicate listeners on each overview paint.
  var _navBound = false;
  function bindTabLinks() {
    if (_navBound) return; _navBound = true;
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-tab]'); if (!a) return;
      var t = a.getAttribute('data-tab'); if (!t) return;
      e.preventDefault(); show(t);
      try { history.replaceState(null, '', '#' + t); } catch (e2) {}
    });
  }

  function load() {
    return API.request('instructor/dashboard').then(function (r) {
      data = r;
      P.mountUserCard({ name: r.user.name, email: r.user.email, role: 'instructor', avatar_url: r.user.avatar_url });
      var tab = (location.hash || '#overview').slice(1);
      if (!tabs[tab]) tab = 'overview';
      // A temporary password must be changed first — land on Account.
      if (r.user && r.user.must_change_password) tab = 'account';
      show(tab);
    });
  }

  P.requireAuth(['instructor', 'admin']).then(function () {
    P.init(); bindTabLinks(); return load();
  }).catch(function (e) {
    if (e.message !== 'unauthenticated') content.innerHTML = empty('triangle-exclamation', 'Could not load your dashboard.');
  });
})();
</script>
</body>
</html>
