<body>
<div class="portal-shell">
  <aside class="portal-side">
    <div class="portal-brand">
      <img src="/mam-academy-logo.svg" alt="" onerror="this.style.display='none'">
      <div>
        <div class="portal-brand-name">MAM ACADEMY</div>
        <div class="portal-brand-sub">Instructor Portal</div>
      </div>
    </div>
    <div class="portal-user" id="userCard"><div class="portal-avatar">?</div><div><div class="portal-user-name">Loading…</div></div></div>
    <nav class="portal-nav">
      <a class="portal-nav-link active" href="#overview" data-tab="overview"><i class="fa-solid fa-gauge"></i>Overview</a>

      <div class="portal-nav-group">Teach</div>
      <a class="portal-nav-link" href="#classes" data-tab="classes"><i class="fa-solid fa-chalkboard-user"></i>My Classes</a>
      <a class="portal-nav-link" href="#sessions" data-tab="sessions"><i class="fa-solid fa-calendar-days"></i>Teaching</a>
      <a class="portal-nav-link" href="#preclass" data-tab="preclass"><i class="fa-solid fa-lightbulb"></i>Pre-class</a>
      <a class="portal-nav-link" href="#students" data-tab="students"><i class="fa-solid fa-users"></i>Students</a>
      <a class="portal-nav-link" href="#assignments" data-tab="assignments"><i class="fa-solid fa-list-check"></i>Assignments</a>

      <div class="portal-nav-group">Assess</div>

      <div class="portal-nav-group">Account</div>
      <a class="portal-nav-link" href="#earnings" data-tab="earnings"><i class="fa-solid fa-wallet"></i>Earnings</a>
      <a class="portal-nav-link" href="#announce" data-tab="announce"><i class="fa-solid fa-bullhorn"></i>Announcements</a>
      <a class="portal-nav-link" href="#account" data-tab="account"><i class="fa-solid fa-user-gear"></i>Account</a>
      <a class="portal-nav-link" href="#handbook" data-tab="handbook"><i class="fa-solid fa-book-bookmark"></i>Handbook</a>
      <a class="portal-nav-link" href="/studio" target="_blank" rel="noopener" style="margin-top:14px;border-top:1px dashed var(--border);padding-top:18px"><i class="fa-solid fa-wand-magic-sparkles"></i>Practice Studio <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.7em;margin-left:auto;opacity:0.7"></i></a>
    </nav>
    <div class="portal-side-foot">
      <button type="button" class="portal-theme-toggle" data-action="theme-toggle" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i><span data-theme-label>Dark mode</span></button>
      <a href="/"><i class="fa-solid fa-house"></i>Back to site</a>
      <button type="button" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
    </div>
  </aside>

  <main class="portal-main">
    <button class="portal-side-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i> Menu</button>
    <header class="portal-top">
      <h1 id="pageTitle">Overview <small id="pageSub">Welcome back</small></h1>
      <div style="margin-left:auto"><span data-notif-bell></span></div>
    </header>
    <div id="content" aria-busy="true" aria-label="Loading your dashboard">
      <section class="kpi-row">
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
        <div class="kpi"><div class="skeleton" style="height:11px;width:55%;margin-bottom:12px"></div><div class="skeleton" style="height:28px;width:45%"></div></div>
      </section>
      <section class="panel"><div class="panel-body" style="display:grid;gap:14px"><div class="skeleton" style="height:14px;width:40%"></div><div class="skeleton" style="height:12px;width:92%"></div><div class="skeleton" style="height:12px;width:78%"></div></div></section>
      <section class="panel"><div class="panel-body" style="display:grid;gap:14px"><div class="skeleton" style="height:14px;width:40%"></div><div class="skeleton" style="height:12px;width:88%"></div><div class="skeleton" style="height:12px;width:70%"></div></div></section>
    </div>

<script src="/assets/js/config.js?v=20260807a"></script>
<script src="/assets/js/portal.js?v=20260706c"></script>
<script src="/assets/js/libs.js?v=20260530a" async></script>
<!-- Self-hosted QR generator (MIT, qrcodejs) for the attendance check-in QR (#9/#10). -->
<script src="/assets/js/vendor/qrcode.min.js?v=20260705a" defer></script>
<script>
(function () {
  var P = window.MAM_PORTAL, API = window.MAM_API;
  var content = document.getElementById('content');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var tabs = { overview: ['Overview', 'Your teaching at a glance'], classes: ['My Classes', 'Active classes you teach'], students: ['Students', 'Everyone in your classes'], assignments: ['Assignments', 'Set practice tasks & track completion'], attendance: ['Attendance', 'Mark and review attendance'], sessions: ['Teaching', 'One cohort at a time — sessions, attendance & standings'], gradebook: ['Gradebook', 'Grade students across the weighted components'], preclass: ['Pre-class', 'Review teach-backs before you teach'], earnings: ['Earnings', 'Your earnings statement from the Academy'], announce: ['Announcements', 'Post updates your students see'], account: ['Account', 'Your profile & password'], handbook: ['Handbook', 'Academy policies & your responsibilities'] };
  var data = null;
  var syncTabs = function () {};   // set by P.enhanceTabs() at boot; keeps ARIA tab state correct

  function show(tab) {
    document.querySelectorAll('[data-tab]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    syncTabs(tab);
    var t = tabs[tab] || tabs.overview;
    pageTitle.firstChild.textContent = t[0] + ' ';
    pageSub.textContent = t[1];
    if (!data) return;
    if (tab === 'overview') return renderOverview();
    if (tab === 'classes') return renderClasses();
    if (tab === 'students') return renderStudents();
    if (tab === 'assignments') return renderAssignments();
    if (tab === 'attendance') return renderAttendance();
    if (tab === 'sessions') return renderSessions();
    if (tab === 'gradebook') return renderGradebook();
    if (tab === 'preclass') return renderPreclass();
    if (tab === 'earnings') return renderEarnings();
    if (tab === 'announce') return renderAnnounce();
    if (tab === 'account') return renderAccount();
    if (tab === 'handbook') return renderHandbook();
  }

  function renderAssignments() {
    var classes = (data.classes || []).filter(function (c) { return c.status === 'active'; });
    var students = data.students || [];
    var asg = data.assignments || [];
    var clsOpts = classes.map(function (c) { return '<option value="class:' + c.id + '">Whole class — ' + P.escapeHtml(c.title) + '</option>'; }).join('');
    var stuOpts = students.map(function (s) { return '<option value="student:' + s.id + '">' + P.escapeHtml(s.name) + (s.class_title ? ' (' + P.escapeHtml(s.class_title) + ')' : '') + '</option>'; }).join('');
    // Dual-read: cohorts (course_enrollments) are added lazily below, so a
    // cohort/course-only instructor can still assign work.
    var targetSel = '<select id="asg-target" required>'
      + (clsOpts ? '<optgroup label="Classes">' + clsOpts + '</optgroup>' : '')
      + (stuOpts ? '<optgroup label="Students">' + stuOpts + '</optgroup>' : '')
      + '</select>';
    var doneCount = asg.filter(function (a) { return a.status === 'done'; }).length;
    var list = asg.length ? asg.map(function (a) {
      var done = a.status === 'done';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);margin-bottom:10px">'
        + '<div style="min-width:200px;flex:1"><strong style="color:var(--text)">' + P.escapeHtml(a.title) + '</strong>'
        + '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:3px">' + P.escapeHtml(a.student_name || '') + (a.class_title ? ' · ' + P.escapeHtml(a.class_title) : '') + (a.due_on ? ' · due ' + P.fmtDate(a.due_on) : '') + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px">'
        +   '<span class="pill ' + (done ? 'present' : 'pending') + '">' + (done ? 'done' : 'open') + '</span>'
        +   '<button type="button" class="btn asg-subs" data-id="' + a.id + '" data-title="' + P.escapeHtml(a.title) + '"><i class="fa-solid fa-inbox"></i> Submissions</button>'
        +   '<button type="button" class="asg-del" data-id="' + a.id + '" title="Delete assignment" aria-label="Delete assignment" style="width:34px;height:34px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);cursor:pointer"><i class="fa-solid fa-trash-can"></i></button>'
        + '</div></div>';
    }).join('') : '<div class="panel-body">' + empty('list-check', 'No assignments set yet. Create one above.') + '</div>';

    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Set an assignment</h2></div>'
      + '<form id="asgForm" class="profile-form" style="padding:18px 22px;display:grid;gap:14px">'
      +   '<div class="field"><label for="asg-target">Assign to</label>' + targetSel + '</div>'
      +   '<div class="field"><label for="asg-title">Title</label><input id="asg-title" maxlength="160" required placeholder="e.g. Prepare C major scale, hands together"></div>'
      +   '<div class="field"><label for="asg-instr">Instructions</label><textarea id="asg-instr" rows="3" placeholder="What should they practise, and how?"></textarea></div>'
      +   '<div class="field"><label for="asg-due">Due date (optional)</label><input id="asg-due" type="date"></div>'
      +   '<div class="actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-list-check"></i> Set assignment</button></div>'
      + '</form></section>'
      + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Assignments set</h2>'
      + (asg.length ? '<span style="font-size:0.8rem;color:var(--text-muted)">' + doneCount + ' of ' + asg.length + ' done · ' + (asg.length - doneCount) + ' open</span>' : '')
      + '</div><div style="padding:14px 18px">' + list + '</div></section>'
      + '<div id="subsArea" style="margin-top:18px"></div>';

    content.querySelectorAll('.asg-subs').forEach(function (b) {
      b.addEventListener('click', function () { openSubmissions(parseInt(b.getAttribute('data-id'), 10), b.getAttribute('data-title') || 'Assignment'); });
    });
    content.querySelectorAll('.asg-del').forEach(function (b) {
      b.addEventListener('click', function () {
        var go = function () {
          b.disabled = true;
          API.request('instructor/assignment-delete', { method: 'POST', body: { id: parseInt(b.getAttribute('data-id'), 10) } })
            .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Assignment deleted.', 'success'); return load(); })
            .catch(function (err) {
              b.disabled = false;
              (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not delete: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not delete.'));
            });
        };
        if (window.MAM_DIALOG && window.MAM_DIALOG.confirm) window.MAM_DIALOG.confirm('Delete this assignment?', 'The student will no longer see it.', 'Delete').then(function (ok) { if (ok) go(); });
        else if (confirm('Delete this assignment?')) go();
      });
    });

    document.getElementById('asgForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('asg-title').value.trim();
      if (!title) return;
      var tgt = (document.getElementById('asg-target').value || '').split(':');
      var body = { title: title, instructions: document.getElementById('asg-instr').value.trim(), due_on: document.getElementById('asg-due').value || null };
      if (tgt[0] === 'class') body.class_id = parseInt(tgt[1], 10);
      else if (tgt[0] === 'cohort') body.cohort_id = parseInt(tgt[1], 10);
      else body.student_id = parseInt(tgt[1], 10);
      var btn = e.target.querySelector('button'); var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
      API.request('instructor/assignment', { method: 'POST', body: body }).then(function (r) {
        var n = r.created || 1;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Assignment set for ' + n + ' student' + (n === 1 ? '' : 's') + '.', 'success') : alert('Set.'));
        return load();
      }).catch(function (err) {
        btn.disabled = false; btn.innerHTML = orig;
        (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Could not set: ' + ((err.body && err.body.error) || 'try again'), 'error') : alert('Could not set.'));
      });
    });

    // Dual-read: lazily add the instructor's cohorts as assignment targets, so
    // a cohort/course-only student can be set work. Best-effort — a failed
    // fetch just leaves the legacy class/student targets in place.
    API.request('instructor/sessions', { method: 'GET' }).then(function (r) {
      var cohorts = (r && r.cohorts) || [];
      var sel = document.getElementById('asg-target');
      if (!sel) return;
      if (cohorts.length) {
        var og = document.createElement('optgroup'); og.label = 'Cohorts';
        cohorts.forEach(function (c) {
          var o = document.createElement('option');
          o.value = 'cohort:' + c.id;
          o.textContent = 'Whole cohort — ' + (c.title || c.course_name || ('Cohort #' + c.id));
          og.appendChild(o);
        });
        sel.insertBefore(og, sel.firstChild);
      }
      if (!sel.options.length) {
        var form = document.getElementById('asgForm');
        if (form) form.innerHTML = empty('list-check', 'Add students to a class or cohort first — then you can set assignments.');
      }
    }).catch(function () { /* leave legacy targets as-is */ });
  }

  // ── Submissions review + feedback (L2) ──
  function openSubmissions(aid, title) {
    var area = document.getElementById('subsArea');
    if (!area) return;
    area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading submissions…') + '</div></section>';
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    API.request('instructor/submissions?assignment_id=' + encodeURIComponent(aid), { method: 'GET' }).then(function (r) {
      var subs = r.submissions || [];
      var aiEnabled = !!r.ai_enabled;
      if (!subs.length) {
        area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Submissions — ' + P.escapeHtml(title) + '</h2></div><div class="panel-body">' + empty('inbox', 'No submissions yet for this assignment.') + '</div></section>';
        return;
      }
      var icon = { audio: 'volume-high', video: 'video', pdf: 'file-pdf', image: 'image', link: 'link' };
      var cards = subs.map(function (s) {
        return '<div class="panel" data-subid="' + s.id + '" style="margin-bottom:14px"><div class="panel-head"><h2 style="font-size:0.98rem">' + P.escapeHtml(s.student_name) + ' <span class="pill ' + P.escapeHtml(s.status) + '" style="margin-left:6px">' + P.escapeHtml(s.status) + '</span></h2>'
          + (s.artifact_url ? '<a href="' + P.escapeHtml(/^https?:\/\//i.test(s.artifact_url) ? s.artifact_url : '#') + '" target="_blank" rel="noopener" style="color:var(--gold-bright);font-size:0.85rem"><i class="fa-solid fa-' + (icon[s.artifact_kind] || 'link') + '" style="margin-right:5px"></i>open ↗</a>' : '') + '</div>'
          + '<form class="fb-form profile-form" style="padding:14px 18px;display:grid;gap:10px">'
          +   '<div class="field"><label>Feedback</label><textarea name="comments" rows="2" placeholder="What worked, what to fix…">' + P.escapeHtml(s.feedback_comments || '') + '</textarea></div>'
          +   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select name="outcome"><option value="accepted"' + (s.feedback_outcome === 'accepted' ? ' selected' : '') + '>Accept</option><option value="revise"' + (s.feedback_outcome === 'revise' ? ' selected' : '') + '>Revise &amp; resubmit</option><option value="remedial"' + (s.feedback_outcome === 'remedial' ? ' selected' : '') + '>Assign remedial</option><option value="rejected"' + (s.feedback_outcome === 'rejected' ? ' selected' : '') + '>Reject</option></select>'
          +   (aiEnabled ? '<button type="button" class="btn fb-ai"><i class="fa-solid fa-wand-magic-sparkles"></i> AI draft</button>' : '')
          +   '<button type="submit" class="btn btn-primary"><i class="fa-solid fa-comment-dots"></i> Save feedback</button></div>'
          + '</form></div>';
      }).join('');
      area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Submissions — ' + P.escapeHtml(title) + '</h2></div></section>' + cards;
      area.querySelectorAll('.fb-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var subId = parseInt(form.closest('[data-subid]').getAttribute('data-subid'), 10);
          var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Saving…';
          API.request('instructor/feedback', { method: 'POST', body: { submission_id: subId, outcome: form.elements.outcome.value, comments: form.elements.comments.value } })
            .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Feedback saved.', 'success'); openSubmissions(aid, title); })
            .catch(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not save feedback.', 'error'); });
        });
      });
      area.querySelectorAll('.fb-ai').forEach(function (b) {
        b.addEventListener('click', function () {
          var form = b.closest('.fb-form'), subId = parseInt(form.closest('[data-subid]').getAttribute('data-subid'), 10);
          var orig = b.innerHTML; b.disabled = true; b.innerHTML = 'Drafting…';
          API.request('instructor/feedback-draft', { method: 'POST', body: { submission_id: subId } }).then(function (rr) {
            b.disabled = false; b.innerHTML = orig;
            if (rr && rr.draft) { form.elements.comments.value = rr.draft; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Draft inserted — edit, then Save.', 'success'); }
            else if (window.MAM_DIALOG) window.MAM_DIALOG.toast('AI could not draft right now.', 'info');
          }).catch(function () { b.disabled = false; b.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('AI draft failed.', 'error'); });
        });
      });
    }).catch(function () { area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load submissions.') + '</div></section>'; });
  }

  // ── Gradebook (v16 LMS): weighted assessment entry → auto results ──────
  var gbCache = null;
  function gradePill(row) {
    if (row.total_score == null) return '<span class="pill pending">ungraded</span>';
    var cls = row.outcome === 'pass' ? 'present' : 'withdrawn';
    return '<span class="pill ' + cls + '">' + P.escapeHtml(String(row.grade || '')) + ' · ' + Math.round(row.total_score) + '% · ' + P.escapeHtml(String(row.outcome || '')) + '</span>';
  }
  function loadGradebook(force) {
    if (gbCache && !force) return Promise.resolve(gbCache);
    return API.request('instructor/gradebook', { method: 'GET' }).then(function (r) { gbCache = r || {}; return gbCache; });
  }
  // ── Sessions: cohort scheduling + attendance (LMS L2) ──
  var sessState = { cohortId: 0 };
  var ATT = ['present', 'late', 'absent', 'excused'];

  function renderSessions() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('calendar-days', 'Loading your cohorts…') + '</div></section>';
    API.request('instructor/sessions', { method: 'GET' }).then(function (r) {
      var cohorts = r.cohorts || [];
      if (!cohorts.length) {
        content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('calendar-days', 'No cohorts yet. They appear here once students you teach are enrolled (or an admin assigns you one).') + '</div></section>';
        return;
      }
      var opts = cohorts.map(function (c) {
        var label = (c.title || c.course_name || ('Cohort #' + c.id)) + (c.level_name ? ' · ' + c.level_name : '') + ' (' + (c.enrollment_count || 0) + ' students)';
        return '<option value="' + c.id + '"' + (c.id == sessState.cohortId ? ' selected' : '') + '>' + P.escapeHtml(label) + '</option>';
      }).join('');
      content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Cohort</h2></div>'
        + '<div style="padding:14px 18px"><select id="sessCohort" style="min-width:280px;padding:9px 11px;border-radius:8px">' + opts + '</select></div></section>'
        + '<div id="sessArea"></div>';
      var sel = document.getElementById('sessCohort');
      sel.addEventListener('change', function () { sessState.cohortId = parseInt(sel.value, 10); loadCohortSessions(sessState.cohortId); });
      sessState.cohortId = parseInt(sel.value, 10);
      loadCohortSessions(sessState.cohortId);
    }).catch(function () {
      content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load your cohorts.') + '</div></section>';
    });
  }

  function loadCohortSessions(cid) {
    var area = document.getElementById('sessArea');
    if (!area) return;
    area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading sessions…') + '</div></section>';
    API.request('instructor/sessions?cohort_id=' + encodeURIComponent(cid), { method: 'GET' }).then(function (r) {
      var sessions = r.sessions || [];
      var rows = sessions.length ? sessions.map(function (s) {
        var gcalUrl = s.scheduled_at ? (function(){
          var st = new Date(s.scheduled_at.replace(' ','T')+'Z');
          if(isNaN(st.getTime())) return null;
          var en = new Date(st.getTime()+(parseInt(s.duration_min,10)||60)*60000);
          function f(d){return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}
          return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(s.title||'Session')+'&dates='+f(st)+'/'+f(en)+'&location='+encodeURIComponent('MAM Academy');
        })() : null;
        var calIcon = gcalUrl ? ' <a href="'+gcalUrl+'" target="_blank" rel="noopener" title="Add to Google Calendar" style="color:var(--gold-bright);font-size:.78rem;margin-left:4px"><i class="fa-solid fa-calendar-plus"></i></a>' : '';
        var when = s.scheduled_at ? P.escapeHtml(P.fmtDateTime(s.scheduled_at))+calIcon : '<span style="color:var(--text-muted)">unscheduled</span>';
        var hasNotes = !!(s.lesson_notes || s.topics || s.learning_outcomes);
        var notesBtnLabel = hasNotes ? '📝 Notes' : '📝 Notes';
        var actions = '<button class="btn" data-mark="' + s.id + '"><i class="fa-solid fa-clipboard-check"></i> Attendance</button>';
        if (s.status !== 'cancelled') actions += ' <button class="btn" data-sess-qr="' + s.id + '"><i class="fa-solid fa-qrcode"></i> QR</button>';
        if (s.status !== 'scheduled' || s.scheduled_at) actions += ' <button class="btn btn-ghost" data-lesson-notes="' + s.id + '" style="' + (hasNotes ? 'border-color:var(--gold-bright);color:var(--gold-bright)' : '') + '">' + notesBtnLabel + '</button>';
        if (s.status === 'scheduled') {
          actions += ' <button class="btn btn-ghost" data-reschedule="' + s.id + '" title="Reschedule"><i class="fa-solid fa-calendar-pen"></i></button>';
          actions += ' <button class="btn btn-ghost" data-send-reminder="' + s.id + '" title="Send reminder to enrolled students"><i class="fa-solid fa-bell"></i></button>';
          actions += ' <button class="btn" data-sess-status="' + s.id + '|held">Held</button>';
          actions += ' <button class="btn btn-ghost" data-sess-status="' + s.id + '|cancelled" style="color:var(--red,#ef4444)">Cancel</button>';
          actions += ' <button class="btn btn-ghost" data-clockin="' + s.id + '" title="Clock in for this class"><i class="fa-solid fa-business-time"></i> Clock in</button>';
          actions += ' <button class="btn btn-ghost" data-clockout="' + s.id + '" title="Clock out of this class"><i class="fa-solid fa-right-from-bracket"></i> Clock out</button>';
          actions += ' <button class="btn btn-ghost" data-join="' + s.id + '" title="Join online (Jitsi)"><i class="fa-solid fa-video"></i> Join</button>';
        }
        if (s.status === 'held') {
          actions += ' <button class="btn btn-ghost" data-clockout="' + s.id + '" title="Clock out of this class"><i class="fa-solid fa-right-from-bracket"></i> Clock out</button>';
          actions += ' <button class="btn btn-ghost" data-progress-report="' + s.id + '" style="color:var(--gold-bright);border-color:var(--gold-bright)"><i class="fa-solid fa-clipboard-list"></i> Reports</button>';
        }
        var linkLabel = s.meeting_link ? '<i class="fa-solid fa-link" style="color:#34D399"></i>' : '<i class="fa-solid fa-link"></i>';
        actions += ' <button class="btn btn-ghost" data-set-meeting-link="' + s.id + '" data-current-link="' + P.escapeHtml(s.meeting_link || '') + '" title="' + (s.meeting_link ? 'Change meeting link' : 'Set meeting link') + '">' + linkLabel + '</button>';
        var subName = s.substitute_name ? (' <span style="font-size:.72rem;color:var(--gold-bright)">sub: ' + P.escapeHtml(s.substitute_name) + '</span>') : '';
        var roomStr = s.room ? (' <span style="font-size:.7rem;color:var(--text-muted)"><i class="fa-solid fa-location-dot"></i> ' + P.escapeHtml(s.room) + '</span>') : '';
        return '<tr data-sess-id="' + s.id + '"><td>' + P.escapeHtml(s.title || ('Session #' + s.id)) + subName + '</td><td>' + when + roomStr + '</td><td>' + P.escapeHtml(s.kind) + '</td><td><span class="pill ' + P.escapeHtml(s.status) + '">' + P.escapeHtml(s.status) + '</span></td><td style="white-space:nowrap">' + actions + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="empty">No sessions yet — schedule one below.</td></tr>';
      var fc = r.fill_count || {};
      var capBar = (fc.capacity && fc.capacity < 999) ? ('<div style="display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface-secondary);border-bottom:1px solid var(--border)">'
        + '<div style="flex:1;background:var(--border);border-radius:6px;height:8px"><div style="width:' + Math.min(100, Math.round((fc.enrolled||0)/(fc.capacity)*100)) + '%;height:100%;background:' + (fc.is_full ? '#F87171' : fc.enrolled/(fc.capacity)>=0.8?'#FBBF24':'#34D399') + ';border-radius:6px"></div></div>'
        + '<span style="font-size:.8rem;color:var(--text-muted);white-space:nowrap">' + (fc.enrolled||0) + ' / ' + fc.capacity + ' enrolled'
        + (fc.waitlist_count ? ' · <span style="color:var(--gold)">' + fc.waitlist_count + ' waiting</span>' : '') + '</span></div>') : '';
      area.innerHTML = '<section class="panel"><div class="panel-head"><h2>Sessions</h2>'
        + '<div style="display:flex;gap:6px"><button class="panel-action" onclick="document.getElementById(\'bulkPanel\').style.display = document.getElementById(\'bulkPanel\').style.display===\'none\'?\'block\':\'none\'"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate term</button></div></div>'
        + capBar
        + '<table><thead><tr><th>Session</th><th>When</th><th>Kind</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></section>'
        + '<div id="bulkPanel" style="display:none">'
        + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--gold-bright)"></i> Generate Term Sessions</h2></div>'
        + '<div class="profile-form" style="padding:14px 18px">'
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
        + '<div class="field"><label>From</label><input id="bsFrom" type="date"></div>'
        + '<div class="field"><label>To</label><input id="bsTo" type="date"></div>'
        + '<div class="field"><label>Time</label><input id="bsT" type="time" value="09:00"></div>'
        + '<div class="field"><label>Duration (min)</label><input id="bsD" type="number" value="60" min="15" max="480"></div>'
        + '</div>'
        + '<div class="field" style="margin-top:10px"><label>Days</label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">'
        + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d,i){ return '<label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" class="bsDay" value="' + i + '"' + (i===1||i===3?' checked':'') + '>' + d + '</label>'; }).join('')
        + '</div></div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">'
        + '<div class="field"><label>Title prefix</label><input id="bsPfx" placeholder="Week, Session…" value="Week"></div>'
        + '<div class="field"><label>Room / location</label><input id="bsRoom" placeholder="Studio A…"></div>'
        + '<div class="field"><label>Kind</label><select id="bsKnd"><option value="class">Class</option><option value="revision">Revision</option><option value="exam">Exam</option><option value="makeup">Make-up</option></select></div>'
        + '<div class="field"><label>Skip dates <span style="font-weight:400;color:var(--text-muted)">(Y-m-d, comma-sep)</span></label><input id="bsSkip" placeholder="2026-12-25"></div>'
        + '</div>'
        + '<div id="bsPreviewLine" style="font-size:.82rem;color:var(--text-muted);margin:10px 0"></div>'
        + '<div style="display:flex;gap:8px;margin-top:4px">'
        + '<button class="btn" onclick="bulkPreview(' + cid + ')"><i class="fa-solid fa-eye"></i> Preview</button>'
        + '<button class="btn btn-primary" id="bsGenBtn" onclick="bulkGenerate(' + cid + ')"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>'
        + '<button class="btn btn-ghost" onclick="document.getElementById(\'bulkPanel\').style.display=\'none\'">Cancel</button>'
        + '</div></div></section></div>'
        + '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Schedule a single session</h2></div>'
        + '<form id="sessForm" class="profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
        +   '<div class="field" style="flex:1;min-width:160px"><label>Title</label><input name="title" placeholder="e.g. Week 1 — Scales"></div>'
        +   '<div class="field"><label>Date &amp; time</label><input name="scheduled_at" type="datetime-local"></div>'
        +   '<div class="field" style="width:90px"><label>Minutes</label><input name="duration_min" type="number" min="1" value="60"></div>'
        +   '<div class="field" style="width:80px"><label>Room</label><input name="room" placeholder="Studio A"></div>'
        +   '<div class="field" style="width:120px"><label>Kind</label><select name="kind"><option value="class">Class</option><option value="revision">Revision</option><option value="exam">Exam</option><option value="makeup">Make-up</option></select></div>'
        +   '<button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Schedule</button>'
        + '</form></section>'
        + '<div id="markArea"></div>'
        + '<div id="cohortStandings"></div>'
        + '<div id="cohortCurriculum"></div>';
      bindSessionList(cid, sessions);
      loadCohortStandings(cid);
      loadCohortCurriculum(cid);
    }).catch(function () { area.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load sessions.') + '</div></section>'; });
  }

  // P2: within a cohort, show that cohort's students and their current standing
  // (from the gradebook, matched by cohort_id) so Teaching unifies scheduling,
  // attendance AND results per cohort. Grading itself stays in the Gradebook tab
  // (one place for the interactive forms) — each row links straight there.
  function loadCohortStandings(cid) {
    var host = document.getElementById('cohortStandings');
    if (!host) return;
    loadGradebook().then(function (gb) {
      if (!document.getElementById('cohortStandings')) return; // cohort switched
      var ens = (gb.enrollments || []).filter(function (e) { return String(e.cohort_id) === String(cid); });
      if (!ens.length) {
        host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Students &amp; standings</h2></div>'
          + '<div class="panel-body">' + empty('graduation-cap', 'No course students linked to this cohort yet. Course grading appears here once an admin assigns their course to you.') + '</div></section>';
        return;
      }
      var rows = ens.map(function (e) {
        return '<tr><td data-label="Student"><strong>' + P.escapeHtml(e.student_name || e.student_email) + '</strong></td>'
          + '<td data-label="Course">' + P.escapeHtml(e.course_name || '—') + (e.level_name ? ' · ' + P.escapeHtml(e.level_name) : '') + '</td>'
          + '<td data-label="Standing">' + gradePill(e) + '</td>'
          + '<td data-label=""><a class="btn btn-ghost" href="#gradebook" data-tab="gradebook" style="padding:4px 11px;font-size:0.76rem"><i class="fa-solid fa-clipboard-list"></i> Grade</a></td></tr>';
      }).join('');
      host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Students &amp; standings</h2>'
        + '<a class="panel-action" href="#gradebook" data-tab="gradebook">Gradebook →</a></div>'
        + '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Student</th><th>Course</th><th>Standing</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      bindTabLinks();
    }).catch(function () { /* standings are additive — never block the sessions view */ });
  }

  // P2 curriculum authoring: for the selected cohort, show the week-by-week
  // curriculum (context while teaching) plus a "propose a change" form. Proposals
  // go to the admin for approval — nothing here writes the live syllabus.
  var CUR_KIND = { module: 'Module', revision: 'Revision', exam: 'Examination' };
  function loadCohortCurriculum(cid) {
    var host = document.getElementById('cohortCurriculum');
    if (!host) return;
    API.request('instructor/curriculum?cohort_id=' + encodeURIComponent(cid), { method: 'GET' }).then(function (r) {
      if (!document.getElementById('cohortCurriculum')) return; // cohort switched
      var weeks = (r.outline && r.outline.weeks) || [];
      var props = r.proposals || [];
      var weekRows = weeks.length ? weeks.map(function (w) {
        return '<tr><td data-label="Week">Wk ' + w.week + '</td>'
          + '<td data-label="Kind"><span class="pill">' + P.escapeHtml(CUR_KIND[w.kind] || w.kind) + '</span></td>'
          + '<td data-label="Title"><strong>' + P.escapeHtml(w.title || ('Week ' + w.week)) + '</strong>'
          + (w.content ? '<br><span style="color:var(--text-muted);font-size:0.82rem">' + P.escapeHtml(w.content) + '</span>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="3" class="empty">No curriculum authored for this course yet.</td></tr>';

      var propRows = props.length ? props.map(function (p) {
        var tone = { pending: 'pending', approved: 'present', rejected: 'withdrawn' }[p.status] || 'pending';
        return '<tr><td data-label="Week">Wk ' + p.week + '</td>'
          + '<td data-label="Title">' + P.escapeHtml(p.title) + '</td>'
          + '<td data-label="Status"><span class="pill ' + tone + '">' + P.escapeHtml(p.status) + '</span>'
          + (p.review_note ? '<br><span style="color:var(--text-muted);font-size:0.8rem">' + P.escapeHtml(p.review_note) + '</span>' : '') + '</td></tr>';
      }).join('') : '';

      host.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Curriculum</h2>'
        + '<span style="font-size:0.8rem;color:var(--text-muted)">' + P.escapeHtml((r.cohort && r.cohort.course_name) || '') + (r.cohort && r.cohort.level_name ? ' · ' + P.escapeHtml(r.cohort.level_name) : '') + '</span></div>'
        + '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Week</th><th>Kind</th><th>Focus</th></tr></thead><tbody>' + weekRows + '</tbody></table></div>'
        + '<form id="curPropose" class="profile-form" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--border)">'
        +   '<div class="field" style="width:74px"><label>Week</label><input name="week" type="number" min="1" max="20" required></div>'
        +   '<div class="field" style="width:120px"><label>Kind</label><select name="kind"><option value="module">Module</option><option value="revision">Revision</option><option value="exam">Exam</option></select></div>'
        +   '<div class="field" style="flex:1;min-width:150px"><label>Title</label><input name="title" placeholder="e.g. Week 3 — Sight-reading" required></div>'
        +   '<div class="field" style="flex:2;min-width:200px"><label>Focus / content</label><input name="content" placeholder="What this week covers" maxlength="4000"></div>'
        +   '<button type="submit" class="btn btn-primary" style="padding:9px 14px"><i class="fa-solid fa-paper-plane"></i> Propose</button>'
        + '</form>'
        + (props.length ? '<div class="ptable-wrap" style="padding:0 12px 14px"><h3 style="margin:6px 8px;font-size:0.9rem">Your proposals</h3><table class="ptable"><thead><tr><th>Week</th><th>Title</th><th>Status</th></tr></thead><tbody>' + propRows + '</tbody></table></div>' : '')
        + '<p style="margin:2px 18px 14px;font-size:0.78rem;color:var(--text-muted)">Proposals are reviewed by the Academy before they change the live curriculum.</p></section>';

      var form = document.getElementById('curPropose');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var wk = parseInt(form.elements.week.value, 10);
        if (isNaN(wk) || !form.elements.title.value.trim()) return;
        var btn = form.querySelector('button'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Sending…';
        API.request('instructor/curriculum', { method: 'POST', body: { cohort_id: cid, week: wk, kind: form.elements.kind.value, title: form.elements.title.value.trim(), content: form.elements.content.value.trim() || undefined } })
          .then(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Proposal sent for review.', 'success'); loadCohortCurriculum(cid); })
          .catch(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not send the proposal.', 'error'); });
      });
    }).catch(function () { /* curriculum is additive — never block the sessions view */ });
  }

  function bindSessionList(cid, sessions) {
    var sessMap = {};
    (sessions || []).forEach(function (s) { sessMap[s.id] = s; });

    // Lesson notes editor
    document.querySelectorAll('[data-lesson-notes]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-lesson-notes'), 10);
        var s = sessMap[sid] || {};
        var area = document.getElementById('markArea');
        if (!area) return;
        var formId = 'lnForm_' + sid;
        area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>📝 Lesson Record — ' + P.escapeHtml(s.title || 'Session #' + sid) + '</h2></div>'
          + '<form id="' + formId + '" class="profile-form" style="padding:16px 20px;display:flex;flex-direction:column;gap:14px">'
          + '<div class="field"><label style="font-size:0.82rem;color:var(--text-muted);margin-bottom:4px;display:block">Topics covered <span style="color:var(--text-muted);font-size:0.75rem">(brief list)</span></label>'
          + '<input name="topics" placeholder="e.g. C major scale, chord inversions, sight-reading" style="width:100%" value="' + P.escapeHtml(s.topics || '') + '"></div>'
          + '<div class="field"><label style="font-size:0.82rem;color:var(--text-muted);margin-bottom:4px;display:block">Lesson notes <span style="color:var(--text-muted);font-size:0.75rem">(what was taught, how the student responded)</span></label>'
          + '<textarea name="lesson_notes" rows="4" placeholder="Describe what was covered this session, student performance, any challenges…" style="width:100%;resize:vertical">' + P.escapeHtml(s.lesson_notes || '') + '</textarea></div>'
          + '<div class="field"><label style="font-size:0.82rem;color:var(--text-muted);margin-bottom:4px;display:block">Learning outcomes <span style="color:var(--text-muted);font-size:0.75rem">(what the student achieved)</span></label>'
          + '<textarea name="learning_outcomes" rows="3" placeholder="e.g. Student can now play the C major scale with correct fingering at 80bpm" style="width:100%;resize:vertical">' + P.escapeHtml(s.learning_outcomes || '') + '</textarea></div>'
          + '<div style="display:flex;gap:10px;align-items:center"><button type="submit" class="btn btn-primary">Save Lesson Record</button><button type="button" id="lnCancel" class="btn btn-ghost">Cancel</button><span id="lnMsg" style="font-size:0.85rem;color:var(--text-muted)"></span></div>'
          + '</form></section>';
        document.getElementById('lnCancel').addEventListener('click', function () { area.innerHTML = ''; });
        document.getElementById(formId).addEventListener('submit', function (e) {
          e.preventDefault();
          var btn2 = e.target.querySelector('button[type=submit]'), msg = document.getElementById('lnMsg');
          btn2.disabled = true; btn2.textContent = 'Saving…';
          API.request('instructor/lesson-record', { method: 'POST', body: {
            session_id: sid,
            topics: e.target.elements.topics.value,
            lesson_notes: e.target.elements.lesson_notes.value,
            learning_outcomes: e.target.elements.learning_outcomes.value,
          }}).then(function () {
            btn2.disabled = false; btn2.textContent = 'Save Lesson Record';
            msg.textContent = 'Saved.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Lesson record saved.', 'success');
            // Refresh session list so the Notes button reflects the saved state
            setTimeout(function () { loadCohortSessions(cid); }, 800);
          }).catch(function () {
            btn2.disabled = false; btn2.textContent = 'Save Lesson Record';
            msg.textContent = 'Could not save. Try again.';
          });
        });
      });
    });

    var form = document.getElementById('sessForm');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Scheduling…';
      var body = { action: 'create', cohort_id: cid, title: form.elements.title.value, scheduled_at: form.elements.scheduled_at.value, duration_min: parseInt(form.elements.duration_min.value, 10) || 60, kind: form.elements.kind.value, room: form.elements.room.value };
      API.request('instructor/sessions', { method: 'POST', body: body })
        .then(function (r) {
          btn.disabled = false; btn.textContent = 'Schedule';
          if (r.conflicts && r.conflicts.length) {
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('⚠ Scheduled, but conflicts with ' + r.conflicts.length + ' other session(s).', 'warn');
          } else if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Session scheduled.', 'success');
          loadCohortSessions(cid);
        })
        .catch(function () { btn.disabled = false; btn.textContent = 'Schedule'; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not schedule.', 'error'); });
    });

    // Reschedule buttons
    document.querySelectorAll('[data-reschedule]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-reschedule'), 10);
        var s = sessMap[sid] || {};
        var defAt = (s.scheduled_at || '').slice(0, 16);
        var newAt = prompt('New date/time for "' + (s.title || 'Session #' + sid) + '":\n(YYYY-MM-DDTHH:MM)', defAt);
        if (!newAt || newAt === defAt) return;
        var reason = prompt('Reason for rescheduling (optional):') || null;
        b.disabled = true;
        API.request('instructor/sessions', { method: 'POST', body: { action: 'reschedule', session_id: sid, scheduled_at: newAt.replace('T', ' ') + ':00', reason: reason } })
          .then(function (r) {
            if (r.conflicts && r.conflicts.length) {
              if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Rescheduled — but conflicts with ' + r.conflicts.length + ' other session(s).', 'warn');
            } else if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Session rescheduled.', 'success');
            loadCohortSessions(cid);
          })
          .catch(function () { b.disabled = false; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not reschedule.', 'error'); });
      });
    });
    document.querySelectorAll('[data-sess-status]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-sess-status').split('|');
        API.request('instructor/sessions', { method: 'POST', body: { action: 'status', session_id: parseInt(p[0], 10), status: p[1] } })
          .then(function () { loadCohortSessions(cid); })
          .catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not update.', 'error'); });
      });
    });
    document.querySelectorAll('[data-mark]').forEach(function (b) {
      b.addEventListener('click', function () { openMarkSheet(parseInt(b.getAttribute('data-mark'), 10)); });
    });
    document.querySelectorAll('[data-sess-qr]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-sess-qr'), 10);
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/session-attendance-qr?session_id=' + sid, { method: 'GET' })
          .then(function (r) { b.disabled = false; b.innerHTML = orig; sessionQrModal(r); })
          .catch(function () { b.disabled = false; b.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not load the QR', 'error'); });
      });
    });

    document.querySelectorAll('[data-progress-report]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-progress-report'), 10);
        var area = document.getElementById('markArea');
        if (!area) return;
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/progress-report?session_id=' + sid, { method: 'GET' })
          .then(function (d) {
            b.disabled = false; b.innerHTML = orig;
            openProgressReportPanel(area, sid, d, cid);
          })
          .catch(function () {
            b.disabled = false; b.innerHTML = orig;
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not load progress reports.', 'error');
          });
      });
    });

    // Send reminder to enrolled students for this session
    document.querySelectorAll('[data-send-reminder]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-send-reminder'), 10);
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/sessions', { method: 'POST', body: { action: 'send_reminder', session_id: sid } })
          .then(function (r) {
            b.disabled = false; b.innerHTML = orig;
            var n = r.sent || 0;
            var msg = 'Reminder sent to ' + n + ' student' + (n !== 1 ? 's' : '') + '.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'success'); else alert(msg);
          })
          .catch(function (err) {
            b.disabled = false; b.innerHTML = orig;
            var msg = (err && err.body && err.body.error) ? err.body.error : 'Could not send reminder.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'error'); else alert(msg);
          });
      });
    });

    // Clock in for a session (instructor punctuality; late feeds accountability).
    document.querySelectorAll('[data-clockin]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-clockin'), 10);
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/clock', { method: 'POST', body: { action: 'in', session_id: sid } })
          .then(function (r) {
            b.disabled = false; b.innerHTML = orig;
            var st = (r.clock && r.clock.status) || 'present';
            var msg = 'Clocked in — ' + st + (r.clock && r.clock.minutes_late ? ' (' + r.clock.minutes_late + ' min late)' : '') + '.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, st === 'late' ? 'error' : 'success'); else alert(msg);
          })
          .catch(function (err) {
            b.disabled = false; b.innerHTML = orig;
            var msg = (err && err.body && err.body.error) ? err.body.error : 'Could not clock in.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'error'); else alert(msg);
          });
      });
    });

    // Clock out of a session (records actual session end + duration).
    document.querySelectorAll('[data-clockout]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-clockout'), 10);
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/clock', { method: 'POST', body: { action: 'out', session_id: sid } })
          .then(function () {
            b.disabled = false; b.innerHTML = orig;
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Clocked out.', 'success'); else alert('Clocked out.');
          })
          .catch(function (err) {
            b.disabled = false; b.innerHTML = orig;
            var m = (err && err.body && err.body.error) ? err.body.error : 'Could not clock out.';
            var msg = m === 'not_clocked_in' ? 'Clock in first before clocking out.' : m;
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'error'); else alert(msg);
          });
      });
    });

    // Join online — fetch the session's Jitsi room and open it.
    document.querySelectorAll('[data-join]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = parseInt(b.getAttribute('data-join'), 10);
        b.disabled = true;
        API.request('instructor/clock?session_id=' + sid, { method: 'GET' })
          .then(function (r) {
            b.disabled = false;
            var url = (r.session && r.session.meeting_link) || r.jitsi_url;
            if (url) window.open(url, '_blank', 'noopener');
          })
          .catch(function () { b.disabled = false; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not open the meeting.', 'error'); });
      });
    });

    // Set / clear meeting link for a session
    document.querySelectorAll('[data-set-meeting-link]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid     = parseInt(b.getAttribute('data-set-meeting-link'), 10);
        var current = b.getAttribute('data-current-link') || '';
        var url = window.prompt('Meeting link for this session (Zoom, Meet, etc.).\nLeave blank to remove.', current);
        if (url === null) return; // cancelled
        url = url.trim();
        if (url !== '' && !/^https?:\/\//i.test(url)) {
          if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Link must start with https://', 'error');
          else alert('Link must start with https://');
          return;
        }
        var orig = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        API.request('instructor/sessions', { method: 'POST', body: { action: 'set_meeting_link', session_id: sid, meeting_link: url } })
          .then(function () {
            b.disabled = false; b.innerHTML = orig;
            var msg = url ? 'Meeting link saved.' : 'Meeting link removed.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'success'); else alert(msg);
            loadCohortSessions(cid);
          })
          .catch(function (err) {
            b.disabled = false; b.innerHTML = orig;
            var msg = (err && err.body && err.body.error) ? err.body.error : 'Could not save link.';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast(msg, 'error'); else alert(msg);
          });
      });
    });
  }

  function openProgressReportPanel(area, sid, d, cid) {
    var students = d.students || [];
    var reports  = d.reports || {};
    var template = d.template;
    var session  = d.session || {};
    var sessionTitle = P.escapeHtml(session.title || ('Session #' + sid));

    if (!students.length) {
      area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>📋 Progress Reports — ' + sessionTitle + '</h2></div>'
        + '<div class="panel-body">' + empty('users', 'No students enrolled in this cohort.') + '</div></section>';
      return;
    }

    function buildQuestionField(q, i, existing) {
      var val = existing ? (existing[q.label] || '') : '';
      var lbl = '<label style="font-size:.78rem;color:var(--text-muted);display:block;margin-bottom:4px">' + P.escapeHtml(q.label) + (q.required ? ' <span style="color:var(--red,#ef4444)">*</span>' : '') + '</label>';
      if (q.type === 'textarea') return lbl + '<textarea name="q_' + i + '" rows="2" style="width:100%;resize:vertical" data-label="' + P.escapeHtml(q.label) + '"' + (q.required?' required':'') + '>' + P.escapeHtml(String(val)) + '</textarea>';
      if (q.type === 'rating')   return lbl + '<select name="q_' + i + '" data-label="' + P.escapeHtml(q.label) + '"' + (q.required?' required':'') + '><option value="">—</option>' + [1,2,3,4,5].map(function(n){ return '<option value="' + n + '"' + (val==n?' selected':'') + '>' + n + ' ★</option>'; }).join('') + '</select>';
      if (q.type === 'select')   return lbl + '<select name="q_' + i + '" data-label="' + P.escapeHtml(q.label) + '"' + (q.required?' required':'') + '><option value="">—</option>' + (q.options||[]).map(function(o){ return '<option value="' + P.escapeHtml(o) + '"' + (val===o?' selected':'') + '>' + P.escapeHtml(o) + '</option>'; }).join('') + '</select>';
      return lbl + '<input type="text" name="q_' + i + '" data-label="' + P.escapeHtml(q.label) + '" value="' + P.escapeHtml(String(val)) + '"' + (q.required?' required':'') + ' style="width:100%">';
    }

    var qs = template ? (template.questions || []) : [];
    var noTemplate = !template ? '<div style="background:rgba(232,150,31,.08);border-left:3px solid var(--gold-bright);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:.84rem;color:var(--gold-bright)"><i class="fa-solid fa-triangle-exclamation"></i> No active progress report template. Only the narrative will be available. Set one up in Admin → Form Builder.</div>' : '';

    var cards = students.map(function (st) {
      var existing = reports[st.id] || null;
      var isDone   = !!(existing && existing.email_sent);
      var doneTag  = isDone ? '<span class="pill" style="background:rgba(52,211,153,.12);color:#34D399;font-size:.68rem"><i class="fa-solid fa-check"></i> Sent</span>' : '';
      var formId   = 'pr_form_' + sid + '_' + st.id;
      var qFields  = qs.length ? qs.map(function(q,i){ return '<div style="margin-bottom:10px">' + buildQuestionField(q, i, existing ? existing.answers : null) + '</div>'; }).join('') : '';
      var narr     = existing ? (existing.narrative || '') : '';
      return '<div class="card" style="margin-bottom:12px;padding:16px 18px">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
        + '<div><strong>' + P.escapeHtml(st.name) + '</strong><span style="font-size:.75rem;color:var(--text-muted);margin-left:8px">' + P.escapeHtml(st.enrollment_ref || '') + '</span></div>'
        + doneTag + '</div>'
        + (isDone && !existing ? '' :
           '<form id="' + formId + '" data-sid="' + sid + '" data-stuid="' + st.id + '">'
           + noTemplate + qFields
           + '<div style="margin-top:10px"><label style="font-size:.78rem;color:var(--text-muted);display:block;margin-bottom:4px">Instructor note (optional narrative)</label>'
           + '<textarea name="narrative" rows="2" style="width:100%;resize:vertical">' + P.escapeHtml(narr) + '</textarea></div>'
           + '<div style="margin-top:10px;display:flex;gap:8px;align-items:center">'
           + '<button type="submit" class="btn btn-primary" style="font-size:.82rem"><i class="fa-solid fa-paper-plane"></i> ' + (existing ? 'Update & Resend' : 'Submit & Send Email') + '</button>'
           + '<span class="pr-msg" style="font-size:.8rem;color:var(--text-muted)"></span>'
           + '</div></form>')
        + '</div>';
    }).join('');

    area.innerHTML = '<section class="panel" style="margin-top:18px">'
      + '<div class="panel-head"><h2>📋 Progress Reports — ' + sessionTitle + '</h2>'
      + '<button class="panel-action" onclick="document.getElementById(\'markArea\').innerHTML=\'\'">Close</button></div>'
      + '<div style="padding:16px 18px">' + cards + '</div></section>';

    area.querySelectorAll('[id^="pr_form_"]').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var sessId  = parseInt(form.dataset.sid, 10);
        var stuId   = parseInt(form.dataset.stuid, 10);
        var answers = {};
        form.querySelectorAll('[data-label]').forEach(function (el) { answers[el.dataset.label] = el.value; });
        var narrative = form.elements.narrative ? form.elements.narrative.value.trim() : '';
        var btn = form.querySelector('button[type=submit]'), msg = form.querySelector('.pr-msg');
        btn.disabled = true; btn.textContent = 'Sending…';
        API.request('instructor/progress-report', { method: 'POST', body: { session_id: sessId, student_id: stuId, answers: answers, narrative: narrative || null } })
          .then(function (r) {
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent';
            if (msg) msg.textContent = r.email_sent ? 'Email sent.' : 'Saved (email could not be sent).';
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Progress report sent.', 'success');
          })
          .catch(function () {
            btn.disabled = false; btn.textContent = 'Submit & Send Email';
            if (msg) msg.textContent = 'Could not submit. Try again.';
          });
      });
    });
  }

  // Bulk session generation helpers (for the Generate Term panel in the sessions view).
  function _getBulkPayload(cid) {
    var days = [];
    document.querySelectorAll('.bsDay:checked').forEach(function (cb) { days.push(parseInt(cb.value, 10)); });
    var skip = (document.getElementById('bsSkip') && document.getElementById('bsSkip').value || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    return {
      cohort_id: cid,
      start_date: document.getElementById('bsFrom') ? document.getElementById('bsFrom').value : '',
      end_date: document.getElementById('bsTo') ? document.getElementById('bsTo').value : '',
      day_of_week: days,
      time_of_day: document.getElementById('bsT') ? document.getElementById('bsT').value : '09:00',
      duration_min: parseInt(document.getElementById('bsD') ? document.getElementById('bsD').value : '60', 10) || 60,
      kind: document.getElementById('bsKnd') ? document.getElementById('bsKnd').value : 'class',
      title_prefix: document.getElementById('bsPfx') ? document.getElementById('bsPfx').value.trim() : '',
      room: document.getElementById('bsRoom') ? document.getElementById('bsRoom').value.trim() : '',
      skip_dates: skip,
    };
  }
  window.bulkPreview = function (cid) {
    var prev = document.getElementById('bsPreviewLine');
    if (prev) prev.textContent = 'Computing…';
    var body = _getBulkPayload(cid); body.action = 'preview';
    API.request('instructor/sessions', { method: 'POST', body: body })
      .then(function (r) {
        if (prev) prev.textContent = r.count + ' session' + (r.count === 1 ? '' : 's') + ' would be created'
          + (r.dates && r.dates.length ? ': ' + r.dates.slice(0, 5).join(', ') + (r.count > 5 ? '…' : '') : '') + '.';
      }).catch(function () { if (prev) prev.textContent = 'Preview failed.'; });
  };
  window.bulkGenerate = function (cid) {
    if (!confirm('Generate sessions for this cohort?')) return;
    var btn = document.getElementById('bsGenBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Generating…'; }
    var body = _getBulkPayload(cid); body.action = 'bulk_create';
    API.request('instructor/sessions', { method: 'POST', body: body })
      .then(function (r) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate'; }
        if (window.MAM_DIALOG) window.MAM_DIALOG.toast(r.count + ' sessions created.', 'success');
        loadCohortSessions(cid);
      }).catch(function () {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate'; }
        if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not generate sessions.', 'error');
      });
  };

  // Cohort-session check-in QR (P2). Standalone twin of renderAttendance's class
  // QR modal; students scan it to self-check-in against session_attendance.
  function sessionQrModal(r) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,7,4,.78);backdrop-filter:blur(4px)';
    var qrOk = (typeof QRCode !== 'undefined');
    var label = (r.cohort_title || 'Cohort') + (r.session_title ? ' · ' + r.session_title : '');
    ov.innerHTML = '<style>#sess-qr-canvas img{width:210px!important;height:210px!important;display:block;flex:none}#sess-qr-canvas canvas{display:none}</style>'
      + '<div role="dialog" aria-modal="true" aria-label="Session check-in QR" style="max-width:400px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--border-gold);border-radius:18px;padding:26px 24px;box-shadow:0 30px 70px rgba(0,0,0,.5)">'
      + '<h3 style="font-family:var(--font-serif,Georgia,serif);margin:0 0 4px;color:var(--text)">Scan to check in</h3>'
      + '<p style="color:var(--text-muted);font-size:.85rem;margin:0 0 14px">' + P.escapeHtml(label) + ' &middot; ' + P.escapeHtml(r.date || '') + '</p>'
      + (qrOk ? '<div id="sess-qr-canvas" style="display:inline-block;background:#fff;padding:14px;border-radius:12px;margin:0 auto;line-height:0"></div>' : '')
      + '<p style="color:var(--text-soft);font-size:.78rem;margin:14px 0 0;word-break:break-all"><a href="' + encodeURI(r.url || '') + '" target="_blank" rel="noopener" style="color:var(--gold-bright)">' + P.escapeHtml(r.url || '') + '</a></p>'
      + '<p style="color:var(--text-muted);font-size:.76rem;margin:8px 0 0">Enrolled students sign in and scan &mdash; valid for the session day only.</p>'
      + '<button type="button" data-qr-close class="btn" style="margin-top:16px"><i class="fa-solid fa-xmark"></i> Close</button>'
      + '</div>';
    document.body.appendChild(ov);
    if (qrOk) { try { new QRCode(ov.querySelector('#sess-qr-canvas'), { text: r.url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    ov.querySelector('[data-qr-close]').addEventListener('click', close);
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    document.addEventListener('keydown', onKey);
  }

  function openMarkSheet(sid) {
    var area = document.getElementById('markArea');
    if (!area) return;
    area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('circle-notch fa-spin', 'Loading roster…') + '</div></section>';
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    API.request('instructor/session-attendance?session_id=' + encodeURIComponent(sid), { method: 'GET' }).then(function (r) {
      var marks = r.marks || [];
      if (!marks.length) { area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('users', 'No students enrolled in this cohort yet.') + '</div></section>'; return; }
      var rows = marks.map(function (m) {
        var btns = ATT.map(function (st) {
          var on = m.status === st;
          return '<button class="btn att-btn" data-att="' + m.student_id + '|' + st + '" style="padding:5px 9px;font-size:0.78rem' + (on ? ';background:var(--gold);color:#1A120B' : '') + '">' + st + '</button>';
        }).join(' ');
        return '<tr data-sid="' + m.student_id + '"><td>' + P.escapeHtml(m.student_name || m.student_email) + '</td><td style="display:flex;gap:6px;flex-wrap:wrap">' + btns + '</td></tr>';
      }).join('');
      area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Take attendance</h2><span id="markMsg" style="font-size:0.8rem;color:var(--text-muted)"></span></div>'
        + '<table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
      area.querySelectorAll('[data-att]').forEach(function (b) {
        b.addEventListener('click', function () {
          var p = b.getAttribute('data-att').split('|'), studentId = parseInt(p[0], 10), st = p[1];
          API.request('instructor/session-attendance', { method: 'POST', body: { session_id: sid, student_id: studentId, status: st } }).then(function () {
            var tr = b.closest('[data-sid]');
            tr.querySelectorAll('.att-btn').forEach(function (x) { x.style.background = ''; x.style.color = ''; });
            b.style.background = 'var(--gold)'; b.style.color = '#1A120B';
            var msg = document.getElementById('markMsg'); if (msg) msg.textContent = 'Saved ✓';
          }).catch(function () { if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not save attendance.', 'error'); });
        });
      });
    }).catch(function () { area.innerHTML = '<section class="panel" style="margin-top:18px"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load the roster.') + '</div></section>'; });
  }

  // ── Pre-class: teach-back review queue (PDF §17-19) ───────────────────
  function renderPreclass() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('lightbulb', 'Loading teach-backs…') + '</div></section>';
    API.request('instructor/preclass', { method: 'GET' }).then(function (r) {
      var q = (r && r.queue) || [];
      if (!q.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('circle-check', 'No teach-backs awaiting review — you’re all caught up.') + '</div></section>'; return; }
      var MD_STATUS = ['available', 'in_progress', 'developing', 'proficient', 'advanced', 'mastered', 'remedial', 'completed', 'exempted'];
      var MD_OPTS = MD_STATUS.map(function (s) { return '<option value="' + s + '">' + s.replace(/_/g, ' ') + '</option>'; }).join('');
      var cards = q.map(function (tb) {
        var evidence = tb.artifact_url ? '<a href="' + P.escapeHtml(tb.artifact_url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> View evidence</a>' : '';
        var body = tb.body ? '<blockquote style="margin:0;padding:8px 12px;border-left:3px solid var(--border);color:var(--text-muted)">' + P.escapeHtml(tb.body) + '</blockquote>' : '';
        return '<div class="panel" data-tid="' + tb.id + '" style="margin-bottom:10px"><div class="panel-head" style="align-items:flex-start"><h2 style="font-size:.95rem;margin:0">' + P.escapeHtml(tb.student_name || 'Student') + ' <span style="color:var(--text-muted);font-weight:500">— ' + P.escapeHtml(tb.module_title || '') + ' · ' + P.escapeHtml(tb.cohort_title || '') + '</span></h2><span class="pill">' + P.escapeHtml(tb.kind) + '</span></div>'
          + '<div class="panel-body" style="display:grid;gap:10px">' + body + (evidence ? '<div>' + evidence + '</div>' : '')
          + '<form class="tb-review" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
          + '<div class="field" style="width:160px"><label>Decision</label><select name="decision"><option value="ready">Ready for instruction</option><option value="clarify">Needs clarification</option><option value="more_prep">More preparation</option></select></div>'
          + ['understanding', 'accuracy', 'vocabulary', 'explanation', 'application', 'confidence'].map(function (d) { return '<div class="field" style="width:104px"><label style="text-transform:capitalize">' + d + '</label><select name="' + d + '"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>'; }).join('')
          + '<div class="field" style="flex:1;min-width:160px"><label>Feedback</label><input name="feedback" placeholder="Optional note to the student"></div>'
          + '<button type="submit" class="btn btn-primary" style="padding:9px 14px">Record</button></form>'
          + '<form class="md-form" data-lesson="' + tb.lesson_id + '" data-student="' + tb.student_id + '" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;border-top:1px dashed var(--border);padding-top:10px;margin-top:4px">'
          + '<div class="field" style="width:150px"><label>Module status</label><select name="status">' + MD_OPTS + '</select></div>'
          + '<div class="field" style="width:96px"><label>Mastery %</label><input name="mastery" type="number" min="0" max="100"></div>'
          + '<button type="submit" class="btn btn-ghost" style="padding:8px 12px">Save status</button>'
          + '<div class="field" style="width:96px"><label>Carry → wk</label><input name="week" type="number" min="1" max="24"></div>'
          + '<button type="button" class="md-cf btn btn-ghost" style="padding:8px 12px"><i class="fa-solid fa-forward"></i> Carry forward</button>'
          + '</form></div>';
      }).join('');
      content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Teach-backs to review</h2><span class="kpi-sub" style="color:var(--text-muted)">' + q.length + ' pending</span></div></section>' + cards;
      content.querySelectorAll('.tb-review').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var card = form.closest('[data-tid]'), tid = parseInt(card.getAttribute('data-tid'), 10);
          var btn = form.querySelector('button[type=submit]'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '…';
          var body = { action: 'review', teachback_id: tid, decision: form.decision.value, feedback: form.feedback.value.trim() };
          ['understanding', 'accuracy', 'vocabulary', 'explanation', 'application', 'confidence'].forEach(function (d) { if (form[d] && form[d].value) { body[d] = parseInt(form[d].value, 10); } });
          API.request('instructor/preclass', { method: 'POST', body: body }).then(function () {
            if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Teach-back reviewed.', 'success'); renderPreclass();
          }).catch(function (err) { btn.disabled = false; btn.innerHTML = orig; var m = (err && err.body && err.body.error) || 'try again'; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not save: ' + m, 'error'); else alert('Could not save.'); });
        });
      });
      function mdPost(form, body, btn) {
        var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '…';
        body.lesson_id = parseInt(form.getAttribute('data-lesson'), 10);
        body.student_id = parseInt(form.getAttribute('data-student'), 10);
        API.request('instructor/module', { method: 'POST', body: body })
          .then(function () { btn.disabled = false; btn.innerHTML = orig; if (window.MAM_DIALOG) window.MAM_DIALOG.toast(body.action === 'carry_forward' ? 'Module carried forward.' : 'Module status saved.', 'success'); })
          .catch(function (err) { btn.disabled = false; btn.innerHTML = orig; var m = (err && err.body && err.body.error) || 'try again'; if (window.MAM_DIALOG) window.MAM_DIALOG.toast('Could not update module: ' + m, 'error'); else alert('Could not update module.'); });
      }
      content.querySelectorAll('.md-form').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var body = { action: 'status', status: form.status.value };
          if (form.mastery.value !== '') body.mastery_pct = parseFloat(form.mastery.value);
          mdPost(form, body, form.querySelector('button[type=submit]'));
        });
        var cf = form.querySelector('.md-cf');
        if (cf) cf.addEventListener('click', function () {
          var body = { action: 'carry_forward' };
          if (form.week.value !== '') body.to_week = parseInt(form.week.value, 10);
          mdPost(form, body, cf);
        });
      });
    }).catch(function () { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('triangle-exclamation', 'Could not load teach-backs.') + '</div></section>'; });
  }

  function renderGradebook() {
    content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('clipboard-list', 'Loading gradebook…') + '</div></section>';
    loadGradebook().then(function (gb) {
      var ens = gb.enrollments || [], types = gb.types || [], passmark = gb.pass_mark || 50;
      if (!ens.length) {
        content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('graduation-cap', 'No course students assigned yet. When an admin approves a student\'s course and assigns it to you, they appear here to grade.') + '</div></section>';
        return;
      }
      var typeOpts = types.map(function (t) { return '<option value="' + P.escapeHtml(t.code) + '">' + P.escapeHtml(t.name) + ' (' + t.weight + '%)</option>'; }).join('');

      // ── Rubric-grid scoring (PDF §20-21) ──────────────────────────────
      var gbRubrics = null;
      function loadRubrics() {
        if (gbRubrics) return Promise.resolve(gbRubrics);
        return API.request('instructor/rubrics', { method: 'GET' }).then(function (r) { gbRubrics = (r && r.rubrics) || []; return gbRubrics; });
      }
      function rubricPanelHtml(rubrics) {
        if (!rubrics.length) return '<div style="padding:14px 18px;border-top:1px solid var(--border)">' + empty('table-cells', 'No rubrics yet — create one with “New rubric” above.') + '</div>';
        var opts = '<option value="">Choose a rubric…</option>' + rubrics.map(function (rb) { return '<option value="' + rb.id + '">' + P.escapeHtml(rb.title) + '</option>'; }).join('');
        return '<form class="gb-rubric-form" style="padding:14px 18px;border-top:1px solid var(--border);display:grid;gap:12px">'
          + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
          + '<div class="field" style="flex:1;min-width:180px"><label>Rubric</label><select name="rubric" class="rubric-select">' + opts + '</select></div>'
          + '<div class="field" style="flex:1;min-width:150px"><label>Component</label><select name="type">' + typeOpts + '</select></div></div>'
          + '<div class="rubric-grid"></div>'
          + '<div class="field"><label>Feedback (optional)</label><input name="feedback" placeholder="A short note for the record"></div>'
          + '<div style="display:flex;gap:12px;align-items:center"><button type="submit" class="btn btn-primary" disabled><i class="fa-solid fa-wand-magic-sparkles"></i> Score with rubric</button>'
          + '<span class="rubric-total" style="font-weight:700;color:var(--text-muted)"></span></div></form>';
      }
      function wireRubricForm(card, rubrics) {
        var form = card.querySelector('.gb-rubric-form'); if (!form) return;
        var sel = form.querySelector('.rubric-select'), grid = form.querySelector('.rubric-grid'),
            totalEl = form.querySelector('.rubric-total'), submit = form.querySelector('button[type=submit]'), current = null;
        function recompute() {
          if (!current) { totalEl.textContent = ''; submit.disabled = true; return; }
          var got = 0, max = 0, any = false;
          current.criteria.forEach(function (c) {
            var inp = grid.querySelector('input[data-c="' + c.id + '"]'), v = inp ? parseFloat(inp.value) : NaN,
                w = parseFloat(c.weight) || 0, mx = parseFloat(c.max_points) || 0;
            if (!isNaN(v)) { any = true; got += Math.max(0, Math.min(mx, v)) * w; }
            max += mx * w;
          });
          var pct = max > 0 ? Math.round(got / max * 1000) / 10 : 0;
          totalEl.textContent = 'Total: ' + pct + '%'; submit.disabled = !any;
        }
        sel.addEventListener('change', function () {
          current = rubrics.filter(function (r) { return String(r.id) === sel.value; })[0] || null;
          if (!current) { grid.innerHTML = ''; recompute(); return; }
          grid.innerHTML = '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Criterion</th><th style="width:90px">Score</th><th style="width:60px">Max</th><th style="width:60px">Wt</th></tr></thead><tbody>'
            + current.criteria.map(function (c) {
              return '<tr><td data-label="Criterion">' + P.escapeHtml(c.label) + '</td>'
                + '<td data-label="Score"><input type="number" min="0" step="0.5" max="' + c.max_points + '" data-c="' + c.id + '" style="width:80px"></td>'
                + '<td data-label="Max">' + c.max_points + '</td><td data-label="Wt">' + c.weight + '</td></tr>';
            }).join('') + '</tbody></table></div>';
          grid.querySelectorAll('input[data-c]').forEach(function (inp) { inp.addEventListener('input', recompute); });
          recompute();
        });
        form.addEventListener('submit', function (ev) {
          ev.preventDefault(); if (!current) return;
          var scores = {};
