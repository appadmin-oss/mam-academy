<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Student Portal — MAM Academy</title>
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/assets/css/main.css?v=20260529e">
<link rel="stylesheet" href="/assets/css/portal.css?v=20260529e">
</head>
<body>
<div class="portal-shell">
  <aside class="portal-side">
    <div class="portal-brand">
      <img src="/mam-academy-logo.svg" alt="" onerror="this.style.display='none'">
      <div>
        <div class="portal-brand-name">MAM ACADEMY</div>
        <div class="portal-brand-sub">Student Portal</div>
      </div>
    </div>
    <div class="portal-user" id="userCard"><div class="portal-avatar">?</div><div><div class="portal-user-name">Loading…</div></div></div>
    <nav class="portal-nav">
      <a class="portal-nav-link active" href="#overview" data-tab="overview"><i class="fa-solid fa-gauge"></i>Overview</a>
      <a class="portal-nav-link" href="#applications" data-tab="applications"><i class="fa-solid fa-file-pen"></i>My Applications</a>
      <a class="portal-nav-link" href="#classes" data-tab="classes"><i class="fa-solid fa-music"></i>Classes</a>
      <a class="portal-nav-link" href="#payments" data-tab="payments"><i class="fa-solid fa-credit-card"></i>Payments</a>
      <a class="portal-nav-link" href="#auditer" data-tab="auditer"><i class="fa-solid fa-clipboard-check"></i>MAM Auditer</a>
      <a class="portal-nav-link" href="#profile" data-tab="profile"><i class="fa-solid fa-user"></i>Profile</a>
    </nav>
    <div class="portal-side-foot">
      <a href="/"><i class="fa-solid fa-house"></i>Back to site</a>
      <button type="button" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
    </div>
  </aside>

  <main class="portal-main">
    <button class="portal-side-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i> Menu</button>

    <header class="portal-top">
      <h1 id="pageTitle">Overview <small id="pageSub">Welcome back</small></h1>
      <div><a class="btn btn-primary" href="/apply.html"><i class="fa-solid fa-plus"></i>New Application</a></div>
    </header>

    <div id="pwBanner" class="portal-banner" style="display:none">
      <i class="fa-solid fa-key"></i>
      <span>You're using a temporary password. <a href="#profile" data-tab="profile">Change it now →</a></span>
    </div>

    <div id="content"><div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading your dashboard…</div></div>
  </main>
</div>

<script src="/assets/js/config.js?v=20260529e"></script>
<script src="/assets/js/portal.js?v=20260529e"></script>
<script src="/assets/js/libs.js?v=20260529e" async></script>
<script>
(function () {
  var P = window.MAM_PORTAL, API = window.MAM_API;
  var content = document.getElementById('content');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var tabs = { overview: ['Overview', 'Welcome back'], applications: ['Applications', 'Every application you\'ve submitted'], classes: ['Classes', 'Your active enrollments'], payments: ['Payments', 'Your billing history'], auditer: ['MAM Auditer', 'Your placement report'], profile: ['Profile', 'Update your details'] };
  var data = null;

  function show(tab) {
    document.querySelectorAll('[data-tab]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    var t = tabs[tab] || tabs.overview;
    pageTitle.firstChild.textContent = t[0] + ' ';
    pageSub.textContent = t[1];
    if (!data) return;
    if (tab === 'overview') return renderOverview();
    if (tab === 'applications') return renderApplications();
    if (tab === 'classes') return renderClasses();
    if (tab === 'payments') return renderPayments();
    if (tab === 'auditer') return renderAuditer();
    if (tab === 'profile') return renderProfile();
  }

  function renderOverview() {
    var apps = data.applications || [], pays = data.payments || [], enr = data.enrollments || [], att = data.attendance || [];
    var paid = pays.filter(function (p) { return p.status === 'succeeded'; }).length;
    var html = ''
      + '<section class="kpi-row">'
      + kpi('Applications', apps.length, apps.length ? '+ ' + apps[0].pathway : 'None yet')
      + kpi('Paid', paid, 'of ' + pays.length + ' transactions', 'gold')
      + kpi('Active Classes', enr.filter(function (e){return e.enrollment_status==='active';}).length)
      + kpi('Attendance', att.length, att[0] ? 'Last: ' + P.fmtDate(att[0].session_date) : 'No records')
      + '</section>'
      + '<section class="panel"><div class="panel-head"><h2>Latest application</h2><a class="panel-action" href="#applications" data-tab="applications">All →</a></div>'
      + '<div class="panel-body">' + (apps[0] ? appRowFull(apps[0]) : empty('file-pen', 'No applications yet — start one.')) + '</div></section>'
      + '<section class="panel"><div class="panel-head"><h2>Upcoming &amp; active classes</h2><a class="panel-action" href="#classes" data-tab="classes">All →</a></div>'
      + '<div class="panel-body">' + (enr.length ? renderClassTable(enr.slice(0,5)) : empty('music', 'No active classes yet.')) + '</div></section>';
    content.innerHTML = html;
    bindTabLinks();
  }

  function renderApplications() {
    var apps = data.applications || [];
    if (!apps.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('file-pen', 'No applications yet.') + '</div></section>'; return; }
    var rows = apps.map(function (a) {
      return '<tr><td class="mono" data-label="Reference">' + P.escapeHtml(a.reference) + '</td>'
        + '<td data-label="Pathway · Mode">' + P.escapeHtml(a.pathway) + ' · ' + P.escapeHtml(a.mode || '—') + '</td>'
        + '<td data-label="Discipline">' + P.escapeHtml(a.discipline || '—') + '</td>'
        + '<td data-label="Total">' + P.fmtMoney(a.total_usd, 'USD') + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(a.status) + '">' + P.escapeHtml(a.status) + '</span></td>'
        + '<td data-label="Submitted">' + P.fmtDateTime(a.created_at) + '</td></tr>';
    }).join('');
    content.innerHTML = '<section class="panel"><div class="ptable-wrap"><table class="ptable"><thead><tr><th>Reference</th><th>Pathway · Mode</th><th>Discipline</th><th>Total</th><th>Status</th><th>Submitted</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  function renderClasses() {
    var enr = data.enrollments || [];
    if (!enr.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('music', 'No active enrollments yet. Your instructor will add you to a class soon.') + '</div></section>'; return; }
    content.innerHTML = '<section class="panel">' + renderClassTable(enr) + '</section>';
  }
  function renderClassTable(enr) {
    var rows = enr.map(function (e) {
      return '<tr><td data-label="Class"><strong>' + P.escapeHtml(e.title) + '</strong><br><span style="color:var(--text-muted);font-size:0.78rem">' + P.escapeHtml(e.discipline || '') + ' · ' + P.escapeHtml(e.pathway || '') + '</span></td>'
        + '<td data-label="Instructor">' + P.escapeHtml(e.instructor_name || 'TBA') + '</td>'
        + '<td data-label="Schedule">' + P.escapeHtml(e.schedule || '—') + '</td>'
        + '<td data-label="Mode">' + P.escapeHtml(e.mode || '—') + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(e.enrollment_status) + '">' + P.escapeHtml(e.enrollment_status) + '</span></td></tr>';
    }).join('');
    return '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>Class</th><th>Instructor</th><th>Schedule</th><th>Mode</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderPayments() {
    var pays = data.payments || [];
    if (!pays.length) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('credit-card', 'No payments on file.') + '</div></section>'; return; }
    var rows = pays.map(function (p) {
      return '<tr><td class="mono" data-label="Reference">' + P.escapeHtml(p.reference) + '</td>'
        + '<td data-label="Provider">' + P.escapeHtml(p.provider) + '</td>'
        + '<td data-label="Amount">' + P.fmtMoney(p.amount, p.currency) + '</td>'
        + '<td data-label="Status"><span class="pill ' + P.escapeHtml(p.status) + '">' + P.escapeHtml(p.status) + '</span></td>'
        + '<td data-label="Verified">' + (p.verified_at ? P.fmtDateTime(p.verified_at) : '—') + '</td>'
        + '<td data-label="Created">' + P.fmtDateTime(p.created_at) + '</td></tr>';
    }).join('');
    content.innerHTML = '<section class="panel"><div class="ptable-wrap"><table class="ptable"><thead><tr><th>Reference</th><th>Provider</th><th>Amount</th><th>Status</th><th>Verified</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  function renderAuditer() {
    var a = data.auditer;
    if (!a) { content.innerHTML = '<section class="panel"><div class="panel-body">' + empty('clipboard-check', 'No MAM Auditer assessment yet. <a href="/auditer.html">Learn more →</a>') + '</div></section>'; return; }
    var dims = {}; try { dims = JSON.parse(a.dimensions || '{}'); } catch (e) {}
    var meters = Object.keys(dims).map(function (k) {
      var v = parseInt(dims[k], 10);
      return '<div class="meter-item"><div class="meter-head"><span>' + P.escapeHtml(k) + '</span><strong>' + v + '%</strong></div><div class="meter-bar"><div class="meter-fill" style="width:' + v + '%"></div></div></div>';
    }).join('');
    content.innerHTML = '<section class="panel"><div class="panel-head"><h2>Your MAM Auditer Report</h2><span style="font-size:0.78rem;color:var(--text-muted)">Assessed ' + P.fmtDate(a.audited_at) + '</span></div>'
      + '<div class="auditer-mini">' + meters + (a.recommended_pathway ? '<div style="margin-top:18px;padding:14px 16px;background:rgba(224,138,26,0.07);border:1px solid var(--border-gold);border-radius:10px;font-size:0.9rem">Recommended pathway: <strong style="color:var(--gold-bright)">' + P.escapeHtml(a.recommended_pathway) + '</strong></div>' : '') + (a.notes ? '<p style="margin-top:14px;font-size:0.9rem;color:var(--text-soft);line-height:1.65">' + P.escapeHtml(a.notes) + '</p>' : '') + '</div></section>';
  }

  function renderProfile() {
    var u = data.user, c = data.customer || {};
    content.innerHTML = '<section class="panel"><form class="profile-form" id="profileForm">'
      + '<div class="field"><label for="pf-name">Full name</label><input id="pf-name" value="' + P.escapeHtml(u.name || '') + '" required></div>'
      + '<div class="field"><label for="pf-phone">Phone</label><input id="pf-phone" type="tel" value="' + P.escapeHtml(u.phone || '') + '"></div>'
      + '<div class="field"><label>Email</label><input value="' + P.escapeHtml(u.email) + '" disabled></div>'
      + '<div class="field"><label>Country</label><input value="' + P.escapeHtml(c.country || '—') + '" disabled></div>'
      + '<div class="actions"><button type="submit" class="btn btn-primary">Save profile</button></div>'
      + '</form></section>'
      + '<section class="panel"><div class="panel-head"><h2>Change password</h2></div><form class="profile-form" id="pwForm">'
      + '<div class="field"><label for="pw-current">Current password</label><input id="pw-current" type="password" required></div>'
      + '<div class="field"><label for="pw-next">New password</label><input id="pw-next" type="password" minlength="8" required></div>'
      + '<div class="actions"><button type="submit" class="btn btn-primary">Change password</button></div>'
      + '</form></section>';
    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('pf-name').value.trim();
      var phone = document.getElementById('pf-phone').value.trim();
      API.request('student/update-profile', { method: 'POST', body: { name: name, phone: phone } })
        .then(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Profile updated.', 'success') : alert('Profile updated.')); load(); })
        .catch(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Could not update profile', 'Please try again in a moment.', 'error') : alert('Could not update profile.')); });
    });
    document.getElementById('pwForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var current = document.getElementById('pw-current').value;
      var next = document.getElementById('pw-next').value;
      API.request('auth/change-password', { method: 'POST', body: { current: current, next: next } })
        .then(function () { (window.MAM_DIALOG ? window.MAM_DIALOG.toast('Password changed', 'success') : alert('Password changed.')); load(); })
        .catch(function (err) { var msg = 'Could not change password: ' + (err.body && err.body.error || 'unknown'); (window.MAM_DIALOG ? window.MAM_DIALOG.alert('Password change failed', msg, 'error') : alert(msg)); });
    });
  }

  function kpi(label, value, sub, cls) {
    return '<div class="kpi"><div class="kpi-label">' + P.escapeHtml(label) + '</div><div class="kpi-value ' + (cls || '') + '">' + value + '</div><div class="kpi-sub">' + P.escapeHtml(sub || '') + '</div></div>';
  }
  function empty(icon, text) { return '<div class="empty-state"><i class="fa-solid fa-' + icon + '"></i>' + text + '</div>'; }
  function appRowFull(a) {
    return '<div style="padding:22px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">'
      + '<div><div class="mono" style="color:var(--gold-bright);font-size:0.92rem;margin-bottom:4px">' + P.escapeHtml(a.reference) + '</div>'
      + '<div style="font-family:var(--font-serif);font-size:1.25rem;color:var(--text);font-weight:700">' + P.escapeHtml(a.pathway) + ' · ' + P.escapeHtml(a.discipline || '') + '</div>'
      + '<div style="color:var(--text-muted);font-size:0.86rem;margin-top:2px">Mode: ' + P.escapeHtml(a.mode || '—') + ' · Submitted ' + P.fmtDateTime(a.created_at) + '</div></div>'
      + '<div style="text-align:right"><div style="font-family:var(--font-display);font-size:1.6rem;color:var(--gold-bright)">' + P.fmtMoney(a.total_usd, 'USD') + '</div>'
      + '<span class="pill ' + P.escapeHtml(a.status) + '" style="margin-top:4px">' + P.escapeHtml(a.status) + '</span></div></div></div>';
  }

  function bindTabLinks() {
    document.querySelectorAll('[data-tab]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var t = a.getAttribute('data-tab'); if (!t) return;
        e.preventDefault(); show(t);
        try { history.replaceState(null, '', '#' + t); } catch (e2) {}
      });
    });
  }

  function load() {
    return API.request('student/dashboard').then(function (r) {
      data = r; data.user = r.user;
      P.mountUserCard({ name: r.user.name, email: r.user.email, role: 'student', avatar_url: r.user.avatar_url });
      if (r.user.must_change_password) document.getElementById('pwBanner').style.display = 'flex';
      var tab = (location.hash || '#overview').slice(1);
      if (!tabs[tab]) tab = 'overview';
      show(tab);
    });
  }

  P.requireAuth(['student']).then(function () {
    P.init();
    bindTabLinks();
    return load();
  }).catch(function (e) {
    if (e.message !== 'unauthenticated') {
      content.innerHTML = empty('triangle-exclamation', 'Could not load your dashboard. Please refresh or sign in again.');
    }
  });
})();
</script>
</body>
</html>
