<!DOCTYPE html>
<html lang="en" data-portal="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student portal · MAM Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your practice, your classes, where you stand and what needs you today at MAM Academy.">
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<!-- ONE stylesheet, as on the guardian and instructor portals. portal-v2.css is
     scoped under [data-portal="v2"] and is a complete design system; main.css
     and portal.css are the warm dark set, and the legacy dashboard at
     classic.html loads all three. Loading both palettes on one page is the
     theme-on-theme bug this rebuild removes. -->
<link rel="stylesheet" href="/assets/css/portal-v2.css?v=20261120g">
<script>
/* Pre-paint, so a student who has chosen larger text or dark never sees one
   frame of the other. Attributes on the root; portal-v2.css does the rest.
   The key is shared with the guardian and instructor portals on purpose: it is
   one person's preference about their eyes, not a per-portal setting. */
(function () {
  var r = document.documentElement;
  try {
    var a = JSON.parse(localStorage.getItem('mam-guardian-a11y') || '{}');
    if (a.text === 'lg' || a.text === 'xl') r.setAttribute('data-text', a.text);
    if (a.ease)    r.setAttribute('data-ease', '1');
    if (a.lowdata) r.setAttribute('data-lowdata', '1');
    if (a.theme === 'dark' || a.theme === 'light') r.setAttribute('data-theme', a.theme);
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) r.setAttribute('data-theme', 'dark');
  } catch (e) { /* a broken preference must never stop the page rendering */ }
})();
</script>
</head>
<body>

<a class="p-skip" href="#main">Skip to the main content</a>

<div class="p-app">

  <!-- The nav comes FIRST in the DOM. On mobile it is position:fixed so source
       order is irrelevant; on desktop .p-app becomes a flex row and source
       order is what puts the rail on the left, where the design has it. -->
  <nav class="p-nav" id="nav" aria-label="Student portal">
    <a class="p-rail-brand" href="/">
      <img src="/mam-academy-logo.svg" alt="" width="32" height="32">
      <span><span class="p-rail-word">MAM ACADEMY</span><span class="p-rail-sub">Student</span></span>
    </a>
    <!-- Home · Train · Learn · Attend · More, in the handoff's order.
         `Pay` is deliberately NOT in the bar (handoff §2): it surfaces on Home
         when something is owed, and for an under-16 the guardian pays. Train
         earns its slot because it is the only destination a student should
         open daily. -->
    <button type="button" data-screen="home" aria-current="page">
      <i class="fa-solid fa-house" aria-hidden="true"></i>Home
    </button>
    <button type="button" data-screen="train">
      <i class="fa-solid fa-dumbbell" aria-hidden="true"></i>Train
    </button>
    <button type="button" data-screen="learn">
      <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>Learn
    </button>
    <button type="button" data-screen="attend">
      <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>Attend
    </button>
    <button type="button" data-sheet-open>
      <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>More
    </button>
    <div class="p-rail-foot">
      <div class="p-who">
        <span class="p-avatar is-sm" id="railInitials" aria-hidden="true"></span>
        <span class="p-who-main"><span class="p-title" id="railName">Student</span>
        <span class="p-caption" id="railCourse"></span></span>
      </div>
    </div>
  </nav>

  <div class="p-body-col">
    <header class="p-top">
      <div class="p-top-main">
        <div class="p-title" id="whoName">Student portal</div>
        <div class="p-caption" id="whoMeta">Loading your day…</div>
      </div>
      <button type="button" class="p-icon" data-screen="money" id="moneyBtn"
              aria-label="Fees and charges">
        <i class="fa-solid fa-receipt" aria-hidden="true"></i>
        <span class="p-badge" id="moneyBadge" hidden></span>
      </button>
    </header>

    <main class="p-scroll" id="main">
      <div class="p-empty">
        <i class="fa-solid fa-circle-notch p-spin" aria-hidden="true"></i>
        <p>Loading today…</p>
      </div>
    </main>
  </div>
</div>

<!-- The More bottom-sheet. On desktop the same list renders inline (the sheet
     positioning is unset above 900px) so nothing is only reachable by a
     gesture. -->
<div class="p-sheet" id="sheet" hidden>
  <button type="button" class="p-sheet-scrim" data-sheet-close aria-label="Close the menu"></button>
  <div class="p-sheet-body" role="dialog" aria-modal="true" aria-label="More">
    <div class="p-sheet-grip" aria-hidden="true"></div>

    <button type="button" class="p-row is-tall" data-screen="a11y">
      <i class="fa-solid fa-sliders p-row-ico is-accent" aria-hidden="true"></i>
      <span class="p-row-main">
        <span class="p-title">Display &amp; access</span>
        <span class="p-caption">Text size, easier type, less data, dark mode</span>
      </span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>

    <div class="p-label p-sheet-head">Your work</div>
    <button type="button" class="p-row" data-screen="growth">
      <i class="fa-solid fa-arrow-trend-up p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">My growth</span><span class="p-caption">Week by week, and your goals</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="repertoire">
      <i class="fa-solid fa-music p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Repertoire</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>

    <button type="button" class="p-row" data-screen="space">
      <i class="fa-solid fa-people-group p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Class</span><span class="p-caption">Hand in work, see your class</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="concern">
      <i class="fa-solid fa-shield-halved p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Worried about something?</span><span class="p-caption">Tell the safeguarding officer</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>

    <div class="p-label p-sheet-head">Account</div>
    <button type="button" class="p-row" data-screen="card">
      <i class="fa-solid fa-id-card p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">My ID card</span><span class="p-caption">Show it at the door and in class</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="money">
      <i class="fa-solid fa-receipt p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Fees &amp; charges</span></span>
      <span class="p-count" id="sheetOwed" hidden></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <!-- The redesign covers five destinations; the legacy dashboard serves
         twenty-three tabs (courses, curriculum, assignments, grades, payments,
         orders, recitals, support, applications, handbook …) and is NOT
         retired until each has been rebuilt here. Same arrangement as
         portal/instructor/classic.html and admin/index.php beside
         admin/console.php: both reachable, each linking to the other. -->
    <a class="p-row" href="/portal/student/classic.html">
      <i class="fa-solid fa-table-columns p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main">
        <span class="p-title">Everything else</span>
        <span class="p-caption">Courses, curriculum, assignments, grades, payments, orders, recitals, support</span>
      </span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </a>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <!-- Calendar subscriptions (calendar-subscribe.js): Google / Apple / Outlook. -->
    <div data-cal-subscribe></div>
    <button type="button" class="p-row" id="signOut">
      <i class="fa-solid fa-arrow-right-from-bracket p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Sign out</span></span>
    </button>
  </div>
</div>

<!-- Write feedback. NEVER an optimistic tick (handoff §2.4): a control goes
     busy, then reports what actually happened. A dishonest success state loses
     a practice log, and a lost log breaks the streak the whole loop depends
     on. `aria-live=polite` so the sentence reaches a screen reader without
     interrupting. -->
<div class="p-toast" id="toast" role="status" aria-live="polite" hidden>
  <i class="fa-solid fa-circle-info" aria-hidden="true"></i><span id="toastText"></span>
  <!-- Shown only for a FAILURE, which is also the only kind that does not
       time out. A success may vanish on its own; an error is often the only
       record that the thing the reader pressed did not happen, and five
       seconds is not long enough to read it, look at the control it refers
       to, and act. -->
  <button type="button" class="p-toast-x" id="toastClose" aria-label="Dismiss this message" hidden>
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<script src="/assets/js/config.js?v=20261120a"></script>
<script src="/assets/js/portal.js?v=20261120b"></script>
<script src="/assets/js/media-upload.js?v=20261120a"></script>
<script src="/assets/js/portal-spaces.js?v=20261120a"></script>

</body>
</html>
