<!DOCTYPE html>
<html lang="en" data-portal="v2">
<head>
<meta charset="utf-8">
<!-- ⚠️ `viewport-fit=cover` is load-bearing, not decoration. portal-v2.css
     reads `env(safe-area-inset-bottom)` in four places — the bottom bar's
     height and padding, the sheet's foot, and the toast's offset — and
     those insets are 0 unless the viewport covers the display. Without it
     iOS letterboxes the whole page into the safe area, so this portal's
     bar rendered differently from its two siblings on any notched device.
     The three must agree; they share the stylesheet. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardian portal · MAM Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Attendance, ratified reports, fees and consents for your children at MAM Academy.">
<link rel="icon" type="image/svg+xml" href="/mam-academy-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
<!-- ONE stylesheet. portal-v2.css is scoped under [data-portal="v2"] and is a
     complete design system in its own right; main.css and portal.css are the
     warm dark set the student and instructor portals still use, and loading both
     palettes on one page is the theme-on-theme bug this rebuild removes. -->
<link rel="stylesheet" href="/assets/css/portal-v2.css?v=20260929a">
<script>
/* Pre-paint, so a guardian who has chosen larger text or dark never sees one
   frame of the other. Attributes on the root; portal-v2.css does the rest. */
(function () {
  var r = document.documentElement;
  try {
    var a = JSON.parse(localStorage.getItem('mam-guardian-a11y') || '{}');
    if (a.text === 'lg' || a.text === 'xl') r.setAttribute('data-text', a.text);
    if (a.ease)    r.setAttribute('data-ease', '1');
    if (a.lowdata) r.setAttribute('data-lowdata', '1');
    if (a.theme === 'dark' || a.theme === 'light') r.setAttribute('data-theme', a.theme);
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) r.setAttribute('data-theme', 'dark');
  } catch (e) { /* a broken preference must never stop the page rendering */ }
})();
</script>
</head>
<body>

<a class="p-skip" href="#main">Skip to the main content</a>

<div class="p-app">

  <!-- The nav comes FIRST in the DOM. On mobile it is position:fixed so source
       order is irrelevant; on desktop .p-app becomes a flex row and source order
       is what puts the rail on the left, where the design has it. -->
  <nav class="p-nav" id="nav" aria-label="Guardian portal">
    <div class="p-switcher" id="switcher" hidden>
      <div class="p-seg" role="group" aria-labelledby="switcherLabel" id="switcherSeg"></div>
      <span class="p-sr" id="switcherLabel">Which child</span>
    </div>
    <button type="button" data-screen="dashboard" aria-current="page">
      <i class="fa-solid fa-house" aria-hidden="true"></i>Home
    </button>
    <button type="button" data-screen="children">
      <i class="fa-solid fa-children" aria-hidden="true"></i>Children
    </button>
    <button type="button" data-screen="reports">
      <i class="fa-solid fa-file-lines" aria-hidden="true"></i>Reports
    </button>
    <button type="button" data-screen="finance">
      <i class="fa-solid fa-credit-card" aria-hidden="true"></i>Finance
      <span class="p-badge" id="financeBadge" hidden></span>
    </button>
    <button type="button" data-sheet-open>
      <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>More
    </button>
  </nav>

  <div class="p-body-col">
    <header class="p-top">
      <div class="p-top-main">
        <div class="p-title" id="whoName">Guardian portal</div>
        <div class="p-caption" id="whoMeta">Loading your account…</div>
      </div>
      <button type="button" class="p-icon" data-screen="messages" id="bell"
              aria-label="Messages from the academy">
        <i class="fa-regular fa-bell" aria-hidden="true"></i>
        <span class="p-badge" id="msgBadge" hidden></span>
      </button>
    </header>

    <main class="p-scroll" id="main">
      <div class="p-empty">
        <i class="fa-solid fa-circle-notch p-spin" aria-hidden="true"></i>
        <p>Loading your children…</p>
      </div>
    </main>
  </div>
</div>

<!-- The More bottom-sheet. On desktop the same list renders inline (the sheet
     positioning is unset above 900px) so nothing is only reachable by a gesture. -->
<div class="p-sheet" id="sheet" hidden>
  <button type="button" class="p-sheet-scrim" data-sheet-close aria-label="Close the menu"></button>
  <div class="p-sheet-body" role="dialog" aria-modal="true" aria-label="More">
    <div class="p-sheet-grip" aria-hidden="true"></div>
    <button type="button" class="p-row is-tall" data-screen="a11y">
      <i class="fa-solid fa-sliders p-row-ico is-accent" aria-hidden="true"></i>
      <span class="p-row-main">
        <span class="p-title">Display &amp; access</span>
        <span class="p-caption">Text size, easier type, less data, dark mode</span>
      </span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <button type="button" class="p-row" data-screen="consents">
      <i class="fa-solid fa-file-signature p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Consents &amp; forms</span></span>
      <span class="p-badge" id="consentBadge" hidden></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="reports">
      <i class="fa-solid fa-file-lines p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Reports &amp; results</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="timetable">
      <i class="fa-solid fa-calendar-days p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Timetable &amp; term dates</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="makeup">
      <i class="fa-solid fa-ticket p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Make-up lessons</span></span>
      <span class="p-caption" id="makeupCount"></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="bursary">
      <i class="fa-solid fa-hand-holding-dollar p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Apply for a bursary</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="safeguarding">
      <i class="fa-solid fa-shield-halved p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Safeguarding &amp; who to tell</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <button type="button" class="p-row" data-screen="complaints">
      <i class="fa-solid fa-scale-balanced p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Complaints &amp; appeals</span></span>
      <i class="fa-solid fa-chevron-right p-row-go" aria-hidden="true"></i>
    </button>
    <div class="p-sheet-rule" aria-hidden="true"></div>
    <button type="button" class="p-row" id="signOut">
      <i class="fa-solid fa-arrow-right-from-bracket p-row-ico" aria-hidden="true"></i>
      <span class="p-row-main"><span class="p-title">Sign out</span></span>
    </button>
  </div>
</div>

<!-- Write feedback. Never an optimistic tick (design refusal 7): a control goes
     busy, then reports what actually happened. `aria-live=polite` so the sentence
     reaches a screen reader without interrupting. -->
<div class="p-toast" id="toast" role="status" aria-live="polite" hidden>
  <i class="fa-solid fa-circle-info" aria-hidden="true"></i><span id="toastText"></span>
  <!-- Shown only for a FAILURE, which is also the only kind that does not
       time out. A success may vanish on its own; an error is often the only
       record that the thing the reader pressed did not happen, and five
       seconds is not long enough to read it, look at the control it refers
       to, and act. -->
  <button type="button" class="p-toast-x" id="toastClose" aria-label="Dismiss this message" hidden>
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<script src="/assets/js/config.js?v=20260807a"></script>
<script src="/assets/js/portal.js?v=20260817c"></script>
<script src="/assets/js/portal-guardian.js?v=20261119a"></script>
</body>
</html>
