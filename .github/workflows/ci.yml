name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, curl, openssl, json
          coverage: none

      - name: Lint every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './api/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run full test suite (auto-discovers every api/tests/test_*.php)
        run: php api/tests/run.php

      # The SQLite mirror is generated from the canonical MySQL file. v1 drifted
      # exactly here — a migration landed in one and not the other — so a stale
      # mirror fails the build rather than being discovered on a deploy.
      - name: Verify the schema-v2 SQLite mirror is not stale
        run: php api/tools/schema-v2-sqlite.php --check

  mysql:
    # ── THE PRODUCTION ENGINE ────────────────────────────────────────────
    # The job above runs the suite on SQLite, which is the DEVELOPMENT
    # database. Production runs MySQL/MariaDB, and seven defects have already
    # existed only there — a role ENUM with no 'parent' that made every
    # guardian account uncreatable, date('c') into DATETIME columns that
    # silently dropped every mail_log row, an ON DELETE SET NULL on a
    # CHECK-referenced column that took four tables out of the schema, and
    # four more. Every one of them passed a green SQLite build. Until this
    # job existed the production engine was never exercised before a deploy.
    #
    # MariaDB rather than MySQL 8 deliberately: db/schema-mysql.sql uses
    # `ADD COLUMN IF NOT EXISTS`, which is MariaDB syntax, and the file's own
    # notes say MySQL 8 needs the migration blocks run once by hand. Covering
    # MySQL 8 as well means making the schema portable first; that is a
    # separate piece of work, not something to fake with a second matrix row.
    name: PHP tests against MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: mam_suite
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, openssl, json
          coverage: none

      # ⚠️ --force is required, not defensive. The file re-runs its own
      # migration blocks, so a fresh database throws ~35 "duplicate column"
      # errors and everything after them still applies. WITHOUT --force the
      # first error stops the import and you get 18 tables instead of ~130 —
      # and the suite then fails in a way that looks like a code regression.
      #
      # The client runs INSIDE the service container. The runner image stopped
      # shipping a `mariadb`/`mysql` client (2026-11: "mariadb: command not
      # found", exit 127, before a single test ran); the server image always
      # carries its own, at the server's own version.
      - name: Apply the MySQL schema
        env:
          MDB: docker exec -i ${{ job.services.mariadb.id }} mariadb -u root -pci
        run: |
          $MDB -e "DROP DATABASE IF EXISTS mam_suite; CREATE DATABASE mam_suite CHARACTER SET utf8mb4;"
          $MDB --force mam_suite < db/schema-mysql.sql

      # The import above cannot fail the build (--force swallows errors), so
      # the table count is what proves it actually landed. A stopped import
      # leaves 18; a good one leaves ~130.
      - name: Verify the schema actually imported
        env:
          MDB: docker exec -i ${{ job.services.mariadb.id }} mariadb -u root -pci
        run: |
          COUNT=$($MDB -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mam_suite';")
          echo "tables: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::Only $COUNT tables — the schema import stopped early (is --force still on?)"
            exit 1
          fi

      # 14 files introspect sqlite_master/PRAGMA and skip themselves here;
      # run.php prints which. The rest of the suite runs against MariaDB.
      - name: Run the suite against MariaDB
        env:
          DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=mam_suite;charset=utf8mb4'
          DB_USERNAME: root
          DB_PASSWORD: ci
        run: php api/tests/run.php

  js:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check front-end JS (incl. .cjs)
        run: |
          set -e
          for f in $(find assets/js -name '*.js' -o -name '*.cjs'); do
            node --check "$f"
          done
      # The step above only PARSES assets/js. These three actually run the
      # self-tests and parse the pages' inline scripts. The headshot self-test
      # in particular sat broken for months because it was only ever parsed.
      - name: Inline <script> syntax check (portals and other HTML pages)
        run: node .github/scripts/check-inline-js.cjs
      - name: Notation capture self-test (pitch detector + segmenter)
        run: node assets/js/notation.selftest.cjs
      - name: ID card imposition + cut guides self-test
        run: node assets/js/card-export.selftest.cjs
      - name: Headshot quality + downscale self-test
        run: node assets/js/headshot.selftest.cjs
      - name: Schedule grid date-math self-test
        run: node assets/js/schedule-grid.selftest.cjs

      - name: v2 clarity kit (status chips, to-do list, preferences)
        run: node assets/js/v2-clarity.selftest.cjs
