; PHP per-directory overrides for the API (read by PHP-CGI / PHP-FPM / LiteSpeed).
;
; Headshot uploads arrive as a base64 image data URL inside a JSON body, which is
; ~1.4x the size of the source image. The app permits up to 8 MB of source bytes
; (api/modules/integrations/lib/uploads.php: MAM_UPLOAD_MAX_BYTES), so a legitimate POST body can reach
; ~11 MB. PHP's default post_max_size is 8M, so without this the server would
; reject large-but-valid uploads BEFORE the script runs — many hosts answer that
; with an HTML error page, which the browser then fails to JSON-parse.
;
; (Clients also downscale before upload, so this is a safety ceiling, not the
; expected payload size. This file is already blocked from web download by the
; \.ini$ rule in .htaccess; PHP still reads it from disk.)
post_max_size = 16M
upload_max_filesize = 16M
max_input_time = 60
