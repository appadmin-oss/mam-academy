<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Something went wrong — MAM Academy</title>
<style>
  :root { --bg: #FAF8F4; --ink: #211A13; --muted: #5C5046; --accent: #8A5208; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B140D; --ink: #F3ECE2; --muted: #C9BBA8; --accent: #F2A93B; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 32px 16px; }
  h1 { font: 500 clamp(30px, 5vw, 48px)/1.1 Georgia, serif; margin: 0 0 16px; }
  p { max-width: 34rem; margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Something went wrong on our side</h1>
  <p>The page could not be shown just now. Nothing you did caused this, and the academy has been told.</p>
  <p>Please try again in a few minutes, or go back to the <a href="/">home page</a>.</p>
</main>
</body>
</html>
